findings:
  - >-
    The listener process never died on its own while Windows was up: every start follows a boot, a crash or a deliberate
    restart. No "listener crash" cause was found.
  - >-
    Modern Standby is not a drop cause: notes #75-#84 were heard 18:33-18:58 on 10-23, inside the 14:07-18:42 standby,
    and #61 at 11:02 inside the 05:23-11:25 one; the listener survived every standby with no restart. The card logs
    "link down" (e1dexpress 27) at some standby entries on 10-25 with no matching gap in the notes. Card power saving
    is not shown as a cause: awake, the card dropped only for 1 s (10-22 21:30) and renegotiated once (10-28 09:01).
  - >-
    Three unexpected shutdowns (10-27 04:13, 10-27 16:53, 10-28 04:01) caused three of the drops. Their cause is not
    in these logs (no Kernel-Power 41); heat during long builds is the first suspect (fieldkit-fan-control-test).
  - >-
    The longest drop (10-27 17:28 to 10-28 04:01, 10.5 h) was the peer switched off, which the heal treated as lost
    and retried every 15 minutes, 42 times in that window.
  - >-
    C5: 70 "REFUSED a connection from 10.77.0.1" lines; all from this laptop's own checks (link_setup.listening at each
    start, link_heal rung "own" at each 15-min comms check). Fixed on fix/c5-self-knock.

mechanisms:   # the five keep-alive mechanisms named in C4, judged on this log
  keepalive-task:
    what: "\\fieldkit-link task (Windows: at logon + every 5 min) / systemd user service with linger (Linux)"
    record: "brought the listener back after all three crashes, 27-44 s after boot"
    verdict: KEEP
    why: "the one mechanism that brought the link back on this log"
  watchdog:
    what: "fieldkit peers link watchdog: restart a deaf listener"
    record: "never ran on this laptop (no watchdog.log); its restart is what the service manager already does"
    verdict: DROP
    why: "its restart duplicates the service manager (Linux: systemd Restart=); the job supervision it also hosts on the
      boss needs its own timer first (not checked here)"
  heal:
    what: "fieldkit peers link heal, run by the 15-min comms check"
    record: "49 runs logged, 0 revived; 47 of them against a peer switched off on purpose"
    verdict: DROP
    why: "as a timer; it stays a command run on purpose; a peer with no neighbor entry is off, not retried"
  rescue:
    what: "the rescue door (rescue-status) when the listener is down"
    record: "never used on this laptop (no rescue.log)"
    verdict: NOT-A-KEEP-ALIVE
    why: "a manual door, kept as one"
  zero-check:
    what: "fieldkit net check --scheduled every 15 min"
    record: "its cable row is what called heal; its own job is the net's leases"
    verdict: KEEP-WITHOUT-CABLE-REVIVE
    why: "its own job is the net's leases"

proposal: >
  Keep one keep-alive: the service manager (Windows logon task with its 5-minute re-run, Linux systemd user service
  with Restart=always and linger). Remove the cable revive from the comms check and the watchdog's restart; heal and
  rescue stay commands a person or a model runs on purpose. Mark a peer with no neighbor entry and no ping as "off",
  not "lost", and stop retrying it until it is heard again. Separately, find the cause of the three unexpected
  shutdowns (thermal log during the next long build).
