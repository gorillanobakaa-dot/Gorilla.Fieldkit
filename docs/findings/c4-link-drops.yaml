# C4 (docs/HARNESS-PLAN.md phase 6): every listener start and link drop on the Windows laptop [L15-WIN], 2026-10-22
# to 2026-10-28 19:15, with its cause. Read on 2026-10-28 from:
#   link.log    ~/.fieldkit/link/link.log (383 lines; "serving on" = a listener started, so the one before it ended)
#   events      Windows System log: Kernel-Power 506/507 (Modern Standby in/out), 42/107 (sleep), Kernel-General 12/13
#               (boot/shutdown), EventLog 6005/6006/6008 (6008 = the previous shutdown was unexpected),
#               e1dexpress 27/32/33 (Intel I219-V cable card: link down / up / up at a lower speed)
#   tasks       schtasks: \fieldkit-link (at logon + every 5 min: pythonw -m fieldkit peers link serve),
#               \Fieldkit net comms check (every 15 min: fieldkit net check --scheduled, which calls link_heal.revive)
# Not read: the VAIO's own logs (its side of each drop). No watchdog.log or rescue.log exists on this laptop.
# All times are the laptop's local time (both logs use it).

causes:
  setup: the listener was started by the pairing or a deliberate restart (new code, keep-alive install)
  standby: Windows Modern Standby before the start; NOT shown to cut the link (notes were heard during standby)
  reboot: the laptop booted; the listener came back from the \fieldkit-link logon task
  crash: Windows logged the previous shutdown as unexpected (6008); no Kernel-Power 41 or bugcheck was logged, so
    the cause (power, heat, hang) is NOT in these logs
  peer-off: 'the peer was shut down or asleep, ours was fine (heal said "peer is down or asleep, or the cable is out")'
  stale-code: a listener kept serving code loaded at its start after newer code landed
  unknown: no power, card or crash event near it; most likely a hand restart on a day of link development

