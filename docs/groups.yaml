    sources:
      - buildh/__init__.py
      - buildh/answer.py
      - buildh/cli.py
      - buildh/decision.py
      - buildh/deferred.py
      - buildh/export.py
      - buildh/firefox.py
      - buildh/fluent.py
      - buildh/handedit.py
      - buildh/keyed.py
      - buildh/prefs.py
      - buildh/probe.py
      - buildh/probe_compare.py
      - buildh/probe_servers.py
      - buildh/releasecheck.py
      - buildh/relocate.py
      - buildh/replay.py
      - buildh/reprobuild.py
      - buildh/changecheck.py
      - buildh/snapshot.py
      - buildh/task.py
      - buildh/techniques.py
      - buildh/uicheck.py
      - buildh/upstream.py
      - buildh/vault.py
      - buildh/worker.py

  - name: verify-and-build
    title: Verify the ported tree, repair it and run the build
    sources:
      - buildh/audit.py
      - buildh/buildrun.py
      - buildh/claude_watch.py
      - buildh/compare.py
      - buildh/compile.py
      - buildh/creepfix.py
      - buildh/icons.py
      - buildh/images.py
      - buildh/weigh.py
      - buildh/aboutpages.py
      - buildh/aboutregistry.py
      - buildh/hiddendocs.py
      - buildh/releasecover.py
      - buildh/removedpages.py
      - buildh/tabborders.py
      - buildh/pkgproof.py
      - buildh/timebombs.py
      - buildh/calibrate.py
      - buildh/stops.py
      - buildh/power.py
      - buildh/buildstamp.py
      - buildh/satellite.py
      - buildh/window.py
      - buildh/herald.py
      - buildh/mozbuild_rules.py
      - buildh/ownercheck.py
      - buildh/preflight.py
      - buildh/recorder.py
      - buildh/repair.py
      - buildh/stats.py
      - buildh/symbols.py
      - buildh/truthbound.py
      - buildh/verify.py

  - name: install-and-proof
    title: Install the built browser and prove it
    sources: [buildh/capture.py, buildh/claims.py, buildh/decisions.py, buildh/install.py, buildh/leaks.py, buildh/proof.py, buildh/throwaway.py]

  - name: audio
    title: The Linux sound chain, read-only (each stage, what is done twice, the exact fix)
    sources: ["audio/*.py"]

  - name: career
    title: A CV and a UK job hunt for one candidate (fixed rules, verified facts only, never submits)
    sources: ["career/*.py"]

  - name: academic
    title: Academic work for students in seven countries (the dates asked, references, style, language, words, plagiarism pre-check, the next step)
    sources: ["academic/*.py"]

  - name: laptop
    title: "A laptop's everyday repairs: the processor locked slow, voice alerts when an AI needs you, low sound, the volume, the NVIDIA panel, the wallpaper, identical AI rule files"
    sources: ["laptop/*.py"]

  - name: hdmi
    title: "The HDMI Harness for an agent: read-only checks, and connect the TV with the GPU-driver repair, elevated and waited for"
    sources: ["hdmi/*.py"]

  - name: win11
    title: "The Windows 11 tweaks framework, driven safely: modules, fit to this PC, the maker's buttons, elevated runs"
    sources: ["win11/*.py"]

  - name: peers
    title: "Messages between AI sessions on this computer, in Gorilla OpenCode's protocol: list, send, wait"
    sources: ["peers/*.py"]

  - name: evidence
    title: "Research evidence that can be checked later: pages kept by hash, every claim of a run against its page"
    sources: ["evidence/*.py"]

  - name: methods
    title: "How the work gets done, as tools (wait, mutate, regress, drift, mcp-probe, survey, i18n, ship, handover)"
    sources: ["method/*.py"]

  - name: icons
    title: "Sharp desktop icons on any computer (IconKit: the icon cache, .ico frames and checks, crisp recoloured icons)"
    sources: ["icons/*.py"]

  - name: netbench
    title: Network benches B1-B5 (bytes, load time, throughput, HTTP/3 buffers, RAM, keepalive) through an emulated link, local servers only
    sources: ["netbench/*.py"]

  - name: decision-briefs
    title: Decision briefs, never a bare question (what is affected, every option, its cost, the recorded answer)
    sources: ["briefs/*.py"]

  - name: migration-control
    title: Migration control (intent ledger, stages and gates, SITREP, drift guard) for porting to a new Firefox
    sources: ["migrate/*.py"]

  - name: leakgate
    title: Leakgate, the fail-closed leak and telemetry release gate
    sources: ["leakgate/*.py"]

  - name: visual
    title: Visual quality, crisp icons and aligned pages of the built browser
    sources: ["visual/*.py"]

  - name: documentation
    title: Gorilla.Documentation.IBM.Style, the documentation workflow itself
    sources: ["gdocs/*.py"]
