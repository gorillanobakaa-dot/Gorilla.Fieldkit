# Version: 1.0.0 · updated 26-10-28-19-15
# speaker-loudness-fix: one Python script (standard library only) that installs a loudness compressor in front of the
# sound card. Nothing is compiled or packaged: the release file is the script itself. The stages are what its CI
# release workflow (.github/workflows/release.yml) checks, keyed by what they read:
#   iterate  -> the script compiles and answers --help (nothing on the machine changes), a telemetry scan
#   release  -> the release page carries both tracks in full (--mode release --var tag=vX)
# Not a stage: --status (it reads this machine's sound setup, so its answer is not a property of the source) and the
# install itself (it changes the sound setup of the machine it runs on).
name: speaker-loudness-fix
description: >-
  speaker-loudness-fix from its tree: the script compiles and answers --help, a telemetry scan; with --mode release
  the release page check.
baseline_minutes: 1
vars:
  src: "${DOCUMENTS}/speaker-loudness-fix"
  py: python3                       # Windows: --var py=python
  fk: "${FIELDKIT}/.venv/bin/python"
  tag: "v1.0.0"                     # the release being checked: --var tag=vX
sources:
  - {id: src, git: "{src}", track: tree}
config:
  mandate: speaker-loudness-fix
toolchain:
  - ["{py}", --version]
preflight: {disk_gb: 1, ram_gb: 1, path: "{src}"}
docs_only: {source: src}
stages:
  - id: privacy
    run: {python: "fieldkit.emerge.stages:telemetry_scan", args: {path: "{src}"}}
    uses: [sources]
    needs: []
    privacy: true
    bucket: tests

  - id: compile
    run: {cmd: ["{py}", -I, -m, py_compile, "{src}/speaker_loudness_setup.py"], cwd: "{src}"}
    timeout: 120
    inputs: ["{src}/speaker_loudness_setup.py"]
    uses: [toolchain, inputs]
    needs: []
    bucket: tests

  - id: cli
    run: {cmd: ["{py}", -I, "{src}/speaker_loudness_setup.py", --help], cwd: "{src}"}
    timeout: 120
    inputs: ["{src}/speaker_loudness_setup.py"]
    uses: [toolchain, inputs]
    needs: [compile]
    bucket: tests

  - id: release-page
    run:
      cmd: ["{fk}", -P, -m, fieldkit, release-page, check, "{src}/release-notes/{tag}/page.md",
            --layman, "{src}/release-notes/{tag}/layman.md", --developer, "{src}/release-notes/{tag}/developer.md"]
      cwd: "{src}"
    timeout: 300
    inputs: ["{src}/release-notes/{tag}/*.md"]
    uses: [inputs]
    needs: []
    tier: release
    fix: false                      # the page is the owner's explanation: a model does not rewrite it to pass
