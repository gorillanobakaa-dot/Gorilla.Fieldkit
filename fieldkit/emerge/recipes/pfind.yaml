# Version: 1.0.0 · updated 26-10-28-19-49
# pfind: one Python script (pfind.py, standard library only; ripgrep when it is there) that searches files, with
# pfind.cmd as its Windows launcher. Nothing is compiled or packaged: the script is the product. Keyed by what they
# read:
#   iterate  -> the script compiles and answers --help, its tests (tests/, pytest; both search engines), a telemetry
#               scan
# pytest is not in the standard library: --var py=PATH names a Python that has it (default python3 on PATH).
name: pfind
description: >-
  pfind from its tree: pfind.py compiles and answers --help, its pytest tests, a telemetry scan.
baseline_minutes: 2
vars:
  src: "${DOCUMENTS}/pfind"
  py: python3                       # Windows: --var py=python
sources:
  - {id: src, git: "{src}", track: tree}
config:
  mandate: pfind
toolchain:
  - ["{py}", --version]
preflight: {disk_gb: 1, ram_gb: 1, path: "{src}"}
docs_only: {source: src}
stages:
  - id: privacy
    run: {python: "fieldkit.emerge.stages:telemetry_scan", args: {path: "{src}"}}
    uses: [sources]
    needs: []
    privacy: true
    bucket: tests

  - id: compile
    run: {cmd: ["{py}", -I, -m, py_compile, "{src}/pfind.py"], cwd: "{src}"}
    timeout: 120
    inputs: ["{src}/pfind.py"]
    uses: [toolchain, inputs]
    needs: []
    bucket: tests

  - id: cli
    run: {cmd: ["{py}", -I, "{src}/pfind.py", --help], cwd: "{src}"}
    timeout: 120
    inputs: ["{src}/pfind.py"]
    uses: [toolchain, inputs]
    needs: [compile]
    bucket: tests

  - id: test
    run: {cmd: ["{py}", -m, pytest, -q, tests], cwd: "{src}"}
    timeout: 900
    inputs: ["{src}/pfind.py", "{src}/tests/*.py"]
    uses: [toolchain, inputs]
    needs: [compile]
    bucket: tests
