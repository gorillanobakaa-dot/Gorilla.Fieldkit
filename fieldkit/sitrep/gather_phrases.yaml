# Sentences `fieldkit sitrep gather --render` fills with the facts. Each is one short sentence (sitrep rules.yaml).
# A language missing a key falls back to English. {names} are filled by gather.build_text.
en:
  one_line: "Running {run}, need a look {bad}, open pull requests {prs}, waiting for you {inbox}."
  ask: "Decide: {title}."
  ask_none: "Nothing is needed from you."
  window: "{n} tasks ran or ended in the last {h} hours."
  nothing: "Nothing to report."
  t_done: "Done: {title} ({id})."
  t_failed: "Failed: {title} ({id})."
  t_died: "Died with no report: {title} ({id})."
  t_blocked: "Blocked: {title} ({id})."
  t_running: "Running: {title} ({id})."
  t_died_left: "Look at the log of: {title}."
  pr_of: "{title} is merged or waiting, pull request {pr}."
  pr_passing: "Pull request {n} passes its checks: {title}."
  pr_failing: "Pull request {n} fails its checks: {title}."
  pr_pending: "Pull request {n} is still checking: {title}."
  pr_none: "Pull request {n} has no checks yet: {title}."
  prs_unknown: "Open pull requests could not be read ({why})."
  build_ok: "Build {name} last passed at {at}."
  build_bad: "Build {name} last failed at {at}."
  net: "Roll call: {counts}."
  watchers: "{n} watchers run in the background."
  ideas: "{n} parked ideas wait for the next review."
  defects: "{n} defects are open."
ro:
  one_line: "Rulează {run}, cer atenție {bad}, pull request-uri deschise {prs}, te așteaptă {inbox}."
  ask: "De decis: {title}."
  ask_none: "Nu se cere nimic de la tine."
  window: "{n} sarcini au rulat sau s-au încheiat în ultimele {h} de ore."
  nothing: "Nimic de raportat."
  t_done: "Gata: {title} ({id})."
  t_failed: "Eșuat: {title} ({id})."
  t_died: "S-a oprit fără raport: {title} ({id})."
  t_blocked: "Blocat: {title} ({id})."
  t_running: "Rulează: {title} ({id})."
  t_died_left: "Verifică logul pentru: {title}."
  pr_of: "{title}: pull request {pr}."
  pr_passing: "Pull request {n} trece verificările: {title}."
  pr_failing: "Pull request {n} pică verificările: {title}."
  pr_pending: "Pull request {n} se verifică încă: {title}."
  pr_none: "Pull request {n} nu are verificări încă: {title}."
  prs_unknown: "Pull request-urile deschise nu au putut fi citite ({why})."
  build_ok: "Build {name} a trecut ultima dată la {at}."
  build_bad: "Build {name} a eșuat ultima dată la {at}."
  net: "Apel de control: {counts}."
  watchers: "{n} observatoare rulează în fundal."
  ideas: "{n} idei parcate așteaptă următoarea revizuire."
  defects: "{n} defecte sunt deschise."
