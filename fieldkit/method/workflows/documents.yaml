steps:
- id: git-fetch
  family: git fetch
  command: git fetch -q origin
  support: 3
  of: 9
  succeeded: 3
  runs: 3
  purposes:
  - check branches, where the debian build script lives, ignore rules and embedded files
  - branch worktree; view skill headers
  failures: []
  sentence: Download the latest branch updates from the remote without changing your own files.
  check: The command finishes quietly with no error and the remote branches are up to date.
- id: git-checkout
  family: git checkout
  command: git checkout -q tests/test_zero_command.py
  support: 4
  of: 9
  succeeded: 6
  runs: 6
  purposes:
  - give the test a household; rerun
  - revert test edit, keep alias changes
  failures: []
  sentence: Restore the one test file to its last saved version so your unwanted edit disappears.
  check: The file matches the last commit and git status no longer lists it as changed.
- id: fieldkit-guard
  family: fieldkit guard
  command: fieldkit guard -- python
  support: 5
  of: 9
  succeeded: 11
  runs: 11
  purposes:
  - commit under guard (pre-commit tests)
  - test main registry platform check
  failures: []
  sentence: Run the Python command inside the guard so heavy work runs safely, one job at a time.
  check: The guarded command exits with code 0 and the tests it ran all pass.
- id: fieldkit-privacy
  family: fieldkit privacy
  command: fieldkit privacy scan .
  support: 4
  of: 9
  succeeded: 7
  runs: 7
  purposes:
  - group privacy findings by kind for my files
  - list privacy findings by file and line
  failures: []
  sentence: Scan the whole folder for personal data and read the findings by file and line.
  check: The scan reports zero findings, or every finding listed is fixed before you commit.
- id: git-add
  family: git add
  command: git add -a
  support: 5
  of: 9
  succeeded: 6
  runs: 6
  purposes:
  - retry the commit with names removed
  - commit profilefix (fourth attempt)
  failures: []
  sentence: Stage all your changes so the next commit includes every edited file.
  check: Git status shows all intended changes as staged and nothing important left unstaged.
