id: recipe-test
intent: test
title: Build and test across projects
goal: Fetch the latest code, build it, run each project's tests, and save a checkpoint once they pass.
named_by: sonnet
naming_note: ''
episodes:
  in_group: 80
  without_anchor_command: 321
