  command: git fetch -q origin
  support: 9
  of: 80
  succeeded: 11
  runs: 11
  purposes:
  - compare opencode remote branches
  - map the documents checkout and worktrees
  failures: []
  sentence: Download the latest changes from the remote so you compare against current branches.
  check: The fetch finishes quietly with no errors and the remote branches are up to date.
- id: go-build
  family: go build
  command: go build ./... <N>>&<N>
  support: 12
  of: 80
  succeeded: 33
  runs: 33
  purposes:
  - build the current source and drag every screen through the sizes
  - test the repair, rebuild and drag again
  failures: []
  sentence: Build the Go code and check that everything compiles before you test it.
  check: The build ends with no errors and prints nothing.
- id: go-test
  family: go test
  command: go test ./internal/llm/tools/ -run
  support: 21
  of: 80
  succeeded: 70
  runs: 72
  purposes:
  - run all tui tests
  - run the connection picker resize test
  failures: []
  sentence: Run the Go tests for the part you changed.
  check: Every test is listed as ok and the run ends with no failures.
- id: python-m-pytest
  family: python -m pytest
  command: python -m pytest -q
  support: 47
  of: 80
  succeeded: 138
  runs: 147
  purposes:
  - show the failure
  - show the failing assertion
  failures: []
  sentence: Run the Python tests quietly. If one fails, read which check broke.
  check: The last line shows only passed tests, with no failures or errors.
- id: git-add
  family: git add
  command: git add -a
  support: 38
  of: 80
  succeeded: 65
  runs: 74
  purposes:
  - commit a local checkpoint
  - commit the owner-terminal guard
  failures:
