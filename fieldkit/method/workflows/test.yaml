steps:
- id: cargo-test
  family: cargo test
  command: cargo test --release <N>>&<N>
  support: 12
  of: 80
  succeeded: 18
  runs: 19
  purposes:
  - run all tests
  - run the record tests and see the unlock time
  failures: []
