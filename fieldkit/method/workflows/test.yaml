  - error: exit code <N>
    seen: 2
    signature: cap-git-add-c5d9fd
    fix: see `fieldkit capture find` with the error text
  sentence: Stage your changes and save them as a local checkpoint.
  check: The commit is created and the working tree shows no leftover changes.
