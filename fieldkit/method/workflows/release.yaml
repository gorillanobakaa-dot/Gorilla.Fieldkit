# Workflow recipe distilled from captured episodes (P18 stage 5), regenerated by
# `fieldkit capture distill recipes --intent release --name --apply`.
id: recipe-release
intent: release
title: Ship a Release
goal: Get a change reviewed, merged, published as a release, and cleaned up, with checks passing at each stage.
named_by: sonnet
naming_note: ''
episodes:
  in_group: 22
  without_anchor_command: 37
  replayed_ok: 3
  needed: 3
  examples:
  - ep-2a03734bd582
  - ep-719d9098622f
  - ep-e2177778d33d
accepted: true
steps:
- id: gh-pr
  family: gh pr
  command: gh pr view <N>
  support: 7
  of: 22
  succeeded: 23
  runs: 23
  purposes:
  - skim the v0.<N> opening note
  - check pr <N> state
  failures: []
  sentence: Look at the pull request to read its note and see whether it is open, merged, or blocked.
  check: The request shows the state you expect, and the note matches the change you plan to ship.
- id: git-checkout
  family: git checkout
  command: git checkout -q -b
  support: 9
  of: 22
  succeeded: 11
  runs: 12
  purposes:
  - resolve with p5c cards, run touched go tests
  - create branch and stage changes
  failures: []
  sentence: Make a new branch for your work, then gather your changes on it.
  check: You are on the new branch, and only your intended changes are gathered and ready to save.
- id: fieldkit-guard
  family: fieldkit guard
  command: fieldkit guard -- python
  support: 9
  of: 22
  succeeded: 30
  runs: 31
  purposes:
  - commit merge and push pr <N>
  - run rules and hardlines tests
  failures: []
  sentence: Run the heavy checks or merge steps inside the safety wrapper, one at a time.
  check: The wrapped command finishes with no errors, and the rule and test results all show as passed.
- id: git-fetch
  family: git fetch
  command: git fetch -q origin
  support: 11
  of: 22
  succeeded: 17
  runs: 20
  purposes:
  - merge main into pr <N> branch and push
  - show opencode main history
  failures: []
  sentence: Download the latest changes from the shared copy so your branch can catch up with the main line.
  check: The download finishes quietly, and your local view of the shared main line is now current.
- id: git-add
  family: git add
  command: git add -a
  support: 10
  of: 22
  succeeded: 12
  runs: 17
  purposes:
  - commit the register entry locally
  - commit proof fix and push pr <N>
  failures:
  - error: 'pretooluse:bash hook error: tool router: this does by hand what a harness tool does (heavy-work-outside-the-guard).
      use fieldkit guard -- <t'
    seen: 4
    signature: cap-git-add-267f03
    fix: see `fieldkit capture find` with the error text
  sentence: Gather all your edited files so they are ready to be saved as one change.
  check: The list of gathered files matches what you changed, with nothing extra and nothing missing.
- id: fieldkit-privacy
  family: fieldkit privacy
  command: fieldkit privacy scan .
  support: 7
  of: 22
  succeeded: 9
  runs: 12
  purposes:
  - privacy scan and push emerge fix branch
  - see privacy findings and pre-commit refusal
  failures:
  - error: 'pretooluse:bash hook error: tool router: this does by hand what a harness tool does (heavy-work-outside-the-guard).
      use fieldkit guard -- <t'
    seen: 2
    signature: cap-fieldkit-privacy-c2a35a
    fix: see `fieldkit capture find` with the error text
  sentence: Scan the project for private information before you save or share anything.
  check: The scan reports zero findings, so nothing personal is about to be published.
- id: fieldkit-task
  family: fieldkit task
  command: fieldkit task status --json
  support: 7
  of: 22
  succeeded: 37
  runs: 39
  purposes:
  - start the vaio install and push job
  - watch the vaio job
  failures: []
  sentence: Check on the background job, or start one, and see how far along it is.
  check: The status shows the job running or finished, with no failure reported.
- id: gh-release
  family: gh release
  command: gh release view v0.<N>
  support: 12
  of: 22
  succeeded: 16
  runs: 16
  purposes:
  - verify release assets and find installer
  - view the published v0.<N> release
  failures: []
  sentence: Open the published release and look at the files attached to it, including the installer.
  check: The release exists, it shows the right version, and the installer file is attached.
- id: fieldkit-ship
  family: fieldkit ship
  command: fieldkit ship ci-wait <N>
  support: 11
  of: 22
  succeeded: 28
  runs: 42
  purposes:
  - wait for pr <N> ci and merge on green
  - publish the v0.<N> github release
  failures:
  - error: 'pretooluse:bash hook error: hard line <N>: publishing through fieldkit ship is the owner<S>s yes)'
    seen: 4
    signature: cap-fieldkit-ship-e72dd2
    fix: see `fieldkit capture find` with the error text
  - error: 'pretooluse:bash hook error: hard line <N>: publishing through fieldkit ship is the owner<S>s yes); the mandate
      was not asked: it is asked on'
    seen: 3
    signature: cap-fieldkit-ship-ac1c17
    fix: see `fieldkit capture find` with the error text
  - error: 'pretooluse:bash hook error: hard line <N>: publishing through fieldkit ship is the owner<S>s yes); the mandate
      did not open it: owner-wide: '
    seen: 2
    signature: cap-fieldkit-ship-16f542
    fix: see `fieldkit capture find` with the error text
  sentence: Wait for the automatic checks on the pull request, then let the tool merge it or publish the release.
  check: The checks turn green, the merge or release completes, and the tool reports success.
- id: fieldkit-inbox
  family: fieldkit inbox
  command: fieldkit inbox add <S>
  support: 5
  of: 22
  succeeded: 8
  runs: 10
  purposes:
  - close inbox <N>, park parity idea, read board format
  - find inbox close command and the item
  failures: []
  sentence: Add a note to the owner's inbox for anything only the owner can decide, or find an item to close.
  check: The inbox lists your new note, or the old item shows as closed.
- id: git-commit
  family: git commit
  command: git commit -q -f
  support: 6
  of: 22
  succeeded: 5
  runs: 9
  purposes:
  - commit the dual-track documentation
  - commit, tag and push
  failures:
  - error: 'pretooluse:bash hook error: tool router: this does by hand what a harness tool does (heavy-work-outside-the-guard).
      use fieldkit guard -- <t'
    seen: 2
    signature: cap-git-commit-5b8065
    fix: see `fieldkit capture find` with the error text
  sentence: Save your gathered changes with a short message describing what you did.
  check: The save succeeds, and the history shows your new entry at the top.
- id: fieldkit-size
  family: fieldkit size
  command: fieldkit size recycle <P>
  support: 6
  of: 22
  succeeded: 14
  runs: 14
  purposes:
  - recycle the fetch test folder
  - apply the recycle plan via fieldkit and check the bin
  failures: []
  sentence: Move leftover test folders and scratch files to the recycle bin instead of deleting them for good.
  check: The leftovers are gone from their folders and appear in the recycle bin.
card:
  how_to_read: 'One step at a time: do the sentence, run the command, look at the check. Failures list the error seen and
    what fixed it.'
  replay: 'dry run on the group''s own captured episodes: nothing is executed'
