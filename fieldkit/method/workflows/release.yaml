# Workflow recipe distilled from captured episodes (P18 stage 5), regenerated by
# `fieldkit capture distill recipes --intent release --name --apply`.
id: recipe-release
intent: release
title: Ship a release
goal: Get a finished change merged, published as a release, and cleaned up.
named_by: sonnet
naming_note: ''
episodes:
  in_group: 22
  without_anchor_command: 37
  replayed_ok: 5
  needed: 3
  examples:
  - ep-2a03734bd582
  - ep-31e05f7e73a2
  - ep-4e0ac0af9813
accepted: true
steps:
- id: gh-pr
  family: gh pr
  command: gh pr view <N>
  support: 7
  of: 22
  succeeded: 23
  runs: 23
  purposes:
  - skim the v0.<N> opening note
  - check pr <N> state
  failures: []
  sentence: Look at the pull request to see its current state and read its opening note.
  check: You see the pull request's state and note, and know whether it is open, merged, or blocked.
- id: git-checkout
  family: git checkout
  command: git checkout -q -b
  support: 9
  of: 22
  succeeded: 11
  runs: 12
  purposes:
  - resolve with p5c cards, run touched go tests
  - create branch and stage changes
  failures: []
  sentence: Create a new branch for your work and stage your changes on it.
  check: You are on the new branch, not main, and your changes show as staged.
- id: git-commit
  family: git commit
  command: git commit -q -f
  support: 6
  of: 22
  succeeded: 5
  runs: 9
  purposes:
  - commit the dual-track documentation
  - commit, tag and push
  failures:
  - error: 'pretooluse:bash hook error: tool router: this does by hand what a harness tool does (heavy-work-outside-the-guard).
      use fieldkit guard -- <t'
    seen: 2
    signature: cap-git-commit-5b8065
    fix: see `fieldkit capture find` with the error text
  sentence: Save your staged changes as a commit. If the tool router objects, rerun the work through the guard.
  check: The commit is created on your branch and the tool router raises no complaint.
- id: fieldkit-guard
  family: fieldkit guard
  command: fieldkit guard -- python
  support: 9
  of: 22
  succeeded: 30
  runs: 31
  purposes:
  - commit merge and push pr <N>
  - run rules and hardlines tests
  failures: []
  sentence: Run heavy commands, such as the matching tests, through the guard, one at a time.
  check: The guarded command finishes and the tests covering your change report passing.
- id: git-add
  family: git add
  command: git add -a
  support: 10
  of: 22
  succeeded: 12
  runs: 17
  purposes:
  - commit the register entry locally
  - commit proof fix and push pr <N>
  failures:
  - error: 'pretooluse:bash hook error: tool router: this does by hand what a harness tool does (heavy-work-outside-the-guard).
      use fieldkit guard -- <t'
    seen: 4
    signature: cap-git-add-267f03
    fix: see `fieldkit capture find` with the error text
  sentence: Stage the files you changed so they are ready to commit. Use the guard if the router objects.
  check: The staged list shows exactly the files you meant to include, and no complaint appears.
- id: git-fetch
  family: git fetch
  command: git fetch -q origin
  support: 11
  of: 22
  succeeded: 17
  runs: 20
  purposes:
  - merge main into pr <N> branch and push
  - show opencode main history
  failures: []
  sentence: Fetch the latest from the remote so you can compare against main and merge it in.
  check: The fetch finishes with no errors and your branch can see the newest main.
- id: fieldkit-privacy
  family: fieldkit privacy
  command: fieldkit privacy scan .
  support: 7
  of: 22
  succeeded: 9
  runs: 12
  purposes:
  - privacy scan and push emerge fix branch
  - see privacy findings and pre-commit refusal
  failures:
  - error: 'pretooluse:bash hook error: tool router: this does by hand what a harness tool does (heavy-work-outside-the-guard).
      use fieldkit guard -- <t'
    seen: 2
    signature: cap-fieldkit-privacy-c2a35a
    fix: see `fieldkit capture find` with the error text
  sentence: Scan the project for personal or private details before you commit or push anything.
  check: The scan reports zero findings, so nothing personal will be published.
- id: fieldkit-ship
  family: fieldkit ship
  command: fieldkit ship ci-wait <N>
  support: 11
  of: 22
  succeeded: 28
  runs: 42
  purposes:
  - wait for pr <N> ci and merge on green
  - publish the v0.<N> github release
  failures:
  - error: 'pretooluse:bash hook error: hard line <N>: publishing through fieldkit ship is the owner<S>s yes)'
    seen: 4
    signature: cap-fieldkit-ship-e72dd2
    fix: see `fieldkit capture find` with the error text
  - error: 'pretooluse:bash hook error: hard line <N>: publishing through fieldkit ship is the owner<S>s yes); the mandate
      was not asked: it is asked on'
    seen: 3
    signature: cap-fieldkit-ship-ac1c17
    fix: see `fieldkit capture find` with the error text
  - error: 'pretooluse:bash hook error: hard line <N>: publishing through fieldkit ship is the owner<S>s yes); the mandate
      did not open it: owner-wide: '
    seen: 2
    signature: cap-fieldkit-ship-16f542
    fix: see `fieldkit capture find` with the error text
  sentence: Wait for the checks on the pull request, then let it merge once they are green.
  check: Checks turn green and the pull request merges. A hard-line refusal means stop and ask the owner.
- id: fieldkit-task
  family: fieldkit task
  command: fieldkit task status --json
  support: 7
  of: 22
  succeeded: 37
  runs: 39
  purposes:
  - start the vaio install and push job
  - watch the vaio job
  failures: []
  sentence: Check the status of the background job you started and wait until it finishes.
  check: The job status shows it finished successfully, with no failed stage.
- id: gh-release
  family: gh release
  command: gh release view v0.<N>
  support: 12
  of: 22
  succeeded: 16
  runs: 16
  purposes:
  - verify release assets and find installer
  - view the published v0.<N> release
  failures: []
  sentence: Open the published release and confirm its files are attached, including the installer.
  check: The release page exists and lists the expected files, including the installer.
- id: fieldkit-inbox
  family: fieldkit inbox
  command: fieldkit inbox add <S>
  support: 5
  of: 22
  succeeded: 8
  runs: 10
  purposes:
  - close inbox <N>, park parity idea, read board format
  - find inbox close command and the item
  failures: []
  sentence: Add anything only the owner can decide to the inbox, or close finished items.
  check: The inbox shows your new item, or the finished item is gone from the open list.
- id: fieldkit-size
  family: fieldkit size
  command: fieldkit size recycle <P>
  support: 6
  of: 22
  succeeded: 14
  runs: 14
  purposes:
  - recycle the fetch test folder
  - apply the recycle plan via fieldkit and check the bin
  failures: []
  sentence: Move the leftover test files from your job to the recycle bin. Never delete them for good.
  check: The leftovers are in the recycle bin, and nothing of other jobs was removed.
card:
  how_to_read: 'One step at a time: do the sentence, run the command, look at the check. Failures list the error seen and
    what fixed it.'
  replay: 'dry run on the group''s own captured episodes: nothing is executed'
