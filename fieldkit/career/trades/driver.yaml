# Trade rules: a UK professional driver (van, HGV, bus and coach). Used by `fieldkit cv check --trade driver`, or
# when the profile says trade: driver. Same format for any trade: detect (when the CV looks like this trade),
# licence_line / licence_category (optional), checks (each with an optional question), questions (en es pt it de ro).
name: driver
detect: '(driver|driving|\bHGV\b|\bLGV\b|\bPCV\b|class 1|class 2|c\+e|conductor profesional|camioner[oa]|ch[oó]fer|motorista|autista|camionista|fahrer|\bLKW\b|tac[oó]grafo|tachigrafo|[sș]ofer|tahograf)'
# a line that talks about a licence, then the categories named on it
licence_line: '(categor\w*|\bcat\.?\s|licen[cs]e|carn[eé]t?\b|permiso|carta de condu|patente|f[uü]hrerschein|klasse|\bclase\b|permis)'
licence_category: '(?<![\w+])(C1\+E|C1E|C\+E|CE|C1|D1\+E|D1|D\+E|DE|B\+E|BE|B|C|D)(?![\w+])'
checks:
  - {id: cpc, pattern: '(\bCPC\b|driver CQC|\bDQC\b|certificate of professional competence|certificado de aptitud profesional|tarjeta CAP|aptid[aã]o para motorista|\bCQM\b|carta de qualifica[cç][aã]o de motorista|\bCQC\b|carta di qualificazione del conducente|Berufskraftfahrer-?qualifikation|Schlüsselzahl 95|Modul 95|card de calificare|atestat)', ask: cpc}
  - {id: tachograph, pattern: '(tachograph|digi(tal)?[- ]?card|driver card|tac[oó]grafo|tarjeta de conductor|cart[aã]o de condutor|tachigrafo|carta del conducente|fahrerkarte|fahrtenschreiber|card tahograf|tahograf)', ask: tachograph}
  - {id: adr, pattern: '\bADR\b', ask: adr}
  - {id: forklift, pattern: '(forklift|\bFLT\b|counterbalance|reach truck|carretilla|carretillero|empilhador|carrello elevatore|muletto|carrellista|gabelstapler|staplerschein|staplerfahrer|stivuitor)', ask: forklift}
  - {id: abroad, pattern: '(international|europe|EU\b|france|germany|belgium|netherlands|spain|italy|poland|romania|ireland|internacional|francia|alemania|b[eé]lgica|pa[ií]ses bajos|espa[ñn]a|polonia|ruman[ií]a|irlanda|fran[cç]a|alemanha|holanda|espanha|it[aá]lia|pol[oó]nia|rom[eé]nia|internazionale|germania|belgio|olanda|spagna|frankreich|deutschland|belgien|niederlande|spanien|italien|polen|rum[aä]nien|irland|interna[tț]ional|europa|fran[tț]a|belgia|italia|rom[aâ]nia)', ask: abroad}
  - {id: safety, pattern: '(accident[- ]free|clean licen[cs]e|no (accidents|points)|sin accidentes|sem acidentes|senza incidenti|unfallfrei|f[aă]r[aă] accident|permis curat|zero accidente)', ask: null,
     message: "No safety record stated (clean licence, accident-free years): the strongest line a driver can have, if true."}
  - {id: punctual, pattern: '(on[- ]time|punctual|delivery window|puntual|pontual|puntuale|p[uü]nktlich|la timp)', ask: null,
     message: "No on-time record stated (deliveries on time, delivery windows kept), if true."}
  - {id: compliance, pattern: '(drivers.? hours|working time|WTD|EU rules|tachograph rules|tiempos de conducci[oó]n|tempos de condu[cç][aã]o|tempi di guida|lenk- und ruhezeiten|lenkzeiten|ore de condus|timp de lucru)', ask: null,
     message: "Drivers' hours and tachograph rules are not mentioned: UK hauliers ask for them."}

questions:
  licence:
    en: "Which licence categories do you hold (B, C, C+E, D ...)?"
    es: "¿Qué clases de permiso de conducir tienes (B, C, C+E, D...)?"
    pt: "Que categorias de carta de condução tens (B, C, C+E, D...)?"
    it: "Quali categorie di patente hai (B, C, C+E, D...)?"
    de: "Welche Führerscheinklassen hast du (B, C, C+E, D ...)?"
    ro: "Ce categorii de permis ai (B, C, C+E, D etc.)?"
  cpc:
    en: "Do you hold a Driver CPC (DQC card)? Valid until when?"
    es: "¿Tienes el CAP / Driver CPC (tarjeta DQC)? ¿Hasta cuándo es válido?"
    pt: "Tens o CAM / CQM (Driver CPC, cartão DQC)? Até quando é válido?"
    it: "Hai la CQC / Driver CPC (carta DQC)? Fino a quando è valida?"
    de: "Hast du die Berufskraftfahrer-Qualifikation / Driver CPC (DQC-Karte)? Bis wann ist sie gültig?"
    ro: "Ai CPC / Driver CQC (card DQC)? Până când este valabil?"
  tachograph:
    en: "Do you have a digital tachograph driver card?"
    es: "¿Tienes tarjeta de conductor para tacógrafo digital?"
    pt: "Tens cartão de condutor para tacógrafo digital?"
    it: "Hai la carta del conducente per il tachigrafo digitale?"
    de: "Hast du eine Fahrerkarte für den digitalen Tachographen?"
    ro: "Ai card tahograf (digital)?"
  adr:
    en: "Do you hold an ADR certificate (dangerous goods)? Which classes?"
    es: "¿Tienes el certificado ADR (mercancías peligrosas)? ¿De qué clases?"
    pt: "Tens o certificado ADR (mercadorias perigosas)? De que classes?"
    it: "Hai il certificato ADR (merci pericolose)? Per quali classi?"
    de: "Hast du eine ADR-Bescheinigung (Gefahrgut)? Für welche Klassen?"
    ro: "Ai certificat ADR (mărfuri periculoase)? Ce clase?"
  forklift:
    en: "Do you hold a forklift (FLT) licence? Which trucks?"
    es: "¿Tienes carné de carretillero (FLT)? ¿Para qué tipos de carretilla?"
    pt: "Tens carta de operador de empilhador (FLT)? Para que tipos?"
    it: "Hai il patentino per il carrello elevatore (FLT)? Per quali tipi?"
    de: "Hast du einen Staplerschein (FLT)? Für welche Stapler?"
    ro: "Ai carnet de stivuitorist (FLT)? Pe ce tipuri?"
  abroad:
    en: "In which countries outside England have you driven?"
    es: "¿En qué países fuera de Inglaterra has conducido?"
    pt: "Em que países fora de Inglaterra já conduziste?"
    it: "In quali paesi fuori dall'Inghilterra hai guidato?"
    de: "In welchen Ländern außerhalb Englands bist du schon gefahren?"
    ro: "În ce țări ai condus în afara Angliei?"
