# Trade rules: UK warehouse and retail operations (operative, picker, stock, supervisor). Same format as driver.yaml.
name: warehouse
detect: '(warehouse|picker|packer|stock control|replenish|forklift|\bFLT\b|mozo de almac[eé]n|almac[eé]n|preparador de pedidos|carretillero|armaz[eé]m|empilhador|magazzin|carrellista|lagerist|lagerarbeiter|lagerlogistik|lagerhelfer|kommissionier|gabelstapler|depozit|stivuitor|lucr[aă]tor comercial)'
checks:
  - {id: flt, pattern: '(forklift|\bFLT\b|counterbalance|reach truck|\bPPT\b|carretilla|transpaleta|empilhador|porta-paletes|carrello elevatore|muletto|transpallet|gabelstapler|staplerschein|hubwagen|stivuitor|transpalet)', ask: flt}
  - {id: rates, pattern: '(pick rate|\d+\s*(units|cases|lines) (an|per) hour|targets?|objetivos|metas|obiettivi|vorgaben|norm[aă])', ask: null,
     message: "No pick rate or target met is stated, if there is a true one to give."}
  - {id: systems, pattern: '(\bWMS\b|scanner|RF gun|\bSAP\b|stock system|esc[aá]ner|terminal RF|leitor de c[oó]digos|palmare|handscanner)', ask: systems}
  - {id: shifts, pattern: '(night shift|nights|shifts|turnos|turni|schichtarbeit|schichten|nachtschicht|ture de noapte|schimburi)', ask: null,
     message: "Shift pattern experience (nights, weekends) is not mentioned: warehouses ask for it."}
questions:
  flt:
    en: "Do you hold a forklift licence (counterbalance, reach, PPT)? From which training body?"
    es: "¿Tienes carné de carretillero (contrapesada, retráctil, transpaleta eléctrica)? ¿De qué centro de formación?"
    pt: "Tens carta de operador de empilhador (contrabalançado, retrátil, porta-paletes elétrico)? De que entidade formadora?"
    it: "Hai il patentino per il carrello elevatore (frontale, retrattile, transpallet elettrico)? Rilasciato da quale ente di formazione?"
    de: "Hast du einen Staplerschein (Frontstapler, Schubmaststapler, Elektro-Hubwagen)? Von welchem Schulungsanbieter?"
    ro: "Ai carnet de stivuitorist (counterbalance, reach, transpalet electric)? De la ce organism?"
  systems:
    en: "Which warehouse systems or scanners have you used?"
    es: "¿Qué sistemas de almacén o escáneres has usado?"
    pt: "Que sistemas de armazém ou leitores de códigos já usaste?"
    it: "Quali sistemi di magazzino o scanner hai usato?"
    de: "Welche Lagerverwaltungssysteme oder Scanner hast du benutzt?"
    ro: "Ce sisteme de depozit sau scanere ai folosit?"
