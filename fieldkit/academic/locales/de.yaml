# Germany.
id: de
country: Deutschland
work_language: de
spelling: de
page: A4
margins_cm: 2.5
date_format: "{day}. {month} {year}"         # 28. September 2026
quotes: ["„", "“"]                  # „ “
decimal: ","
styles: [apa7, harvard-ctr, iso690]           # ISO 690 is DIN ISO 690; "deutsche Zitierweise" (footnotes) comes later
