# Spain.
id: es
country: España
work_language: es
spelling: es
page: A4
margins_cm: 2.5
date_format: "{day} de {month} de {year}"    # 28 de septiembre de 2026
quotes: ["«", "»"]                  # comillas angulares
decimal: ","
styles: [apa7, iso690]                        # ISO 690 is UNE-ISO 690 in Spain
default_style: apa7
plagiarism_tool: Turnitin / Ouriginal
avoid_long_dashes: false     # the raya (—) is normal Spanish punctuation
