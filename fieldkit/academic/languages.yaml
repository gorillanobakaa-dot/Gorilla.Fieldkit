# What each language looks like to the harness, as data. Used by the language check (is a sentence in the language
# the work must be written in?), the reference check (the words for "and", "no date", "page", the heading of the
# reference list) and dates (month names). Add a language by adding a block.
#
# distinctive: common words of that language that are NOT also common words of the others; a sentence with two or
# more of one language's distinctive words (and more than any other language's) is that language. The Romanian list
# is the one built and tested for a Romanian-speaking student writing in English.
en:
  name: English
  months: [January, February, March, April, May, June, July, August, September, October, November, December]
  and: ["and", "&"]
  no_date: ["n.d.", "no date"]
  page: ["p.", "pp."]
  headings: [References, Reference list, Bibliography, Works cited]
  articles: [the, a, an]
  distinctive: [the, and, which, that, with, from, this, these, those, have, has, been, were, would, should, could,
                their, there, about, between, through, because, however, therefore, although, while, into, also]
