# Agent shell and Python-script failures (P18 distill, Kiro pass 2026-11-05, trust-reviewed 2026-11-08).
# Hand-kept, unlike captured.yaml (regenerated by `fieldkit capture distill pairs --apply`): each entry was
# checked against the captured failure items its out/signatures.yaml row named; the fix names a Fieldkit command.
success: []

signatures:
- id: shell-heredoc-eof
  pattern: 'unexpected EOF while looking for matching|here-document at line \d+ delimited by end-of-file'
  check: null
  whole_log: true
  source: common
  cause: A heredoc or a quote was typed inline into a shell command and was not closed (seen 29 times in captured sessions; Git Bash and PowerShell quote differently).
  fix: Write the script to a file with the Write tool (or in the scratch root, fieldkit scratch new), then run the file. Never paste multi-line code into a one-line shell command.

- id: shell-msys-path-to-native
  pattern: "cannot access ['\"]?/[a-zA-Z]/|No such file or directory.*['\"]/[a-zA-Z]/"
  check: null
  whole_log: true
  source: common
  cause: A Git Bash path (/c/Users/...) reached a native Windows program or PowerShell, which reads it as a relative path (seen 16 times).
  fix: Give native Windows programs C:/Users/... (forward slashes work everywhere). fieldkit mutate already rewrites these (fieldkit/method/mutate.py msys_rewritten).

- id: py-unicodeescape-path
  pattern: "SyntaxError:\\s*\\(unicode error\\)\\s*'unicodeescape'\\s*codec\\s*can't\\s*decode"
  check: null
  whole_log: true
  source: common
  cause: A Windows path such as "C:\Users\..." sits in a normal Python string, so \U starts a unicode escape and the file does not parse (seen 12 times).
  fix: python -m fieldkit.build.pyliterals FILE (shows each literal), then --apply to make only those literals raw; it checks the file parses afterwards.

- id: py-invalid-escape-warning
  pattern: "SyntaxWarning:\\s*invalid escape sequence"
  check: null
  whole_log: true
  source: common
  cause: A regex such as "\d+" is written in a normal Python string; Python 3.12 warns and a later Python refuses it (seen 4 times).
  fix: python -m fieldkit.build.pyliterals FILE, then --apply; it adds r only where the string's value stays exactly the same.

- id: py-missing-stdlib-import
  pattern: "NameError:\\s*name\\s*'(shutil|re|os|sys|json|subprocess|time|pathlib|hashlib|tempfile|glob)'\\s*is\\s*not\\s*defined"
  check: null
  whole_log: true
  source: common
  cause: A standard-library module is used after an edit but was never imported (seen 7 times).
  fix: Add the import at the top of the file; run the covering test (fieldkit testcost staged) before the next command.

- id: py-script-not-found
  pattern: "python(?:\\.exe)?:\\s*can't open file\\s*'[^']+':\\s*\\[Errno 2\\]"
  check: null
  whole_log: true
  source: common
  cause: A relative script path was run from the wrong folder, or before the file was written (seen 3 times).
  fix: Run it by its absolute path. To look for it, fieldkit size find NAME (bounded search); never run a same-named file found elsewhere without reading it.

- id: git-terminal-auth
  pattern: "could not read Username for\\s*'https://github\\.com':\\s*terminal prompts disabled"
  check: null
  whole_log: true
  source: common
  cause: A direct git push or gh call ran without the owner-wide mandate credentials (seen 4 times).
  fix: Push only through fieldkit ship push (rules/CORE.md HARD LINES); never set credentials yourself.

- id: py-cp1252-charmap
  pattern: "UnicodeEncodeError:\\s*'charmap'\\s*codec\\s*can't\\s*encode|UnicodeDecodeError:\\s*'charmap'\\s*codec\\s*can't\\s*decode"
  check: null
  whole_log: true
  source: common
  cause: Windows' default cp1252 console or file encoding met a UTF-8 character (seen 8 times).
  fix: Open files with encoding="utf-8" and run Python with PYTHONUTF8=1 (or -X utf8) on Windows.

- id: pwsh-bash-syntax
  pattern: 'ParserError:.*MissingFileSpecification|UnexpectedToken.*<<'
  check: null
  whole_log: true
  source: common
  cause: Bash syntax (a <<EOF heredoc, export VAR=) was run inside PowerShell (seen 4 times).
  fix: Use PowerShell syntax there ($env:VAR = ..., a here-string @' '@), or write a script file and run it.

- id: git-conflict-append-both
  pattern: '^<<<<<<< .*$'
  check: null
  whole_log: true
  source: common
  cause: Two branches appended to the same registry, ledger or plan file and git left conflict markers (seen 10 times).
  fix: For tools.yaml, platform_index.json and docs/groups.yaml use fieldkit merge-driver (never resolve them by hand); for an append-only log keep both sides in order.
