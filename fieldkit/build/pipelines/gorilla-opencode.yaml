name: gorilla-opencode
description: >-
  Build Gorilla OpenCode exactly as its releases are built (go build, CGO off, stamped with
  -X github.com/opencode-ai/opencode/internal/version.Version), for Linux and Windows, after
  verifying every dependency and running vet and the whole test suite. The Windows .exe keeps
  its committed icon and version resources (rsrc_windows_*.syso). Each binary is built a second time
  elsewhere and must be byte for byte identical (repro). Then the macOS 10.13 binary (the project's
  build-darwin-legacy.sh: a patched GOROOT, since stock Go needs macOS 11) and the packages (.deb, Arch,
  the portable tarball, .rpm) from the project's own scripts, and SHA256SUMS over everything: every
  release file from ONE Linux machine (owner, 2026-10-23: no more jumping between three computers).
  On Windows (v0.1.152, 2026-10-25) the same run makes every file too: .deb and .rpm by the project's
  build-packages-nfpm.py, compared with the last release's .deb; the tarball packed here and checked by
  its bytes (Windows cannot run the Linux binary); the Mac binary with a cached go1.24 toolchain. SHA256SUMS
  lists exactly the published files, and RELEASE-FILES-<version>.md is the page's table, measured.
  Give the version (--var version=v0.1.146) or let git describe name it.
vars:
  src: ""                  # the module folder (holds go.mod); or goapps.<name> in fieldkit.local.json
  name: gorilla-opencode
  version: ""              # empty: git describe --tags --always --dirty
  version_var: github.com/opencode-ai/opencode/internal/version.Version
  version_flag: --version  # the binary prints its stamp: checked on this machine
  targets: "linux/amd64,windows/amd64"
  main: "."                # the package to build
  cgo: "0"
  tests: all               # all | short
  out: ""                  # empty: <src>/dist
  windows_name: gorilla-opencode.exe   # the name the releases use
  # v0.1.155 shipped without these (2026-10-27): the Windows release is `go build -tags toolbox` with the seven
  # pinned helpers embedded; they are git-ignored, so a git_ref clone gets them copied from the source checkout
  tags: "windows/amd64=toolbox"
  embed_dirs: internal/toolbox/bin/windows-amd64
  embed_sums: internal/toolbox/SHA256SUMS
  embed_root: internal/toolbox/bin
  embed_seed: "${HOME}/gorilla-toolbox-build/out/windows-x86_64"   # the source-built helpers (not in the module), taken only if pinned
  embed_fetch: scripts/fetch-toolbox-extras.sh   # fills pinned official-release helpers missing from embed_dirs
  mac_script: scripts/build-darwin-legacy.sh   # empty: no Mac binary
  mac_suffix: macos10.13
  mac_package: scripts/packaging/build_mac_legacy_package.py   # the installer's folder + .zip (skipped if absent)
  packages: "scripts/build-deb.sh,scripts/build-arch.sh,scripts/build-tarball.sh,scripts/build-rpm.sh"
  package_dir: Compiled.Builds   # where the package scripts leave their files
  mac_go: "1.24"           # the series build-darwin-legacy.sh is patched for and the MacBook Air builds used
  mac_zip: "<name>-<version>-mac-10.13-x86_64.zip"   # <version> without v; the published zip; the bare Mac binary is not published
  packager: auto           # scripts where dpkg-deb + rpmbuild exist (not Windows), else nfpm
  nfpm_script: scripts/build-packages-nfpm.py
  previous_deb: auto       # nfpm: the last release's .deb from GitHub (checked by its SHA256SUMS) | PATH | none
  repo: gorillanobakaa-dot/Gorilla.Opencode
  tarball: gorilla-opencode-linux-x86_64.tar.gz    # nfpm: packed here, one member, 0755, gzip -9
  tarball_member: gorilla-opencode
  xz_cap_mib: "128"        # packages: every .deb/.xz made passes fieldkit xzcheck (dictionary fits the content, unpacks within this)
  git_ref: ""              # a commit-ish: build from a clean clone of it, so go records vcs.* as the release build did
  compare_with: ""         # published stage: a folder of published files, or `release` (GitHub release <version> of repo)
stages:
  - id: toolchain
    run: {python: "fieldkit.build.goapp:stage_toolchain"}
    verify:
      - {python: {target: "fieldkit.build.goapp:verify_toolchain"}}
    triage: go

  - id: modules
    timeout: 3600
    run: {python: "fieldkit.build.goapp:stage_modules"}
    verify:
      - {python: {target: "fieldkit.build.goapp:verify_modules"}}
    triage: go

  - id: vet
    timeout: 3600
    run: {python: "fieldkit.build.goapp:stage_vet"}
    verify:
      - {python: {target: "fieldkit.build.goapp:verify_vet"}}
    triage: go

  - id: test
    timeout: 10800
    run: {python: "fieldkit.build.goapp:stage_test", args: {mode: "{tests}"}}
    verify:
      - {python: {target: "fieldkit.build.goapp:verify_test"}}
    triage: go

  - id: build
    timeout: 7200
    run: {python: "fieldkit.build.goapp:stage_build"}
    verify:
      - {python: {target: "fieldkit.build.goapp:verify_build"}}
    triage: go

  - id: repro
    # the binary proven, not only the source: built again from a copy in another folder, own cache and temp folder,
    # another time zone and locale; the bytes must be the build stage's (2026-10-11)
    timeout: 7200
    run: {python: "fieldkit.build.goapp:stage_repro"}
    verify:
      - {python: {target: "fieldkit.build.goapp:verify_repro"}}
    triage: go

  - id: published
    # byte equality with the published files (compare_with; empty: skipped); a difference names the bytes and the
    # build info go recorded (2026-10-25: the export-of-tag build differed only by vcs.*)
    timeout: 3600
    run: {python: "fieldkit.build.goapp:stage_published"}
    verify:
      - {python: {target: "fieldkit.build.goapp:verify_published"}}

  - id: mac
    timeout: 7200
    run: {python: "fieldkit.build.goapp:stage_mac"}
    verify:
      - {python: {target: "fieldkit.build.goapp:verify_mac"}}
    triage: go

  - id: packages
    timeout: 3600
    run: {python: "fieldkit.build.goapp:stage_packages"}
    verify:
      - {python: {target: "fieldkit.build.goapp:verify_packages"}}

  - id: checksums
    run: {python: "fieldkit.build.goapp:stage_checksums"}
    verify:
      - {python: {target: "fieldkit.build.goapp:verify_checksums"}}
