name: debian-kernel
description: >-
  Build a custom Linux kernel as Debian packages (linux-image, linux-headers) and RPMs
  with a verified config change-set. Mirrors the owner's debian-kernel CI, as
  local stages that can be resumed. Needs Debian/Ubuntu to run; can be planned
  and dry-run anywhere.
vars:
  version: "7.2.9"                             # the version the debian-kernel project is on
  workdir: "${LOCAL:kernel.workdir}"            # e.g. ~/kernel-build
  project: "${LOCAL:kernel.project}"            # checkout of the debian-kernel repo
  src: "{workdir}/linux-{version}"
  output: "{workdir}/debs-{version}"
  mirror: ""                                    # e.g. https://github.com/gregkh/linux, only if kernel.org is unreachable
stages:
  - id: deps
    platforms: [debian]
    run: {python: "fieldkit.build.kernel:stage_deps"}
    verify:
      - {python: {target: "fieldkit.build.kernel:stage_deps"}}
    triage: debian-kernel

  - id: fetch
    platforms: [linux]
    # kernel.org first; --var mirror=<git URL> only when kernel.org cannot be reached (recorded as unverified)
    run: {python: "fieldkit.build.kernel:stage_fetch", args: {mirror: "{mirror}"}}
    verify:
      - {python: {target: "fieldkit.build.kernel:verify_fetch"}}

  - id: extract
    platforms: [linux]
    run: {python: "fieldkit.build.kernel:stage_extract"}
    verify:
      - {files_exist: ["{src}/Makefile"]}

  - id: patches-check
    platforms: [linux]
    run: {cmd: [python3, "{project}/make_patches.py", "--check"], cwd: "{project}"}
    verify:
      - {output_contains: "no drift"}
    triage: debian-kernel

  - id: patches
    platforms: [linux]
    run: {cmd: [python3, "{project}/universal_freedom_installer.py", "{src}"], cwd: "{project}"}
    verify:
      - {python: {target: "fieldkit.build.kernel:verify_patched"}}
    triage: debian-kernel

  - id: config
    platforms: [linux]
    run:
      python: "fieldkit.build.kernel:stage_config"
      args:
        base_config: "{project}/kernel.config"
        injector: "{project}/kernel_config_injector.py"
    verify:
      - {python: {target: "fieldkit.build.kernel:verify_config",
                  args: {injector: "{project}/kernel_config_injector.py"}}}
    triage: debian-kernel

  - id: build
    platforms: [debian]
    timeout: 36000
    run:
      python: "fieldkit.build.kernel:stage_build"
      args: {tags: [unleashed, gorilla, eapd, bbr]}
    verify:
      - {files_exist: ["{workdir}/linux-image-*.deb"]}
    triage: debian-kernel

  - id: rpm
    platforms: [linux]
    timeout: 36000
    run: {python: "fieldkit.build.kernel:stage_rpm"}
    verify:
      - {files_exist: ["{src}/rpmbuild/RPMS/*/kernel-*.rpm"]}
    triage: debian-kernel

  - id: collect
    platforms: [linux]
    run: {python: "fieldkit.build.kernel:stage_collect"}
    verify:
      # both package kinds: with the .deb alone, a collect that ran before the rpm stage stayed "up-to-date" and the
      # RPMs never reached the output (2026-10-10)
      - {files_exist: ["{output}/linux-image-*.deb", "{output}/kernel-*.rpm"]}

  - id: repro
    platforms: [debian]
    timeout: 36000
    # the binary proven, not only the source (2026-10-11): the packages built AGAIN from a clean copy of the same
    # tree, in another folder, time zone and locale, must be byte for byte the build's. Proven here on 7.2.9 with a
    # small config (linux-image and linux-headers identical); with the owner's config it takes a second full build.
    run: {python: "fieldkit.build.kernel:stage_repro"}
    verify:
      - {python: {target: "fieldkit.build.kernel:verify_repro"}}
    triage: debian-kernel
