# Compile-once rules, as data (2026-11-13, owner: "one interpreter start per call is the zombie and CPU bill").
# A Fieldkit tool or hook must not start a compiler or an interpreter on source text per call:
#   python -c "..."   Python compiles the string on EVERY start and caches nothing;
#   go run ...        Go compiles and links a fresh binary on EVERY call.
# Fix: a real module (python -m fieldkit.x, compiled once into the shared bytecode cache, see fieldkit pycache) or a
# prebuilt binary (go build once, run the file). `fieldkit compileonce check` exits 3 on any line that matches and is
# not in `allow` with a reason. An allow row is not a license for a hot path: it names a one-off (doctor, install,
# handshake, CI step).
scan:
  roots: [fieldkit, hooks, skills, .github, .claude]
  suffixes: [.py, .sh, .ps1, .yml, .yaml, .json]
  skip_dirs: [__pycache__, .git, node_modules, third_party, offline_site]
rules:
- id: python-dash-c
  patterns:
  - '["''](?:python[0-9.]*|py|pythonw)(?:\.exe)?["''],\s*(?:["'']-[A-Za-z]+["''],\s*)*["'']-c["'']'
  - '(?:executable|\bpy|\bPY|python|interp)\w*\)?,\s*(?:["'']-[A-Za-z]+["''],\s*)*["'']-c["'']'
  - '\bpython[0-9.]*(?:\.exe)?\s+(?:-[A-Za-z]+\s+)*-c\s+\\*["'']'
  - '\$\((?:python|py)[0-9.]*\s+-c\s'
  sample: 'subprocess.Popen([sys.executable, "-c", "while True: pass"])'
  why: Python compiles the -c string on every start; nothing is cached.
  fix: Put the code in a module of the package and run `python -m fieldkit.<module>` (compiled once, shared pycache).
- id: go-run
  patterns:
  - '["'']go["''],\s*["'']run["'']|(?<![\w"-])go run [./\w-]'
  sample: 'subprocess.run(["go", "run", "./cmd/schema"])'
  why: go run compiles and links a new binary on every call.
  fix: go build once into the scratch or tool folder (content-addressed by the source hash), then run that file.
- id: bytecode-off
  patterns:
  - 'PYTHONDONTWRITEBYTECODE["''\]]*\s*[:=,]\s*["'']?1'
  sample: 'env["PYTHONDONTWRITEBYTECODE"] = "1"'
  why: Without bytecode every start recompiles every imported module (100-190 ms per hook call, I-17).
  fix: Set PYTHONPYCACHEPREFIX to the shared cache instead (fieldkit pycache).
# Allowed one-offs: file, rule, why. The match is the file plus the rule id, so a new hit in a NEW file fails.
allow:
- {file: fieldkit/voice/doctor.py, rule: python-dash-c, why: "doctor probe of foreign interpreters, run once by `voice doctor`, not per call"}
- {file: fieldkit/peers/link_keepalive.py, rule: python-dash-c, why: "one import probe of the peer's venv when the link is healed, not per call"}
- {file: fieldkit/peers/link_ops.py, rule: python-dash-c, why: "hello handshake and self-update probe of the other computer's venv, once per link session"}
- {file: fieldkit/method/__init__.py, rule: python-dash-c, why: "docstring about quoting"}
- {file: fieldkit/build/ci/debian-kernel.yml, rule: python-dash-c, why: "one CI step per run on a throwaway runner"}
- {file: .github/workflows/release.yml, rule: python-dash-c, why: "one CI step per release on a throwaway runner"}
- {file: fieldkit/capture/selftest.py, rule: python-dash-c, why: "test input text fed to the capture classifier, never executed"}
- {file: fieldkit/compileonce/rules.yaml, rule: python-dash-c, why: "this file's own samples"}
- {file: fieldkit/compileonce/rules.yaml, rule: go-run, why: "this file's own samples"}
- {file: fieldkit/compileonce/rules.yaml, rule: bytecode-off, why: "this file's own samples"}
