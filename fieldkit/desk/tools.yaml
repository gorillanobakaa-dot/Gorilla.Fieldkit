# The tool registry: every tool Fieldkit knows, where it lives, on which system
# it runs, whether it changes things, and how it is tested. Agents read this
# (fieldkit tools list --json) instead of rediscovering tools.
#
# Your own tools go in local/tools.yaml (same format, git-ignored): they are
# merged in at load time and never published.
#
# path: ${DOCUMENTS} / ${FIELDKIT} are expanded per machine (core/settings.py).
# changes: true = the tool modifies files/system state; an agent must ask first.
# test: command that proves it works (null = no test yet - a gap, listed by `tools check`).
# repo: where the canonical copy lives when it is not on this machine.

tools:
# --- Fieldkit's own harnesses ------------------------------------------------
- id: office
  title: Read, create, check and scrub Word/Excel/PowerPoint/PDF offline
  harness: office
  entry: [python, -m, fieldkit, office]
  effects: [reads-files, writes-files]   # from the title and path (2026-10-19); confirm on adoption
  path: ${FIELDKIT}/fieldkit/office
  platforms: [windows, linux]
  changes: true
  test: [python, -m, pytest, -q, "${FIELDKIT}/tests/test_office.py"]

- id: sync
  title: Keep this machine's harness level with GitHub; take only fast-forwards CI proved on Windows and Linux
  harness: core
  entry: [python, -m, fieldkit, sync]
  path: ${FIELDKIT}/fieldkit/core/sync.py
  platforms: [windows, linux]
  changes: true
  test: [python, -m, pytest, -q, "${FIELDKIT}/tests/test_sync_and_platforms.py"]

- id: install-ps1
  title: Install Fieldkit on Windows without git (GitHub zip, private .venv, lean set, doctor --lean, INSTALLED.txt)
  harness: core
  entry: [powershell, -NoProfile, -ExecutionPolicy, Bypass, -File, "${FIELDKIT}/install.ps1"]
  path: ${FIELDKIT}/install.ps1
  inputs:
    - {name: target, flag: -Target, type: str, required: false, help: "the folder (default %USERPROFILE%\\Fieldkit); refused if it has files or is under OneDrive"}
    - {name: branch, flag: -Branch, type: str, required: false, help: "the GitHub branch whose zip is downloaded (main)"}
    - {name: yes, flag: -Yes, type: bool, required: false, help: "answer yes to every question"}
  effects: [network, writes-files, processes]
  safety: reversible
  notes: 'Twin of install.sh (Linux/macOS). Asks y/N before each download and install; Windows PowerShell 5.1; Python found by full path (py launcher, python.org installs, never PATH or the Store alias); refuses a zip entry outside its top folder. Only the target folder changes: delete it to undo. FIELDKIT_ZIP_URL (file:// = copy) and FIELDKIT_SKIP_PIP=1 as in install.sh. Exit 0 ready, 2 bad usage or refused folder, 3 not ready. Owner order 2026-10-23.'
  platforms: [windows]
  platforms_why: 'Windows PowerShell 5.1 and the Windows Python layout (py launcher, %LOCALAPPDATA%\Programs\Python); Linux and macOS use install.sh'
  changes: true
  test: [python, -m, pytest, -q, "${FIELDKIT}/tests/test_install_ps1.py"]

- id: autopilot
  title: Unattended agent runs (Claude Code, Antigravity) with no approval prompts, held by hard lines and no credential
  harness: core
  entry: [python, -m, fieldkit, autopilot]
  path: ${FIELDKIT}/fieldkit/autopilot/run.py
  inputs:
    - {name: action, flag: null, type: str, required: true, choices: [on, off, status, stop, resume, claude, workspace, quiet, antigravity, login], help: "status first; claude PROMPT runs one headless run"}
    - {name: rest, flag: null, type: str, required: false, help: "stop: the reason; claude: the prompt; workspace: the folder"}
    - {name: cwd, flag: --cwd, type: str, required: false, help: "claude: the folder the run works in"}
    - {name: max_turns, flag: --max-turns, type: int, required: false, help: "claude: turns per session (10000)"}
    - {name: wall_minutes, flag: --wall-minutes, type: float, required: false, help: "claude: wall time per session; the process tree is killed after it (default: none; with --job 720)"}
    - {name: cost_usd, flag: --cost-usd, type: float, required: false, help: "claude --job: dollars per session"}
    - {name: job, flag: --job, type: str, required: false, help: "claude: a job folder: budgeted, checkpointed, resumable; exit 75 = paused-resumable (also FIELDKIT_JOB_DIR)"}
    - {name: max_continuations, flag: --max-continuations, type: int, required: false, help: "claude --job: resumes after a budget end (3)"}
    - {name: hold, flag: --hold, type: int, required: false, help: "quiet: keep the apps stopped until this PID exits"}
    - {name: minutes, flag: --minutes, type: float, required: false, help: "quiet: keep the apps stopped this many minutes (or until the STOP file)"}
    - {name: restore, flag: --restore, type: bool, required: false, help: "quiet (Linux): start again the system services a run stopped"}
    - {name: apply, flag: --apply, type: bool, required: false, help: "quiet: stop them (without it: list only)"}
  platforms: [windows, linux]
  changes: true
  test: [python, -m, pytest, -q, "${FIELDKIT}/tests/test_autopilot_run.py", "${FIELDKIT}/tests/test_autopilot_hardlines.py", "${FIELDKIT}/tests/test_long_horizon.py"]

- id: goal
  title: Long horizon goals - a planner writes bounded jobs, fresh workers do them (budgets, checkpoints, resume), a separate verifier runs the acceptance criteria and decides; pre-approved decisions answered without a human; a supervisor resumes every unfinished goal at logon
  harness: core
  entry: [python, -m, fieldkit, goal]
  path: ${FIELDKIT}/fieldkit/autopilot/goal.py
  inputs:
    - {name: action, flag: null, type: str, required: true, choices: [new, status, run, stop, approve, report, supervisor-script], help: "status first; run = the supervisor"}
    - {name: args, flag: null, type: str, required: false, help: "new ID; status [ID]; run [ID ...]; stop ID [why]; approve ID; report ID; supervisor-script [OUT.ps1 | OUT.sh on Linux]"}
    - {name: from_file, flag: --from, type: str, required: false, help: "new: the goal spec (goal.json shape)"}
    - {name: objective, flag: --objective, type: str, required: false, help: "new: the objective (without --from)"}
    - {name: criterion, flag: --criterion, type: str, required: false, help: "new: a command that must exit 0 (repeatable)"}
    - {name: cwd, flag: --cwd, type: str, required: false, help: "new: the goal's folder"}
    - {name: force, flag: --force, type: bool, required: false, help: "new: overwrite an existing goal"}
    - {name: all, flag: --all, type: bool, required: false, help: "stop: every unfinished goal"}
    - {name: once, flag: --once, type: bool, required: false, help: "run: one round per goal, then exit"}
  platforms: [windows, linux]
  platforms_why: 'Windows: a scheduled task at logon and on resume (one real goal, 2026-10-22). Linux (2026-10-25, step B of state/proposed/long-horizon-2026-10-22/DESIGN-MULTI-MACHINE.md): systemd USER units fieldkit-goal.service + .timer (after boot, every 15 min by the wall clock so after resume too; linger), tests/test_long_horizon.py passes on Linux; the supervisor holds idle sleep off with systemd-inhibit. macOS: no supervisor (launchd not written)'
  changes: true
  test: [python, -m, pytest, -q, "${FIELDKIT}/tests/test_long_horizon.py"]
  notes: "State in state/goals/<id>/ (goal.json, GOAL.md, state.json, verdicts.jsonl, events.log, REPORT.md, jobs/<job>/HANDOFF.md + CHECKPOINT.json). Models may not edit goal.json, state.json, verdicts, PREAPPROVALS.yaml or APPROVAL.json (hard line 3). approve needs the owner at a real terminal and pins the register's sha256; any later change voids it. push_branch/open_pr are done by the harness only under an approved register, never to main/master, after the privacy push-check. The scheduled task is written by supervisor-script and registered by the owner, never by a model. Mutation plan: tests/long_horizon_mutations.yaml."

- id: runbook
  title: The harness runs a runbook's steps (logs, ETA, retries, STOP, inbox for owner steps); a model only fixes a failed step
  harness: core
  entry: [python, -m, fieldkit, runbook]
  path: ${FIELDKIT}/fieldkit/autopilot/runbook.py
  inputs:
    - {name: action, flag: null, type: str, required: true, choices: [run, status, start, check], help: "start = run in its own detached window; check = validate needs, budgets, fallback chains"}
    - {name: file, flag: null, type: str, required: true, help: "the runbook .md with a runbook block"}
    - {name: no_fix, flag: --no-fix, type: bool, required: false, help: "never call a model on a failed step"}
  platforms: [windows, linux]
  changes: true
  test: [python, -m, pytest, -q, "${FIELDKIT}/tests/test_autopilot_runbook.py", "${FIELDKIT}/tests/test_long_horizon.py"]
  notes: "Agent steps (agent: BRIEF, or a run: that calls fieldkit autopilot claude) are budgeted jobs in state/jobs/<runbook>/<step>/; exit 75 = paused-resumable (resumed by the next run, dependents wait); agent steps default to stop_on_fail false. Exit 75 when only paused steps are left."

- id: telemetry
  title: Telemetry off and cut out - a project's source scanned for telemetry SDKs, endpoints and collectors; this machine's toolchain opt-outs and firewall blocks checked
  harness: core
  entry: [python, -m, fieldkit, telemetry]
  path: ${FIELDKIT}/fieldkit/core/telemetry.py
  inputs:
    - {name: action, flag: null, type: str, required: true, choices: [scan, machine], help: "scan a project folder, or check this machine"}
    - {name: path, flag: null, type: str, required: false, help: "scan: the project folder (default .)"}
    - {name: fix, flag: --fix, type: str, required: false, help: "machine: write the script the owner runs elevated to close every open row"}
  effects: [reads-files, writes-files]
  safety: reversible
  notes: 'owner rule 2026-10-18: telemetry is excised from every project and blocked on the machine without asking; the build gate fails while a machine row is open; --fix only writes a script, the owner runs it (one UAC click)'
  platforms: [windows, linux]
  test: [python, -m, pytest, -q, "${FIELDKIT}/tests/test_core_telemetry.py"]

- id: toolrouter
  title: Tool router - a command that does by hand what a harness tool does (recursive file search, folder sizes, text search over a tree) is refused with the tool's command, for Claude Code and Antigravity
  harness: core
  entry: [python, -m, fieldkit.autopilot.toolrouter]
  path: ${FIELDKIT}/fieldkit/autopilot/toolrouter.py
  inputs:
    - {name: command, flag: null, type: str, required: false, help: "a command to judge; --hook reads a Claude Code PreToolUse call on stdin"}
  effects: [reads-files]
  safety: read-only
  notes: 'wired as a PreToolUse hook in ~/.claude/settings.json and in ~/.gemini/config/hooks/guard.py 1.5.0; an override needs "# toolrouter-ok: <why>" in the command'
  platforms: [windows, linux]
  test: [python, -m, pytest, -q, "${FIELDKIT}/tests/test_autopilot_toolrouter.py"]

- id: night-pack
  title: The night pack - every owner-only step the night may need (release send, leak-gate re-judge), pre-approved once at the owner's terminal, run by a Windows scheduled task when its conditions hold, disarmed at the first surprise, with a spoken and written morning report
  harness: core
  entry: [python, -m, fieldkit, build-harness, night-pack]
  path: ${FIELDKIT}/fieldkit/buildh/nightpack.py
  inputs:
    - {name: task, flag: null, type: str, required: true, help: "build-harness task id"}
    - {name: action, flag: null, type: str, required: true, help: "prepare | arm (owner terminal, one yes) | run (the scheduler) | status | disarm"}
  effects: [network, git, writes-files, processes]
  safety: reversible
  notes: 'arm stores the pack SHA-256 and registers the scheduled task "Gorilla night pack" (every 10 min, no elevation, expiry); run refuses an agent, a changed pack or an expired arming, runs each action once, removes the task at the end or at the first failure. Never in a pack: allowlist, dispositions, decision register, harness/hooks, telemetry. Owner 2026-10-19.'
  platforms: [windows]
  platforms_why: 'the scheduler half uses Windows Task Scheduler; a Linux port would use a systemd timer'
  test: [python, -m, pytest, -q, "${FIELDKIT}/tests/test_buildh_nightpack.py"]

- id: release-publish
  title: One-step release - the harness proves everything first (hashes, SHA256SUMS, privacy push-check, set-proof, tag new), then the owner's one action pushes with visible output, creates the titled release, checks GitHub's digests and only then marks the old release superseded
  harness: core
  entry: [python, -m, fieldkit, build-harness, release-publish]
  path: ${FIELDKIT}/fieldkit/buildh/releasepublish.py
  inputs:
    - {name: task, flag: null, type: str, required: true, help: "build-harness task id"}
    - {name: action, flag: null, type: str, required: true, help: "prepare (anyone, sends nothing) | send (owner terminal only, asks yes once)"}
  effects: [network, git, writes-files, processes]
  safety: reversible
  notes: 'prepare writes state/publish/<tag>.plan.json; send refuses an agent shell, a missing plan or changed assets, sets GORILLA_OWNER_APPROVED for its own push only, stops at the first failure, speaks the result. Born 2026-10-19 (owner: "I should NOT have to do this"). push= several refspecs (Gorilla OpenCode: windows-port, windows-port:main); ci= workflows to read after.'
  platforms: [windows, linux]
  test: [python, -m, pytest, -q, "${FIELDKIT}/tests/test_buildh_releasepublish.py"]

- id: installer-test
  title: The shipped Windows installer installed and uninstalled for real - silent, no shortcuts, every file checked against the proved zip, the machine left as it was
  harness: core
  entry: [python, -m, fieldkit, build-harness, installer-test]
  path: ${FIELDKIT}/fieldkit/buildh/installertest.py
  inputs:
    - {name: task, flag: null, type: str, required: true, help: "build-harness task id, e.g. firefox-158.0"}
  effects: [writes-files, deletes-files, processes, registry]
  safety: reversible
  notes: 'installs into a session temp folder with an INI (no desktop/start/taskbar shortcuts, no maintenance service, no default-browser agent), uninstalls with uninstall\helper.exe /S, compares HKCU Uninstall + StartMenuInternet + Firefox* classes and the shortcut folders before/after, recycles the folder (never a permanent delete). Born 2026-10-19 (158.0 build 2): the installer had never run.'
  platforms: [windows]
  platforms_why: 'the NSIS .exe installer exists only for the Windows release; the Linux release ships a tarball, .deb and .rpm with their own install checks'
  test: [python, -m, pytest, -q, "${FIELDKIT}/tests/test_buildh_installertest.py"]

- id: room
  title: The shared room - every AI session on this machine sees what the others did on shared ground (commits, history changes, shared-file edits, process starts and stops, network and heavy steps, messages and owner approvals), written by a hook, not by memory
  harness: core
  entry: [python, -m, fieldkit.autopilot.room]
  path: ${FIELDKIT}/fieldkit/autopilot/room.py
  inputs:
    - {name: action, flag: null, type: str, required: false, help: "tail [N] | name SESSION_ID NAME | doctor; --hook reads a Claude Code PostToolUse or UserPromptSubmit call on stdin"}
  effects: [reads-files, writes-files]
  safety: reversible
  notes: 'state/coordination/ROOM.log (git-ignored), one locked line per action with a fixed verb (commit rebase ff edit start stop net heavy approve ask done); secrets, home paths and addresses redacted before writing; the reader shows at most 20 new lines from the OTHER sessions; never blocks a tool call. doctor checks ~/.claude/settings.json and prints the hook change, it never edits settings. Owner 2026-10-19.'
  platforms: [windows, linux]
  test: [python, -m, pytest, -q, "${FIELDKIT}/tests/test_autopilot_room.py"]

- id: eta
  title: How long will it take - from a plan, past runs, live progress or a timed trial on the same disk; never a guess
  harness: core
  entry: [python, -m, fieldkit, eta]
  path: ${FIELDKIT}/fieldkit/core/eta.py
  inputs:
    - {name: action, flag: null, type: str, required: true, choices: [leakgate, build, history, delete, copy, record, calibrate], help: "what to estimate; calibrate measures this machine"}
    - {name: args, flag: null, type: str, required: false, help: "leakgate RUN_DIR; build [build|package] [OBJDIR]; history [STEP]; delete PATH; copy SRC DEST_DIR; record STEP SECONDS"}
    - {name: minutes, flag: --minutes, type: float, required: false, help: "calibrate: longest thermal load (it stops at 70 C first; default 10)"}
    - {name: quick, flag: --quick, type: bool, required: false, help: "calibrate: no thermal load"}
  effects: [reads-files, writes-files, processes]
  safety: reversible
  notes: 'delete and copy time a trial on scratch files they create and remove in a .fieldkit-eta-trial folder on the measured disk; nothing else is touched. calibrate (fieldkit/core/calibrate.py) runs fixed workloads (workload fk-cal-1: CPU single + one process per thread, disk fsync writes, RAM copy, every thread busy until 70 C or --minutes) INSIDE the build guard (fan check fails closed on Windows, governor above thermal.build_target + 3) and stores state/machines/<host>.json (previous run kept under "previous"); the ratio of two machines'' scores decides delegation (DESIGN-MULTI-MACHINE.md)'
  platforms: [windows, linux]
  test: [python, -m, pytest, -q, "${FIELDKIT}/tests/test_core_eta.py", "${FIELDKIT}/tests/test_calibrate.py"]

- id: inbox
  title: The owner inbox - every approval an unattended run needs, collected for one sitting
  harness: core
  entry: [python, -m, fieldkit, inbox]
  path: ${FIELDKIT}/fieldkit/autopilot/inbox.py
  inputs:
    - {name: action, flag: null, type: str, required: false, choices: [list, show, add, done], help: "list (default)"}
    - {name: rest, flag: null, type: str, required: false, help: "show/done: N [note]; add: TITLE WHY [COMMAND]"}
    - {name: all, flag: --all, type: bool, required: false, help: "list: done items too"}
  platforms: [windows, linux]
  changes: true
  test: [python, -m, pytest, -q, "${FIELDKIT}/tests/test_autopilot_run.py"]

- id: publish
  title: Push and release only after the privacy checks and the owner's typed yes; never inside autopilot
  harness: core
  entry: [python, -m, fieldkit, publish]
  path: ${FIELDKIT}/fieldkit/autopilot/inbox.py
  platforms: [windows, linux]
  changes: true
  test: [python, -m, pytest, -q, "${FIELDKIT}/tests/test_autopilot_run.py"]

- id: pref-conflicts
  title: One pref, one value - no two definitions the Firefox patch set adds may disagree (also in set-proof and the build gate)
  harness: build
  entry: [python, -m, fieldkit, build-harness, pref-conflicts]
  path: ${FIELDKIT}/fieldkit/buildh/prefconflicts.py
  inputs:
    - {name: task, flag: null, type: str, required: true, help: "the build-harness task, e.g. firefox-158.0"}
  effects: [reads-files]
  safety: read-only
  platforms: [windows, linux]
  test: [python, -m, pytest, -q, "${FIELDKIT}/tests/test_buildh_prefconflicts.py"]

- id: platform-check
  title: Hold every tool card's platforms to its tests; a new single-system card needs a port or a reason
  harness: desk
  entry: [python, -m, fieldkit.desk.platformcheck]
  path: ${FIELDKIT}/fieldkit/desk/platformcheck.py
  platforms: [windows, linux]
  changes: false
  test: [python, -m, pytest, -q, "${FIELDKIT}/tests/test_sync_and_platforms.py"]

# Full agent cards: every field the agent interface uses, reviewed by hand.

- id: office-read
  title: Read a Word, Excel, PowerPoint or PDF file as plain text
  harness: office
  entry: [python, -m, fieldkit, office, read]
  path: ${FIELDKIT}/fieldkit/office/read.py
  inputs:
    - {name: file, flag: null, type: str, required: true, help: "the .docx .xlsx .pptx or .pdf file"}
  effects: [reads-files]
  safety: read-only
  platforms: [windows, linux]
  test: [python, -m, pytest, -q, "${FIELDKIT}/tests/test_office.py"]

- id: office-check
  title: Check an Office or PDF file is not broken before sending it
  harness: office
  entry: [python, -m, fieldkit, office, check]
  path: ${FIELDKIT}/fieldkit/office/check.py
  inputs:
    - {name: file, flag: null, type: str, required: true, help: "the .docx .xlsx .pptx or .pdf file"}
  effects: [reads-files]
  safety: read-only
  platforms: [windows, linux]
  test: [python, -m, pytest, -q, "${FIELDKIT}/tests/test_office.py"]

- id: office-scrub
  title: Remove people's names from the hidden properties of a Word, Excel or PowerPoint file
  harness: office
  entry: [python, -m, fieldkit, office, scrub]
  path: ${FIELDKIT}/fieldkit/office/scrub.py
  inputs:
    - {name: file, flag: null, type: str, required: true, help: "the .docx .xlsx or .pptx file"}
    - {name: term, flag: --term, type: list, required: false, help: "names or numbers to remove, besides the author fields"}
  effects: [writes-files]
  safety: reversible
  scope: [file]
  modes:
    preview: ["+", "--check"]
    verify:
      - {command: [python, -m, fieldkit, office, check, "{file}"]}
      - {command: [python, -m, fieldkit, office, scrub, "{file}", --check]}
  platforms: [windows, linux]
  test: [python, -m, pytest, -q, "${FIELDKIT}/tests/test_office.py"]

- id: office-deliver
  title: Make a Word, Excel, PowerPoint or PDF file safe to send (check, remove names, recheck, privacy scan)
  harness: office
  entry: [python, -m, fieldkit, office, deliver]
  path: ${FIELDKIT}/fieldkit/office/deliver.py
  inputs:
    - {name: file, flag: null, type: str, required: true, help: "the file to send, after its LAST save"}
  effects: [writes-files]
  safety: reversible
  scope: [file]
  modes:
    preview: [python, -m, fieldkit, office, scrub, "{file}", --check]
    verify:
      - {command: [python, -m, fieldkit, office, check, "{file}"]}
      - {command: [python, -m, fieldkit, office, scrub, "{file}", --check]}
      - {command: [python, -m, fieldkit, privacy, scan, "{file}"]}
  platforms: [windows, linux]
  test: [python, -m, pytest, -q, "${FIELDKIT}/tests/test_deliver.py"]

- id: pipeline
  title: Staged, resumable pipelines (Firefox on Windows, Debian kernel, Gorilla OpenCode and any Go app)
  harness: build
  entry: [python, -m, fieldkit, pipeline]
  effects: [reads-files, writes-files, processes, network]   # from the title and path (2026-10-19); confirm on adoption
  path: ${FIELDKIT}/fieldkit/core/pipeline.py
  inputs: []                        # running one is the owner's: agents read the plan, and `next` says the step
  platforms: [windows, linux]
  changes: true
  test: [python, -m, pytest, -q, "${FIELDKIT}/tests/test_pipeline.py", "${FIELDKIT}/tests/test_kernel.py"]

- id: pipeline-plan
  title: "What a pipeline would do, fully resolved, and what changed since its last run (read-only)"
  harness: build
  entry: [python, -m, fieldkit, pipeline, plan]
  path: ${FIELDKIT}/fieldkit/core/pipeline.py
  inputs:
    - {name: name, flag: null, type: str, required: true, help: "the pipeline: debian-kernel, gorilla-opencode, go-app ..."}
    - {name: var, flag: --var, type: list, required: false, help: "k=v settings, e.g. src=PATH version=v1.2"}
  effects: [reads-files]
  safety: read-only
  output: own
  platforms: [windows, linux]
  test: [python, -m, pytest, -q, "${FIELDKIT}/tests/test_pipeline.py"]

- id: triage
  title: Name a build failure from its log (Firefox, kernel, Debian packaging)
  harness: build
  entry: [python, -m, fieldkit, triage]
  path: ${FIELDKIT}/fieldkit/build/triage.py
  inputs:
    - {name: log, flag: null, type: str, required: true, help: "the build or install log file"}
    - {name: set, flag: --set, type: str, required: false, help: "rule set",
       choices: [auto, firefox-windows, debian-kernel, debian-packaging]}
  effects: [reads-files]
  safety: read-only
  platforms: [windows, linux]
  test: [python, -m, pytest, -q, "${FIELDKIT}/tests/test_triage.py"]
  supersedes: firefox-triage

- id: privacy-scan
  title: Find secrets, personal paths, emails and private names before publishing
  harness: core
  entry: [python, -m, fieldkit, privacy, scan]
  path: ${FIELDKIT}/fieldkit/core/privacy.py
  inputs:
    - {name: paths, flag: null, type: list, required: true, help: "files or folders to scan"}
    - {name: git, flag: --git, type: flag, required: false, help: "only what git would publish"}
  effects: [reads-files]
  safety: read-only
  platforms: [windows, linux]
  test: [python, -m, pytest, -q, "${FIELDKIT}/tests/test_core.py"]

- id: update-check
  title: What on this machine is behind what was published, and the line that fixes it
  harness: core
  entry: [python, -m, fieldkit, update]
  path: ${FIELDKIT}/fieldkit/update/__init__.py
