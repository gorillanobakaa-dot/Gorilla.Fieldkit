  test: [python, -m, pytest, -q, "${FIELDKIT}/tests/test_buildh_stats.py"]

- id: bh-drive
  title: Drive a task with a local model - one fresh Gorilla OpenCode run per job, until done or blocked
  harness: build
  entry: [python, -m, fieldkit, build-harness, drive]
  path: ${FIELDKIT}/fieldkit/buildh/cli.py
  inputs:
    - {name: task, flag: null, type: str, required: false, help: "the build-harness task (default: the current one)"}
    - {name: agent, flag: --agent, type: str, required: false, help: "the agent command (default gorilla-opencode)"}
    - {name: max_jobs, flag: --max-jobs, type: int, required: false, help: "stop after this many jobs (200)"}
    - {name: job_timeout, flag: --job-timeout, type: str, required: false, help: "time limit per job, e.g. 45m"}
    - {name: tools, flag: --tools, type: flag, required: false, help: "let the model edit with tools; refused unless FIELDKIT_ALLOW_MODEL_TOOLS=1"}
    - {name: line_ops, flag: --line-ops, type: flag, required: false, help: "line operations instead of REMOVE/KEEP questions"}
