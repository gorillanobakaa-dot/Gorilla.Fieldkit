  path: ${FIELDKIT}/fieldkit/desk/size.py
  repo: gorillanobakaa-dot/gorilla-size
  inputs:
    - {name: paths, flag: null, type: list, required: false, help: "where to look"}
    - {name: number, flag: --number, type: int, required: false, help: "how many (default 20)"}
  effects: [reads-files]
  safety: read-only
  platforms: [windows, linux]
  test: [python, -m, pytest, -q, -p, no:cacheprovider, "${FIELDKIT}/tests/test_desk_size.py"]
  notes: "`fieldkit size oldest` is the same with the oldest first."

