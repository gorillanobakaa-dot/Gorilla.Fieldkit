    preview: [python, -m, fieldkit, build-harness, preflight, --model]
  platforms: [windows, linux]
  test: [python, -m, pytest, -q, "${FIELDKIT}/tests/test_buildh_drive.py"]
  notes: "Runs preflight with the model check (an HTTP request to the configured model server), syncs the record with the tree (may reopen steps), then one job at a time. --tools gives the model write access anywhere the user can write. Every attempt is checkpointed or reverted in git."

