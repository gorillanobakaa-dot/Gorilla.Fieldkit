- id: ship
  title: The git side of shipping - status, sync a squash-merged branch (merge -s ours), push, audit, release, prune; never forces
  harness: method
  entry: [python, -m, fieldkit, ship]
  path: ${FIELDKIT}/fieldkit/method/ship.py
  inputs:
    - {name: action, flag: null, type: str, required: true, choices: [status, sync, push, audit, release, prune], help: "status and audit read; sync, push, release, prune change the repo or the remote"}
    - {name: tag, flag: null, type: str, required: false, help: "release: vX.Y.Z"}
    - {name: offline, flag: --offline, type: flag, required: false, help: "audit: git only, no network"}
    - {name: archive_unproven, flag: --archive-unproven, type: flag, required: false, help: "prune: save an unproven branch as tag archive/<branch>, then delete it"}
    - {name: scaffold, flag: --scaffold, type: flag, required: false, help: "release: write the missing note files and stop"}
    - {name: wait, flag: --wait, type: int, required: false, help: "release: seconds to wait for the published release (900)"}
    - {name: base, flag: --base, type: str, required: false, help: "the base branch (main)"}
    - {name: repo, flag: --repo, type: str, required: false, help: "the repository folder (.)"}
  effects: [git, network, writes-files]
  safety: irreversible
  output: own
  exits: {3: "refused, with the reason and the next step"}
  modes:
    preview: [python, -m, fieldkit, ship, status]
    verify: [python, -m, fieldkit, ship, audit]
  platforms: [windows, linux]
  test: [python, -m, pytest, -q, "${FIELDKIT}/tests/test_methods.py", "${FIELDKIT}/tests/test_ship_audit_release.py", -k, "ship or audit or release or prune"]
  skill: skills/fieldkit-methods/SKILL.md
  notes: "PUBLISHES: push sends commits to origin (retries on network errors); release pushes an annotated tag that triggers the release workflow and waits on GitHub; prune DELETES remote branches git or GitHub prove merged (with --archive-unproven, tags first). audit uses the GitHub API via gh unless --offline. sync makes a merge commit carrying the git config fieldkit.trailer lines. Never force-pushes, rebases or pushes to the base. Every push/release needs the owner's yes, and the keep-identity-off-GitHub check (catchup public-check) first."

