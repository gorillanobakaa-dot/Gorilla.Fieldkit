  inputs:
    - {name: task, flag: null, type: str, required: false, help: "the build-harness task (default: the current one)"}
    - {name: release, flag: --release, type: flag, required: false, help: "release run: full durations, 3 repetitions, packets required (UAC on Windows)"}
