# -------------------------------------------------------------------------------------------------------------------
# fieldkit build-harness <action> (bh-*) and the methods as tools: carded 2026-10-18 from the source; every flag
# is declared on the shared build-harness parser. Exit codes common to every bh- card: 0 ok, 2 REFUSED, 1 settings or
# file error; `exits` lists the answer codes only. TASK is the first positional word; left out, the current task.
# Under migration control record/repair/build-run/decide need a work item of the current stage, or --park.
# -------------------------------------------------------------------------------------------------------------------

- id: bh-start
  title: Plan a Firefox port task for the latest stable release (or a pinned one) and make it the current task
  harness: build
  entry: [python, -m, fieldkit, build-harness, start]
  path: ${FIELDKIT}/fieldkit/buildh/cli.py
  inputs:
    - {name: product, flag: null, type: str, required: true, choices: [firefox], help: "only firefox (anything else: SystemExit 'the kernel workflow comes next')"}
    - {name: task, flag: --task, type: str, required: false, help: "task id (default firefox-<version>)"}
    - {name: pin, flag: --pin, type: str, required: false, help: "a stable version instead of the latest, e.g. 155.0.1"}
    - {name: source, flag: --source, type: str, required: false, help: "repository URL or local git path holding the release tag"}
    - {name: budget, flag: --budget, type: int, required: false, help: "the model's context window in tokens (100000)"}
    - {name: workdir, flag: --workdir, type: str, required: false, help: "working copy (default <vault root>/../Build.Work/firefox/<version>)"}
    - {name: harness, flag: --harness, type: str, required: false, help: "the Gorilla.firefox folder to read patches from (default firefox.root)"}
  effects: [network, writes-files, git]
  safety: reversible
  platforms: [windows, linux]
  test: [python, -m, pytest, -q, "${FIELDKIT}/tests/test_buildh_cli_fixes.py", -k, "start"]
  notes: "Contacts Mozilla's product-details version list and the release tag on github.com/mozilla-firefox/firefox (upstream.py). Writes state/build-harness/<task>/ and CURRENT. task.start is tested in test_buildh_task.py; the start_firefox CLI wrapper is not (it crashed on 2026-10-16 printing its result, per the code comment)."

- id: bh-approve
  title: The owner approves the planned steps of a task (nothing runs before this)
  harness: build
  entry: [python, -m, fieldkit, build-harness, approve]
  path: ${FIELDKIT}/fieldkit/buildh/task.py
  inputs:
    - {name: task, flag: null, type: str, required: false, help: "the build-harness task (default: the current one)"}
  effects: [writes-files]
  safety: reversible
  platforms: [windows, linux]
  test: [python, -m, pytest, -q, "${FIELDKIT}/tests/test_buildh_task.py", -k, approves]
  notes: "Owner action by convention only: task.approve has NO owner_terminal() check (unlike unblock skip, decide, leakgate approvals). An agent shell can run it. Never offered over MCP."

- id: bh-status
  title: A task's step counts, checkpoints and current step
  harness: build
  entry: [python, -m, fieldkit, build-harness, status]
  path: ${FIELDKIT}/fieldkit/buildh/task.py
  inputs:
    - {name: task, flag: null, type: str, required: false, help: "the build-harness task (default: the current one)"}
  effects: [reads-files]
  safety: read-only
  output: own
  platforms: [windows, linux]
  test: [python, -m, pytest, -q, "${FIELDKIT}/tests/test_buildh_task.py"]

- id: bh-next
  title: The next job packet of a task (runs the script steps before it, then hands out one model step)
  harness: build
  entry: [python, -m, fieldkit, build-harness, next]
  path: ${FIELDKIT}/fieldkit/buildh/task.py
  inputs:
    - {name: task, flag: null, type: str, required: false, help: "the build-harness task (default: the current one)"}
  effects: [reads-files, writes-files, git]
  safety: reversible
  platforms: [windows, linux]
  test: [python, -m, pytest, -q, "${FIELDKIT}/tests/test_buildh_task.py", -k, script_steps_run]
  notes: "Not a pure read: task.packet runs pending script steps (port automation in the working copy, checkpointed in git) before it returns a model packet."

- id: bh-submit
  title: Check the current step's change in the working copy; pass = checkpoint, fail = change put back
  harness: build
  entry: [python, -m, fieldkit, build-harness, submit]
  path: ${FIELDKIT}/fieldkit/buildh/task.py
  inputs:
    - {name: task, flag: null, type: str, required: false, help: "the build-harness task (default: the current one)"}
    - {name: note, flag: --note, type: str, required: false, help: "a note for the log"}
    - {name: dry_run, flag: --dry-run, type: flag, required: false, help: "run the check only; no attempt spent, nothing changed"}
    - {name: hand, flag: --hand, type: flag, required: false, help: "a PERSON ported this hunk; judged by meaning"}
    - {name: adapted, flag: --adapted, type: str, required: false, help: "the model declares an adapted port, with its reason; saved as a proposal, no attempt spent"}
  effects: [writes-files, git]
  safety: reversible
  exits: {3: findings}
  modes:
    preview: ["+", --dry-run]
  platforms: [windows, linux]
  test: [python, -m, pytest, -q, "${FIELDKIT}/tests/test_buildh_task.py", "${FIELDKIT}/tests/test_buildh_firefox.py", -k, "trial or harness_checks or pass_makes or adapted"]

- id: bh-proposals
  title: The adapted ports waiting for the owner, with why each was adapted
  harness: build
  entry: [python, -m, fieldkit, build-harness, proposals]
  path: ${FIELDKIT}/fieldkit/buildh/task.py
  inputs:
    - {name: task, flag: null, type: str, required: false, help: "the build-harness task (default: the current one)"}
  effects: [reads-files]
  safety: read-only
  output: own
  platforms: [windows, linux]
  test: [python, -m, pytest, -q, "${FIELDKIT}/tests/test_buildh_task.py", -k, adapted_port]

- id: bh-accept
  title: The owner accepts waiting adapted ports in one go (applied, judged by meaning, checkpointed)
  harness: build
  entry: [python, -m, fieldkit, build-harness, accept]
  path: ${FIELDKIT}/fieldkit/buildh/task.py
  inputs:
    - {name: task, flag: null, type: str, required: false, help: "the build-harness task (default: the current one)"}
    - {name: steps, flag: null, type: list, required: false, help: "step ids to accept (after TASK); none = every waiting proposal"}
    - {name: all, flag: --all, type: flag, required: false, help: "every waiting proposal"}
  effects: [writes-files, git]
  safety: reversible
  exits: {3: findings}
  modes:
    preview: [python, -m, fieldkit, build-harness, proposals]
  platforms: [windows, linux]
  test: [python, -m, pytest, -q, "${FIELDKIT}/tests/test_buildh_task.py", -k, "accept"]
  notes: "Owner action by convention: task.accept has no owner_terminal() check. Exit 3 when a proposal no longer applies (that step goes back to failed). Undo of an accepted step: bh-rewind."

- id: bh-withdraw
  title: Take back one waiting proposal with a reason (moved to proposals/withdrawn, step ends obsolete)
  harness: build
  entry: [python, -m, fieldkit, build-harness, withdraw]
  path: ${FIELDKIT}/fieldkit/buildh/task.py
  inputs:
    - {name: task, flag: null, type: str, required: true, help: "the build-harness task"}
    - {name: step, flag: null, type: str, required: true, help: "the step id"}
    - {name: note, flag: --note, type: str, required: true, help: "why"}
  effects: [writes-files]
  safety: reversible
  platforms: [windows, linux]
  test: [python, -m, pytest, -q, "${FIELDKIT}/tests/test_buildh_task.py", -k, withdrawn]
  notes: "The proposal file is moved, never deleted; no undo command (move it back by hand)."

- id: bh-drop
  title: Drop whole patches from a running port as their author said, files back to pristine, kept patches re-applied
  harness: build
  entry: [python, -m, fieldkit, build-harness, drop]
  path: ${FIELDKIT}/fieldkit/buildh/task.py
  inputs:
    - {name: task, flag: null, type: str, required: true, help: "the build-harness task"}
    - {name: patches, flag: null, type: list, required: true, help: "patch files to drop"}
    - {name: keep, flag: null, type: str, required: false, help: "keep=PATCH: a patch sharing those files, applied again"}
    - {name: note, flag: --note, type: str, required: true, help: "why (quote the author)"}
  effects: [writes-files, git]
  safety: reversible
  platforms: [windows, linux]
  test: [python, -m, pytest, -q, "${FIELDKIT}/tests/test_buildh_firefox.py", -k, drop]
  notes: "Refused with uncommitted work or when another patch's step already changed one of the files. Work tree is git-checkpointed; no undo command (bh-rewind to the checkpoint before)."

- id: bh-unblock
  title: The owner unblocks a step - retry (fresh attempts), hand (a person ports it) or skip (owner at a real terminal)
  harness: build
  entry: [python, -m, fieldkit, build-harness, unblock]
  path: ${FIELDKIT}/fieldkit/buildh/task.py
  inputs:
    - {name: task, flag: null, type: str, required: true, help: "the build-harness task"}
    - {name: step, flag: null, type: str, required: true, help: "the step id"}
    - {name: how, flag: null, type: str, required: true, choices: [retry, hand, skip], help: "skip needs a terminal on stdin and is refused for check steps"}
  effects: [writes-files, git]
  safety: reversible
  platforms: [windows, linux]
  test: [python, -m, pytest, -q, "${FIELDKIT}/tests/test_buildh_task.py", -k, "skip or blocked"]
  notes: "Usage line in the module docstring says retry|skip; the code also takes hand. retry and hand have no terminal check."

- id: bh-rewind
  title: Undo a step that passed but is wrong - working copy reset to the checkpoint before it, later steps pending
  harness: build
  entry: [python, -m, fieldkit, build-harness, rewind]
  path: ${FIELDKIT}/fieldkit/buildh/task.py
  inputs:
    - {name: task, flag: null, type: str, required: true, help: "the build-harness task"}
    - {name: step, flag: null, type: str, required: true, help: "the step id to rewind to"}
  effects: [writes-files, deletes-files, git]
  safety: irreversible
  platforms: [windows, linux]
  test: [python, -m, pytest, -q, "${FIELDKIT}/tests/test_buildh_task.py", -k, rewind]
  notes: "git reset --hard + git clean -fd in the working copy: uncommitted files are deleted. Checkpoint commits survive in the reflog only. No owner_terminal() check."

- id: bh-describe
  title: One step of a task in full words (the current step by default), for messages and window titles
  harness: build
  entry: [python, -m, fieldkit, build-harness, describe]
