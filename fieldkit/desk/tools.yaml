  title: "Is the owner-wide mandate working on this computer: in force or not, days left, the owner key here, the key trusted, the other computer's (VAIO's) review key pinned, and every covered repository's pre-push hook - honors the gate, needs none, by design, or NEEDS the gate - plus the expiry warning"
