# --- Media kits (kits/): photos and phone video, offline -----------------------
- id: photokit
  title: "Photos: contact sheets, near-duplicate candidates + side-by-side compare, mapping check, sort into per-item folders, fetch report photos, doctor"
  harness: desk
  entry: [python, -I, "${FIELDKIT}/kits/photokit/photokit.py"]
  path: ${FIELDKIT}/kits/photokit/photokit.py
  inputs:
    - {name: command, flag: null, type: str, required: true, help: "doctor [--install] | sheet SRC OUT | dupes SRC [--window 1 --sheet OUT] | compare SRC OUT A:B... | check SRC MAP | sort SRC MAP OUT | fetch LIST OUT | serve ROOT"}
  effects: [reads-files, writes-files, network]   # network only for fetch; installs only with doctor --install
  safety: reversible
  platforms: [windows, linux]
  test: [python, -m, pytest, -q, "${FIELDKIT}/tests/test_photokit.py", -p, "no:cacheprovider"]
  notes: "Writes only into the OUT folder named; never moves or deletes originals. dupes only proposes: decide duplicates by looking (compare). Procedure: skill fieldkit-property-inventory."

- id: videokit
  title: "Phone video: doctor (check/install + per-video VFR/HDR/rotation), analyse (cached, real timestamps), events/draft, shake/shakecompare (phase-correlation jitter), flow (freezes, hard joins), lock (OpenCV gimbal/tripod/similarity, streamed), render (best-second waits, per-segment stabiliser by measured jitter, dissolves, gamma, sharpen)"
  harness: desk
  entry: [python, -I, "${FIELDKIT}/kits/videokit/videokit.py"]
  path: ${FIELDKIT}/kits/videokit/videokit.py
  inputs:
    - {name: command, flag: null, type: str, required: true, help: "doctor [--install] [--video V] | probe V | analyse V | events V | draft V PLAN | frames V OUT [--at-events] | measure V OUT.csv | shake V | shakecompare SRC PLAN OUT... [--strict] | flow V [--strict] | lock V OUT | render V PLAN OUT.mp4"}
  effects: [reads-files, writes-files, network]   # installs only with doctor --install
  safety: reversible
  platforms: [windows, linux]
  test: [python, -m, pytest, -q, "${FIELDKIT}/tests/test_videokit.py", -p, "no:cacheprovider"]
  notes: "Writes the output named plus an analysis cache in ~/.cache/videokit (VIDEOKIT_CACHE; safe to delete); the source is never touched. Needs numpy, Pillow, opencv-python and a full ffmpeg build (doctor checks; NOT the PyPI vidstab package). Long-video proof: kits/videokit/bench_long.py. Procedure: skill fieldkit-video-edit."
- id: gpudecode
  title: "Prove a browser decodes video on the GPU's video engine (Windows): doctor (GPUs, drivers, the no-driver trap, which methods work), engines (engine number -> type; WPA node = engine + 1), live (built-in counters, no admin), trace (wpr, one UAC prompt) + export (wpaexporter) + verdict (VideoDecode packets per process, steady rate), adk plan/install (Windows Performance Toolkit only, Microsoft-signed, CEIP off)"
  harness: desk
  entry: [python, -I, "${FIELDKIT}/kits/gpudecode/gpudecode.py"]
  path: ${FIELDKIT}/kits/gpudecode/gpudecode.py
  inputs:
    - {name: command, flag: null, type: str, required: true, help: "doctor [--json] | engines [--save F] | live [--seconds N] [--process P] | trace [--seconds N] [--out DIR] --yes | export ETL [--out DIR] | verdict CSV --engines F [--process P] | adk plan | adk install --yes | explain"}
  effects: [reads-files, writes-files, processes, admin, network]   # admin: trace and adk install (one UAC prompt each); network: adk install only
  safety: reversible
  platforms: [windows]
  platforms_why: "wpr/ETW, the GPU Engine counters and the Windows Performance Toolkit exist only on Windows; Linux has intel_gpu_top, macOS gets its own backend (DTrace on the Intel decoder bundle + a VideoToolbox hardware-only session), planned"
  test: [python, -m, pytest, -q, "${FIELDKIT}/tests/test_gpudecode.py", -p, "no:cacheprovider"]
  notes: "Evidence from Microsoft's own tools: wpr.exe (ships with Windows) records the kernel graphics scheduler's work packets; wpaexporter.exe (Windows Performance Toolkit, Windows ADK) exports them, one CSV row per packet, through kits/gpudecode/gpu-packets.wpaProfile. Hardware decoding = the browser's packets on a VideoDecode engine at about the video's frame rate (measured 2026-10-22, Gorilla on Iris Xe: 16,803 packets, steady 60/s on a 60 fps clip). Traces are ~40 MB per requested second (30 s = 1.2 GB) and record ALL GPU work on the machine: keep them local. NEVER tracerpt a trace to XML (30 s -> 43+ GB). trace refuses while another wpr session runs and never cancels it. Old Intel (HD 4000 and older): drivers are pre-WDDM 2.0, so live has no counters - use trace; they hardware-decode H.264 only. Procedure: skill fieldkit-gpudecode."

- id: linkcheck
  title: "A direct cable between two computers: setup (a private address, no gateway, no DNS; idempotent, read back), serve (the other end: TCP sink/source + UDP echo bound to one address, one allowed peer, idle stop), check PEER (speed, duplex, Energy Efficient Ethernet, RTT p50/p99/jitter/loss, TCP throughput both ways with its own sender, path MTU; one LINK line), status, doctor; Windows + Linux, standard library"
  harness: desk
  entry: [python, -I, "${FIELDKIT}/kits/linkcheck/linkcheck.py"]
  path: ${FIELDKIT}/kits/linkcheck/linkcheck.py
  inputs:
    - {name: command, flag: null, type: str, required: true, help: "setup --ip A/P --iface NAME [--undo] | serve --bind A [--allow PEER] [--idle S] [--once] | check PEER [--count N] [--seconds S] | status [PEER] [--iface NAME] | doctor"}
    - {name: peer, flag: null, type: str, required: false, help: "check/status: the other end's cable address"}
    - {name: ip, flag: --ip, type: str, required: false, help: "setup: this end's private address with prefix, e.g. 10.77.0.1/30"}
    - {name: iface, flag: --iface, type: str, required: false, help: "the cable's card (Windows 'Ethernet'; Linux enp0s25)"}
    - {name: bind, flag: --bind, type: str, required: false, help: "serve: this end's cable address (never 0.0.0.0)"}
    - {name: allow, flag: --allow, type: str, required: false, help: "serve: the only peer answered"}
    - {name: json, flag: --json, type: bool, required: false, help: "check/status: machine output"}
  effects: [reads-files, writes-files, network, admin]   # network: the cable only; admin: setup only (one UAC prompt via the elevate kit / pkexec)
  safety: reversible
  platforms: [windows, linux]
  test: [python, -m, pytest, -q, "${FIELDKIT}/tests/test_linkcheck.py", -p, "no:cacheprovider"]
  notes: "Built for two machines sharing one goal over a direct cable (state/proposed/long-horizon-2026-10-22/DESIGN-MULTI-MACHINE.md, step A). No iperf3: its own sender/receiver (6 Gbit/s on loopback on an i7-1255U, so Python is not the limit at 1 Gbit/s). RTT is application level (both stacks) from UDP echoes, one outstanding. A Wi-Fi card is not failed for half duplex and its PHY rate is not judged as capacity. setup never adds a gateway or DNS and refuses a public address; undo only removes what it set. serve is a foreground process, never a service: it binds one address, answers one peer, echoes only its own 12-byte packets, stops when idle. Results kept as JSON in state/linkcheck (LINKCHECK_RESULTS). Admin on Windows through local/kits/Elevate (LINKCHECK_ELEVATE); without it, setup writes the script and says to run it elevated."

