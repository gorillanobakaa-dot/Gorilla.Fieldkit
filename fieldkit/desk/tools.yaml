  inputs:
    - {name: var, flag: --var, type: list, required: true, help: "version=v0.1.153 (and src=PATH unless goapps.gorilla-opencode is set; previous_deb=PATH|none; out=PATH; xz_cap_mib=128; git_ref=COMMIT builds from a clean clone of it; compare_with=FOLDER|release compares each binary with the published one)"}
  effects: [reads-files, writes-files, processes, network]
  safety: changes
  output: own
  notes: "Born 2026-10-25 from the v0.1.152 release done by hand on Windows. Network: go mod download (checked against go.sum) and, with previous_deb=auto, gh release download of the last .deb (checked against its SHA256SUMS); compare_with=release downloads the release's binaries (checked against its SHA256SUMS). Arch comes from the arch-package workflow. A folder without .git builds without vcs.* info: bytes differ from a git-checkout build of the same source; git_ref=COMMIT clones the commit (never git worktree add: nothing is written into the source repository). Every .deb/.xz made must pass fieldkit xzcheck or the packages stage fails. The build stage refuses a tree with CRLF files under eol=lf (v0.1.152 was built from one: 574 files, published bytes reproducible only from that folder). Byte equality only: --only toolchain modules build repro published."
  platforms: [windows, linux]
  test: [python, -m, pytest, -q, "${FIELDKIT}/tests/test_goapp_windows_release.py", "${FIELDKIT}/tests/test_goapp.py"]

