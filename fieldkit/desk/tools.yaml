- id: wait
  title: Wait on a condition, never on a clock - poll a command (exit code or regex) or a file, with a deadline
  harness: method
  entry: [python, -m, fieldkit, wait]
  path: ${FIELDKIT}/fieldkit/method/wait.py
  inputs:
    - {name: until, flag: --until, type: str, required: false, help: "the command to check, as one string (this or --until-file)"}
    - {name: until_file, flag: --until-file, type: str, required: false, help: "wait until this path exists"}
    - {name: matches, flag: --matches, type: str, required: false, help: "regex the command's output must match (instead of its exit code)"}
    - {name: expect_exit, flag: --exit, type: int, required: false, help: "the exit code that means done (0)"}
    - {name: timeout, flag: --timeout, type: float, required: false, help: "deadline in seconds (600)"}
    - {name: every, flag: --every, type: float, required: false, help: "seconds between checks (5)"}
  effects: [processes]
  safety: unknown
  output: own
  exits: {3: "deadline reached"}
  platforms: [windows, linux]
  test: [python, -m, pytest, -q, "${FIELDKIT}/tests/test_methods.py", -k, wait]
  skill: skills/fieldkit-methods/SKILL.md
  notes: "Read-only itself; runs the --until command every --every seconds, so its safety is that command's. --until-file only reads. Exit 2 bad input."

- id: mutate
  title: Prove a test can fail - break a rule on purpose, run the test, put the file back byte for byte
  harness: method
  entry: [python, -m, fieldkit, mutate]
  path: ${FIELDKIT}/fieldkit/method/mutate.py
  inputs:
    - {name: file, flag: null, type: str, required: false, help: "the file to mutate (or --plan)"}
    - {name: swap, flag: --swap, type: list, required: false, help: "OLD NEW: the text to swap (must occur exactly --count times)"}
    - {name: count, flag: --count, type: int, required: false, help: "expected occurrences (1)"}
    - {name: plan, flag: --plan, type: str, required: false, help: "YAML list of {file, swap: [OLD, NEW], why}"}
    - {name: cwd, flag: --cwd, type: str, required: false, help: "folder to run the test in"}
    - {name: timeout, flag: --timeout, type: float, required: false, help: "test timeout in seconds (1800)"}
    - {name: test, flag: null, type: list, required: true, help: "after --: the test command"}
  effects: [writes-files, processes]
  safety: reversible
  output: own
  exits: {3: "a mutation SURVIVED"}
  platforms: [windows, linux]
  test: [python, -m, pytest, -q, "${FIELDKIT}/tests/test_methods.py", -k, mutat]
  skill: skills/fieldkit-methods/SKILL.md
  notes: "The file is changed for the length of one test run and restored also on Ctrl+C or a crash (a hard kill of the process would leave it mutated). Exit 2 also when the test fails on the untouched file. Runs the given test command."

