- id: ship
  title: The git side of shipping - status, sync a squash-merged branch (merge -s ours), commit (a known hook refusal fixed and tried again, the same one twice or an unknown one reported, never --no-verify), push, merge (into main only under a project mandate, every condition proven by the tool), audit (remote branches, open PRs, and since 2026-10-23 local worktrees and local branches left behind), release, prune; never forces
  harness: method
