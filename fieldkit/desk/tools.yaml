- id: bh-leakgate
  title: Run the leak gate on the task's built package - quiet machine, mitm, DNS and packet sensors, judged by policy
  harness: build
  entry: [python, -m, fieldkit, build-harness, leakgate]
  path: ${FIELDKIT}/fieldkit/leakgate/gate.py
  inputs:
    - {name: task, flag: null, type: str, required: false, help: "the build-harness task (default: the current one)"}
    - {name: release, flag: --release, type: flag, required: false, help: "release run: full durations, 3 repetitions, packets required (UAC on Windows)"}
    - {name: repeat, flag: --repeat, type: int, required: false, help: "repetitions per scenario (1; release >= 3)"}
    - {name: soak, flag: --soak, type: int, required: false, help: "startup-idle duration in seconds (1800 or 3600)"}
    - {name: firewall, flag: --firewall, type: flag, required: false, help: "(elevated) outbound block rule for the direct build copy, removed at the end"}
    - {name: only, flag: --only, type: str, required: false, help: "comma list of scenarios"}
  effects: [processes, network, admin, writes-files, deletes-files]
  safety: irreversible
  exits: {3: findings}
  modes:
    preview: [python, -m, fieldkit, build-harness, leakgate-scope]
    verify: [python, -m, fieldkit, build-harness, leakgate-status]
  platforms: [windows, linux]
  test: [python, -m, pytest, -q, "${FIELDKIT}/tests/test_leakgate.py", "${FIELDKIT}/tests/test_leakgate_actions_run.py", "${FIELDKIT}/tests/test_leakgate_sensors.py"]
  notes: "DANGEROUS TO THE OWNER'S SESSION: 'quiet machine' stops every user app that holds a network socket or is on the quiet list, by PID, and a holder re-checks every 2 s until the gate ends (autopilot/quiet.py) - unsaved work in those apps is lost. Starts mitmdump and browser copies (stops its own by PID). Lets the build copies reach the real network (that is the measurement). Windows: --release asks UAC for the elevated pktmon helper; with admin it enables the DNS-Client event log (restored afterwards per dnsclient_restore - not traced); --firewall adds and removes an outbound rule. Linux: needs root (network namespace, nftables). Writes the run folder and <owner>/state/leakgate_result.json (the publish gate reads it). Hours for a release run: use bh-window."

