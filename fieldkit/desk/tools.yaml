  path: ${FIELDKIT}/fieldkit/aliases.py
  inputs:
    - {name: name, flag: null, type: str, required: false, help: "a short name; none lists them all"}
    - {name: show, flag: --show, type: flag, required: false, help: "print the full command only"}
    - {name: json, flag: --json, type: flag, required: false, help: "the list as JSON (Gorilla OpenCode /commands)"}
  effects: [processes]           # runs the fieldkit command the name stands for, nothing else
  safety: reversible             # the command it runs carries its own card and safety
  output: own
  exits: {2: "unknown name, or a value it needs was not given"}
  platforms: [windows, linux]
  test: [python, -m, pytest, -q, "${FIELDKIT}/tests/test_aliases.py"]
  notes: "Owner, 2026-10-23: commands so long that typing them takes longer than letting the AI do the job; short names in English, the full command always shown. Names are data (fieldkit/desk/aliases.yaml; local/aliases.yaml for a person's own names and defaults such as which Mac). The test runs every name's command with --help, so a renamed command breaks the test, not a person."

- id: fieldkit-mac
  title: 'Reach an old Mac over SSH (a MacBook Air 2011 on macOS 10.13 and the like): find it when its address changes, check key, login and alias, read what it is, run a command on it'
  harness: fieldkit
  entry: [python, -m, fieldkit, mac]
  path: ${FIELDKIT}/fieldkit/mac/macssh.py
  inputs:
    - {name: command, type: choice, choices: [list, add, doctor, find, info, fix-alias, run, shot, release-install, keep-awake, open-app, screen-text, keys, wait-text, tui-start, watch-dialogs], required: true, help: "doctor first; fix-alias and add change files; release-install installs from the GitHub release page; keep-awake/open-app/screen-text/keys/wait-text/tui-start/watch-dialogs drive the Mac's screen (macdrive.py)"}
    - {name: tag, flag: --tag, type: str, required: false, help: "release-install: vX.Y.Z or latest (default)"}
    - {name: launch, flag: --launch, type: flag, required: false, help: "release-install: then open the Desktop icon and fetch the screen"}
    - {name: plan, flag: --plan, type: flag, required: false, help: "release-install: print the script the Mac would run, run nothing"}
    - {name: apply, flag: --apply, type: flag, required: false, help: "fix-alias: write ~/.ssh/config (the old file is kept in Trash)"}
    - {name: save, flag: --save, type: flag, required: false, help: "find: record today's address"}
    - {name: json, flag: --json, type: flag, required: false, help: "info as JSON"}
  effects: [reads-files, writes-files, network]
  safety: changes
  output: own
  exits: {1: "a fault, or the Mac not found", 2: "refused (nothing to run, bad hardware address)"}
  platforms: [linux]
  platforms_why: 'finds the Mac with avahi-resolve and ip neigh (Linux); the Mac end needs only Remote Login (sshd), which macOS has had since 10.0'
  test: [python, -m, pytest, -q, -p, no:cacheprovider, "${FIELDKIT}/tests/test_macssh.py", "${FIELDKIT}/tests/test_macdrive.py", "${FIELDKIT}/tests/test_mac_releaseinstall.py"]
  notes: "release-install (2026-10-23, owner: behave like a new user, take the Mac program from the release page, old versions must not stay installed): older copies MOVED to ~/Agents.Work.Trash-linux/<product>-old-versions-<time>/ with a MANIFEST, download only from github.com/<repo>/releases/download/<tag>/, shasum -c, ditto, the release's own installer, version and single-copy check; --launch opens the Desktop icon and fetches the screen. First run by hand that day: v0.1.150 on the Air. Born 2026-10-22: the owner's MacBook Air 4,1 (macOS 10.13.6, out of Apple support) is the Gorilla Mac browser's test target, and the way to reach it lived only in handover notes, one of them wrong. Tests the connection every time; finds the Mac by mDNS name, else hardware address in the neighbour table, else after a ping sweep (all three proven live). Names, addresses and keys live in local/macs.json (git-ignored), never in code. 2026-10-23 watch-dialogs also recovers: a turn that ended in a provider error (Google HTTP 500 left a run idle for 40 minutes) gets 'continue' typed, at most --nudges times, then it stops and says so; a screen unchanged for --idle-seconds stops the watch with the reason. 2026-10-23 tui-start waits out a Google sign-in (it finishes alone when the browser is signed in; never typed into) and, if it never finishes, says a person must finish it. 2026-10-23 watch-dialogs: stays with a running Gorilla OpenCode and answers EVERY permission dialog with one key (allow, session or deny), logging the command and why it asked (JSON lines) and ending with the count, until a report file exists on the Mac; born when a test waited only for REPORT.txt while Gemini sat behind an unanswered dialog until the owner saw it. 2026-10-23 (macdrive.py): every step of driving the Air's screen by hand became a command: keep-awake (caffeinate, its own PID only), open-app (answers a choose-folder dialog, closes only the idle Terminal windows that appeared with it), screen-text (the tab's text by tty, no picture), keys (raise THAT tab after activate, paste as one line, exit 3 when the screen did not change; --expect refuses to type into an unidentified screen), wait-text, tui-start (Gorilla OpenCode's start-up screens walked by their text, the folder cursor moved to entry 1 before Enter, a key only on a known screen); each remote step retried on a Wi-Fi drop (the Air dropped 5 times in an hour). Born 2026-10-22: the owner's MacBook Air 4,1 (macOS 10.13.6, out of Apple support) is the Gorilla Mac browser's test target, and the way to reach it lived only in handover notes, one of them wrong. Tests the connection every time; finds the Mac by mDNS name, else hardware address in the neighbour table, else after a ping sweep (all three proven live). Names, addresses and keys live in local/macs.json (git-ignored), never in code."

- id: fieldkit-firmware-check
  title: A device plugged in that does not work because its firmware is missing (USB Wi-Fi sticks, network cards), built-in kernel drivers included
  harness: fieldkit
  entry: [python, -m, fieldkit, firmware, check]
  path: ${FIELDKIT}/fieldkit/firmware/fwcheck.py
  inputs:
    - {name: json, flag: --json, type: flag, required: false, help: "machine-readable"}
  effects: [reads-files]
  safety: read-only
  output: own
  exits: {3: findings}
  platforms: [linux]
  platforms_why: 'reads /sys, the kernel log and /lib/modules: a Linux kernel'
  test: [python, -m, pytest, -q, -p, no:cacheprovider, "${FIELDKIT}/tests/test_fwcheck.py"]
  notes: "Born 2026-10-22: the ALFA AWUS036NH (RT3070, rt2800usb built into the monolithic kernel) never came up, 'Direct firmware load for rt2870.bin failed' 22 times, and the stick reset off the bus between tries. Reads present USB/PCI devices, the firmware each driver declares (modules.builtin.modinfo for built-ins, modinfo for modules), /lib/firmware (plain, .xz, .zst), CONFIG_EXTRA_FIRMWARE and the kernel log; a failed load is a finding even when the device has just reset away; a driver that lists many files and loaded one is only noted. Names the fix (CONFIG_EXTRA_FIRMWARE for a built-in driver), changes nothing."

- id: fieldkit-leftovers
  title: Leftovers on a Linux desktop (removed-not-purged packages, duplicate or dead login launchers, VM helpers on real hardware, dead menu entries and user services), shown first, cleaned on request, undoable
  harness: fieldkit
  entry: [python, -m, fieldkit, leftovers]
  path: ${FIELDKIT}/fieldkit/leftovers/leftovers.py
  inputs:
    - {name: command, type: choice, choices: [scan, clean, restore, doctor], required: true, help: "scan is read-only; clean prints the plan unless --apply"}
    - {name: apply, flag: --apply, type: flag, required: false, help: "carry the plan out (clean, restore)"}
    - {name: json, flag: --json, type: flag, required: false, help: "scan as JSON"}
  effects: [reads-files, writes-files, deletes-files, admin, services]
  safety: changes
  output: own
  exits: {1: "clean or restore failed, or the login check did not pass", 2: "an id that is not a current finding", 3: findings}
  platforms: [linux]
  platforms_why: 'XDG autostart, desktop menu entries, systemd user units and dpkg exist only on a Linux desktop'
  test: [python, -m, pytest, -q, -p, no:cacheprovider, "${FIELDKIT}/tests/test_leftovers.py"]
  notes: "Born 2026-10-22 from a theme scrambled by a removed package's leftover launcher. Never stops a process, never edits a file an installed package owns (a user-level Hidden=true override instead), never touches the current session; copies everything into ~/Agents.Work.Trash/leftovers-<time>/ with a manifest before changing it; after --apply rescans and runs a login-safety check. Masks, TryExec self-hides, OnlyShowIn and DesktopNames are honoured."

- id: fieldkit-gtk-theme-check
