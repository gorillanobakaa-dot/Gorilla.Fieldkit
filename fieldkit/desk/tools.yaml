- id: gorilla-opencode-release-build
  title: Every Gorilla OpenCode release file in one run, on Linux or Windows - exe, Linux binary, tarball, .deb (through xzcheck), .rpm (nfpm where dpkg-deb is missing, compared with the last release's .deb), Mac 10.13 zip on go1.24, SHA256SUMS of exactly the published files and the page's measured file table; optionally from a clean clone of one commit and compared byte for byte with the published files
  harness: build
  entry: [python, -m, fieldkit, pipeline, run, gorilla-opencode]
