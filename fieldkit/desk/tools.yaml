# -- the cable link's own operations (fieldkit/peers/link_relay.py, link_ops.py; 2026-10-22 night, Linux side) ----
- id: mandate
  title: "A project mandate: the owner's ONE approval for a whole project, valid on both computers: keygen (passphrase-protected Ed25519), trust (the other computer pins the public key), approve (every door shown, typed yes, passphrase), verify, allows (allow/ask/deny with the clause), stop, share"
  harness: core
  entry: [python, -m, fieldkit, mandate]
  path: ${FIELDKIT}/fieldkit/mandate/mandate.py
  inputs:
    - {name: action, flag: null, type: str, required: true, choices: [keygen, trust, approve, verify, allows, stop, share, status, gate, doctor, install-hooks, renew], help: "status first; keygen, trust and approve are the owner's, at a real terminal"}
    - {name: rest, flag: null, type: str, required: false, help: "FILE.yaml; allows: FILE.yaml ACTION key=value ..."}
  effects: [writes-files, network]
  safety: reversible             # a seal is voided by any change, a stop, or the date; nothing outside ~/.fieldkit/mandate
  scope: [file]
  output: own
  exits: {1: "not approved / not trusted", 2: "bad input or no key", 3: "not in force (verify) or ask (allows)", 4: "deny"}
  platforms: [windows, linux, darwin]
  test: [python, -m, pytest, -q, "${FIELDKIT}/tests/test_mandate.py"]
  notes: "Owner, 2026-10-23: one approval per project, valid for both sessions, same SOPs. Plan local/PROJECT-MANDATE-PLAN.md. The seal is an Ed25519 signature over the mandate's sha256, made with the owner's passphrase-protected key; the other computer holds only the public key (verify, never sign) - the Windows side's review replaced the first idea (an HMAC with the cable key, which any key holder could mint). Fail closed: no seal, a changed byte, an untrusted key, a stop or the expiry date and nothing is allowed by the mandate. Callers (M3, 2026-10-23): ship push logs a mandated push; ship merge merges into main only when a mandate allows it, conditions proven by proofs.py, fast-forward or the pull request, the landed commit checked on origin; hard lines 1 and 4 open for a plain `fieldkit ship push` on a mandated branch, `fieldkit ship merge` while a mandate is in force, and owner_approvals entries (never the mandate key or GORILLA_OWNER_APPROVED), each logged; `fieldkit mac run` on a granted Mac is judged as the business of the Mac, and logged; while a mandate is in force raw installers are refused for `fieldkit mandate install GB WHAT -- CMD` (the larger of declared and measured disk growth is logged against budget_gb). M1.1 (the Windows review of ba40f28): every write under ~/.fieldkit/mandate is hard line 3 and keygen/trust/approve hard line 4; FIELDKIT_MANDATE_HOME counts only under pytest; a trusted key must match its file name; merge conditions and the push fast-forward are proven by the tool (fieldkit/mandate/proofs.py: the suite run, the other computer's [DONE] note re-verified with the link key, CI), so `allows` on the command line is a PREVIEW that takes no proofs; a stop is permanent for the mandate it stopped (its sha256 in stopped.txt); passphrase at least 12. M1.2 (the Windows review of a6feb1e: text-matched hard lines miss writes by indirection; the link key is shared; a commit could gut its own suite): owner keys, reviewer keys and stops live in an OS-guarded store (guarded.py: root-owned /etc/fieldkit/mandate-trust written through pkexec, sudo on macOS; Windows %ProgramData% with an Administrators-only ACL, the Windows side's part, fails closed until it lands; built 2026-10-23 on the owner's word: acl_verdict reads the DACL through Get-Acl, Administrators or SYSTEM as owner and no Allow write for the user, Users, Authenticated Users, Everyone or INTERACTIVE; the elevated script creates the folder with its ACL by SID before writing and goes through the elevate kit, one UAC Yes); a store this user can write counts for nothing; no FIELDKIT_MANDATE_HOME at all; each computer has its own Ed25519 review key and the merge proof is APPROVE <repo> <40-char sha> signed with the OTHER computer's pinned review key (sign-review / trust-reviewer); full_tests_pass_here also runs the suite on origin/main in a temporary worktree and needs no fewer passed, no more skipped, no deleted test file. Merge deadlock removed (2026-10-23, after the Windows session rightly refused to APPROVE another Claude's merge): nobody approves; `fieldkit mandate verdict REPO SHA --send` runs on the OTHER computer, started by its link listener on verb verdict-request (no session asked), only for repos and branches its owner listed in link.yaml allow_verdict (sha-pinned), one at a time, under verdict_minutes, without git or GitHub credentials, through fieldkit guard on Windows; it tests the pushed commit in a temporary worktree against main and signs APPROVE only on a pass; a commit that changes how its tests run (conftest.py, pytest settings, TestMain, the test command) gets NEEDS A PERSON. ship merge asks once and says to wait in one blocking call. Release door: release: {cycle: {project: [exact versions]}} opens hard line 1 for one plain `fieldkit release-cycle PROJECT run --var version=vX.Y.Z`; sign-review removed. Then the owner corrected the direction (plan section 16, same day): ONE orchestrator holds the mandate, the only approval; workers execute and report, concerns with a fix offered, never approve or object; 20 devices = 20 one-time setups, never 20 prompts a night. So: allow_verdict and APPROVE are gone; jobs.py carries job {id, kind test, repo, commit, mandate sha256} and result {id, status pass|fail|not-run, evidence, concerns[{text, fix_offered}], os, host, at, key, sig}; a worker accepts a job when a sealed mandate with that sha is in force there and names the repo, refusing only what it cannot do (with the fix); the result is Ed25519-signed by the worker for provenance; merge conditions other_machine_reviewed / tests_on:<system> read verified results; ask_when: [worker_concern] makes a concern stop the merge (the orchestrator decides); ship merge sends the job once and says `fieldkit mandate job wait ID`; `fieldkit mandate job send|status|wait`. Section 17 (owner: Yes for everything): `fieldkit mandate boss` lists the devices (this one and the paired one, from the link hello, which now carries device facts) and proposes a boss by a fixed rule, always on > memory > cable; the mandate names orchestrator (and backup) {device, key}, and a worker refuses a job from any other device; the project ledger is append-only (ledger.jsonl on the boss: job-sent, result, boss-resumed), `fieldkit mandate ledger` and `resume` (a restarted boss asks workers once to resend; a worker keeps undeliverable results in an outbox, verb resend flushes it); health.py checks temp space, the clock and origin (3 tries) before a job and keeps the device awake during it, problems travelling as concerns. Items 3, 5, 6 and the report (project.py): `fieldkit mandate tasks init|list|pass` (all failing at first, never removed, passing only with evidence, a needs: screenshot task only with a real PNG), `fieldkit mandate start` (ledger, mandate, link, the next thing), `fieldkit mandate report` (one page from the ledger; NEEDS YOU lists only ask events). quiet.py (2026-10-23, the owner: 'i am still getting called like a monkey ... 15 sessions ... approve this'): while a mandate is in force, a Stop hook sends back a turn that ends asking the owner, and a PreToolUse hook refuses AskUserQuestion, a next-step box question and [NEEDS YOU] notes; `fieldkit mandate ask` queues the question for the one report; `fieldkit mandate quiet --install` adds both hooks to ~/.claude/settings.json (a copy kept in the trash first)."

