  harness: build
  entry: [python, -m, fieldkit, build-harness, rewind]
  path: ${FIELDKIT}/fieldkit/buildh/task.py
  inputs:
    - {name: task, flag: null, type: str, required: true, help: "the build-harness task"}
    - {name: step, flag: null, type: str, required: true, help: "the step id to rewind to"}
  effects: [writes-files, deletes-files, git]
  safety: irreversible
  platforms: [windows, linux]
  test: [python, -m, pytest, -q, "${FIELDKIT}/tests/test_buildh_task.py", -k, rewind]
  notes: "git reset --hard + git clean -fd in the working copy: uncommitted files are deleted. Checkpoint commits survive in the reflog only. No owner_terminal() check."

