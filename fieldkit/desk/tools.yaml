# The tool registry: every tool Fieldkit knows, where it lives, on which system
# it runs, whether it changes things, and how it is tested. Agents read this
# (fieldkit tools list --json) instead of rediscovering tools.
#
# Your own tools go in local/tools.yaml (same format, git-ignored): they are
# merged in at load time and never published.
#
# path: ${DOCUMENTS} / ${FIELDKIT} are expanded per machine (core/settings.py).
# changes: true = the tool modifies files/system state; an agent must ask first.
# test: command that proves it works (null = no test yet - a gap, listed by `tools check`).
# repo: where the canonical copy lives when it is not on this machine.

tools:
# --- Fieldkit's own harnesses ------------------------------------------------
- id: office
  title: Read, create, check and scrub Word/Excel/PowerPoint/PDF offline
  harness: office
  entry: [python, -m, fieldkit, office]
  path: ${FIELDKIT}/fieldkit/office
  platforms: [windows, linux]
  changes: true
  test: [python, -m, pytest, -q, "${FIELDKIT}/tests/test_office.py"]

- id: sync
  title: Keep this machine's harness level with GitHub; take only fast-forwards CI proved on Windows and Linux
  harness: core
  entry: [python, -m, fieldkit, sync]
  path: ${FIELDKIT}/fieldkit/core/sync.py
  platforms: [windows, linux]
  changes: true
  test: [python, -m, pytest, -q, "${FIELDKIT}/tests/test_sync_and_platforms.py"]

- id: autopilot
  title: Unattended agent runs (Claude Code, Antigravity) with no approval prompts, held by hard lines and no credential
  harness: core
  entry: [python, -m, fieldkit, autopilot]
  path: ${FIELDKIT}/fieldkit/autopilot/run.py
  inputs:
    - {name: action, flag: null, type: str, required: true, choices: [on, off, status, stop, resume, claude, workspace, quiet, antigravity, login], help: "status first; claude PROMPT runs one headless run"}
    - {name: rest, flag: null, type: str, required: false, help: "stop: the reason; claude: the prompt; workspace: the folder"}
    - {name: cwd, flag: --cwd, type: str, required: false, help: "claude: the folder the run works in"}
    - {name: max_turns, flag: --max-turns, type: int, required: false, help: "claude: turn limit (40)"}
    - {name: hold, flag: --hold, type: int, required: false, help: "quiet: keep the apps stopped until this PID exits"}
    - {name: minutes, flag: --minutes, type: float, required: false, help: "quiet: keep the apps stopped this many minutes (or until the STOP file)"}
    - {name: restore, flag: --restore, type: bool, required: false, help: "quiet (Linux): start again the system services a run stopped"}
    - {name: apply, flag: --apply, type: bool, required: false, help: "quiet: stop them (without it: list only)"}
  platforms: [windows, linux]
  changes: true
  test: [python, -m, pytest, -q, "${FIELDKIT}/tests/test_autopilot_run.py", "${FIELDKIT}/tests/test_autopilot_hardlines.py"]

- id: runbook
  title: The harness runs a runbook's steps (logs, ETA, retries, STOP, inbox for owner steps); a model only fixes a failed step
  harness: core
  entry: [python, -m, fieldkit, runbook]
  path: ${FIELDKIT}/fieldkit/autopilot/runbook.py
  inputs:
    - {name: action, flag: null, type: str, required: true, choices: [run, status, start], help: "start = run in its own detached window"}
    - {name: file, flag: null, type: str, required: true, help: "the runbook .md with a runbook block"}
    - {name: no_fix, flag: --no-fix, type: bool, required: false, help: "never call a model on a failed step"}
  platforms: [windows, linux]
  changes: true
  test: [python, -m, pytest, -q, "${FIELDKIT}/tests/test_autopilot_runbook.py"]

- id: telemetry
  title: Telemetry off and cut out - a project's source scanned for telemetry SDKs, endpoints and collectors; this machine's toolchain opt-outs and firewall blocks checked
  harness: core
  entry: [python, -m, fieldkit, telemetry]
  path: ${FIELDKIT}/fieldkit/core/telemetry.py
  inputs:
    - {name: action, flag: null, type: str, required: true, choices: [scan, machine], help: "scan a project folder, or check this machine"}
    - {name: path, flag: null, type: str, required: false, help: "scan: the project folder (default .)"}
    - {name: fix, flag: --fix, type: str, required: false, help: "machine: write the script the owner runs elevated to close every open row"}
  effects: [reads-files, writes-files]
  safety: reversible
  notes: 'owner rule 2026-10-18: telemetry is excised from every project and blocked on the machine without asking; the build gate fails while a machine row is open; --fix only writes a script, the owner runs it (one UAC click)'
  platforms: [windows, linux]
  test: [python, -m, pytest, -q, "${FIELDKIT}/tests/test_core_telemetry.py"]

- id: toolrouter
  title: Tool router - a command that does by hand what a harness tool does (recursive file search, folder sizes, text search over a tree) is refused with the tool's command, for Claude Code and Antigravity
  harness: core
  entry: [python, -m, fieldkit.autopilot.toolrouter]
  path: ${FIELDKIT}/fieldkit/autopilot/toolrouter.py
  inputs:
    - {name: command, flag: null, type: str, required: false, help: "a command to judge; --hook reads a Claude Code PreToolUse call on stdin"}
  effects: [reads-files]
  safety: read-only
  notes: 'wired as a PreToolUse hook in ~/.claude/settings.json and in ~/.gemini/config/hooks/guard.py 1.5.0; an override needs "# toolrouter-ok: <why>" in the command'
  platforms: [windows, linux]
  test: [python, -m, pytest, -q, "${FIELDKIT}/tests/test_autopilot_toolrouter.py"]

- id: eta
  title: How long will it take - from a plan, past runs, live progress or a timed trial on the same disk; never a guess
  harness: core
  entry: [python, -m, fieldkit, eta]
  path: ${FIELDKIT}/fieldkit/core/eta.py
  inputs:
    - {name: action, flag: null, type: str, required: true, choices: [leakgate, build, history, delete, copy, record], help: "what to estimate"}
    - {name: args, flag: null, type: str, required: false, help: "leakgate RUN_DIR; build [build|package] [OBJDIR]; history [STEP]; delete PATH; copy SRC DEST_DIR; record STEP SECONDS"}
  effects: [reads-files, writes-files]
  safety: reversible
  notes: 'delete and copy time a trial on scratch files they create and remove in a .fieldkit-eta-trial folder on the measured disk; nothing else is touched'
  platforms: [windows, linux]
  test: [python, -m, pytest, -q, "${FIELDKIT}/tests/test_core_eta.py"]

- id: inbox
  title: The owner inbox - every approval an unattended run needs, collected for one sitting
  harness: core
  entry: [python, -m, fieldkit, inbox]
  path: ${FIELDKIT}/fieldkit/autopilot/inbox.py
  inputs:
    - {name: action, flag: null, type: str, required: false, choices: [list, show, add, done], help: "list (default)"}
    - {name: rest, flag: null, type: str, required: false, help: "show/done: N [note]; add: TITLE WHY [COMMAND]"}
    - {name: all, flag: --all, type: bool, required: false, help: "list: done items too"}
  platforms: [windows, linux]
  changes: true
  test: [python, -m, pytest, -q, "${FIELDKIT}/tests/test_autopilot_run.py"]

- id: publish
  title: Push and release only after the privacy checks and the owner's typed yes; never inside autopilot
  harness: core
  entry: [python, -m, fieldkit, publish]
  path: ${FIELDKIT}/fieldkit/autopilot/inbox.py
  platforms: [windows, linux]
  changes: true
  test: [python, -m, pytest, -q, "${FIELDKIT}/tests/test_autopilot_run.py"]

- id: pref-conflicts
  title: One pref, one value - no two definitions the Firefox patch set adds may disagree (also in set-proof and the build gate)
  harness: build
  entry: [python, -m, fieldkit, build-harness, pref-conflicts]
  path: ${FIELDKIT}/fieldkit/buildh/prefconflicts.py
  inputs:
    - {name: task, flag: null, type: str, required: true, help: "the build-harness task, e.g. firefox-158.0"}
  effects: [reads-files]
  safety: read-only
  platforms: [windows, linux]
  test: [python, -m, pytest, -q, "${FIELDKIT}/tests/test_buildh_prefconflicts.py"]

- id: platform-check
  title: Hold every tool card's platforms to its tests; a new single-system card needs a port or a reason
  harness: desk
  entry: [python, -m, fieldkit.desk.platformcheck]
  path: ${FIELDKIT}/fieldkit/desk/platformcheck.py
  platforms: [windows, linux]
  changes: false
  test: [python, -m, pytest, -q, "${FIELDKIT}/tests/test_sync_and_platforms.py"]

# Full agent cards: every field the agent interface uses, reviewed by hand.

- id: office-read
  title: Read a Word, Excel, PowerPoint or PDF file as plain text
  harness: office
  entry: [python, -m, fieldkit, office, read]
  path: ${FIELDKIT}/fieldkit/office/read.py
  inputs:
    - {name: file, flag: null, type: str, required: true, help: "the .docx .xlsx .pptx or .pdf file"}
  effects: [reads-files]
  safety: read-only
  platforms: [windows, linux]
  test: [python, -m, pytest, -q, "${FIELDKIT}/tests/test_office.py"]

- id: office-check
  title: Check an Office or PDF file is not broken before sending it
  harness: office
  entry: [python, -m, fieldkit, office, check]
  path: ${FIELDKIT}/fieldkit/office/check.py
  inputs:
    - {name: file, flag: null, type: str, required: true, help: "the .docx .xlsx .pptx or .pdf file"}
  effects: [reads-files]
  safety: read-only
  platforms: [windows, linux]
  test: [python, -m, pytest, -q, "${FIELDKIT}/tests/test_office.py"]

- id: office-scrub
  title: Remove people's names from the hidden properties of a Word, Excel or PowerPoint file
  harness: office
  entry: [python, -m, fieldkit, office, scrub]
  path: ${FIELDKIT}/fieldkit/office/scrub.py
  inputs:
    - {name: file, flag: null, type: str, required: true, help: "the .docx .xlsx or .pptx file"}
    - {name: term, flag: --term, type: list, required: false, help: "names or numbers to remove, besides the author fields"}
  effects: [writes-files]
  safety: reversible
  scope: [file]
  modes:
    preview: ["+", "--check"]
    verify:
      - {command: [python, -m, fieldkit, office, check, "{file}"]}
      - {command: [python, -m, fieldkit, office, scrub, "{file}", --check]}
  platforms: [windows, linux]
  test: [python, -m, pytest, -q, "${FIELDKIT}/tests/test_office.py"]

- id: office-deliver
  title: Make a Word, Excel, PowerPoint or PDF file safe to send (check, remove names, recheck, privacy scan)
  harness: office
  entry: [python, -m, fieldkit, office, deliver]
  path: ${FIELDKIT}/fieldkit/office/deliver.py
  inputs:
    - {name: file, flag: null, type: str, required: true, help: "the file to send, after its LAST save"}
  effects: [writes-files]
  safety: reversible
  scope: [file]
  modes:
    preview: [python, -m, fieldkit, office, scrub, "{file}", --check]
    verify:
      - {command: [python, -m, fieldkit, office, check, "{file}"]}
      - {command: [python, -m, fieldkit, office, scrub, "{file}", --check]}
      - {command: [python, -m, fieldkit, privacy, scan, "{file}"]}
  platforms: [windows, linux]
  test: [python, -m, pytest, -q, "${FIELDKIT}/tests/test_deliver.py"]

- id: pipeline
  title: Staged, resumable pipelines (Firefox on Windows, Debian kernel, Gorilla OpenCode and any Go app)
  harness: build
  entry: [python, -m, fieldkit, pipeline]
  path: ${FIELDKIT}/fieldkit/core/pipeline.py
  inputs: []                        # running one is the owner's: agents read the plan, and `next` says the step
  platforms: [windows, linux]
  changes: true
  test: [python, -m, pytest, -q, "${FIELDKIT}/tests/test_pipeline.py", "${FIELDKIT}/tests/test_kernel.py"]

- id: pipeline-plan
  title: "What a pipeline would do, fully resolved, and what changed since its last run (read-only)"
  harness: build
  entry: [python, -m, fieldkit, pipeline, plan]
  path: ${FIELDKIT}/fieldkit/core/pipeline.py
  inputs:
    - {name: name, flag: null, type: str, required: true, help: "the pipeline: debian-kernel, gorilla-opencode, go-app ..."}
    - {name: var, flag: --var, type: list, required: false, help: "k=v settings, e.g. src=PATH version=v1.2"}
  effects: [reads-files]
  safety: read-only
  output: own
  platforms: [windows, linux]
  test: [python, -m, pytest, -q, "${FIELDKIT}/tests/test_pipeline.py"]

- id: triage
  title: Name a build failure from its log (Firefox, kernel, Debian packaging)
  harness: build
  entry: [python, -m, fieldkit, triage]
  path: ${FIELDKIT}/fieldkit/build/triage.py
  inputs:
    - {name: log, flag: null, type: str, required: true, help: "the build or install log file"}
    - {name: set, flag: --set, type: str, required: false, help: "rule set",
       choices: [auto, firefox-windows, debian-kernel, debian-packaging]}
  effects: [reads-files]
  safety: read-only
  platforms: [windows, linux]
  test: [python, -m, pytest, -q, "${FIELDKIT}/tests/test_triage.py"]
  supersedes: firefox-triage

- id: privacy-scan
  title: Find secrets, personal paths, emails and private names before publishing
  harness: core
  entry: [python, -m, fieldkit, privacy, scan]
  path: ${FIELDKIT}/fieldkit/core/privacy.py
  inputs:
    - {name: paths, flag: null, type: list, required: true, help: "files or folders to scan"}
    - {name: git, flag: --git, type: flag, required: false, help: "only what git would publish"}
  effects: [reads-files]
  safety: read-only
  platforms: [windows, linux]
  test: [python, -m, pytest, -q, "${FIELDKIT}/tests/test_core.py"]

- id: update-check
  title: What on this machine is behind what was published, and the line that fixes it
  harness: core
  entry: [python, -m, fieldkit, update]
  path: ${FIELDKIT}/fieldkit/update/__init__.py
  inputs:
    - {name: only, flag: --only, type: string, required: false, help: "one source: apt, github or native"}
    - {name: apply, flag: --apply, type: flag, required: false, help: "do the steps that need no root, then read the artefact back"}
  effects: [reads-files, network]
  # read-only without --apply. With it, the only thing it can change is a
  # launcher symlink: anything needing root is printed and refused, because
  # typing sudo is the owner's decision and not a tool's.
  safety: reversible
  platforms: [linux]
  test: [python, -m, pytest, -q, "${FIELDKIT}/tests/test_update.py"]

- id: refcheck
  title: Which files named in a list (manifest), link or import do not exist
  harness: build
  entry: [python, -m, fieldkit, refcheck]
  path: ${FIELDKIT}/fieldkit/build/refcheck.py
  inputs:
    - {name: rule, flag: null, type: str, required: true, help: "what names the files",
       choices: [manifest, markdown, python, regex]}
    - {name: target, flag: null, type: str, required: true, help: "the list file, or the folder to scan"}
  effects: [reads-files]
  safety: read-only
  platforms: [windows, linux]
  test: [python, -m, pytest, -q, "${FIELDKIT}/tests/test_refcheck.py"]

- id: repro-compare
  title: Two builds of the same source compared byte for byte, and what differs named (inside archives) with its cause
  harness: build
  entry: [python, -m, fieldkit, repro, compare]
  path: ${FIELDKIT}/fieldkit/build/repro.py
  inputs:
    - {name: a, flag: null, type: str, required: true, help: "the first build: a file or a folder"}
    - {name: b, flag: null, type: str, required: true, help: "the second build, made elsewhere"}
  effects: [reads-files]
  safety: read-only
  platforms: [windows, linux]
  test: [python, -m, pytest, -q, "${FIELDKIT}/tests/test_repro.py"]

- id: snapshot-diff
  title: Show exactly what changed between two recorded snapshots
  harness: core
  entry: [python, -m, fieldkit, snapshot, diff]
  path: ${FIELDKIT}/fieldkit/core/snapshot.py
  inputs:
    - {name: before, flag: null, type: str, required: true, help: "snapshot name taken before"}
    - {name: after, flag: null, type: str, required: true, help: "snapshot name taken after"}
  effects: [reads-files]
  safety: read-only
  platforms: [windows, linux]
  test: [python, -m, pytest, -q, "${FIELDKIT}/tests/test_snapshot.py"]

- id: lifecycle
  title: Install, verify, (upgrade,) uninstall a program and report anything it left behind
  harness: build
  entry: [python, -m, fieldkit, lifecycle]
  path: ${FIELDKIT}/fieldkit/build/lifecycle.py
  inputs:
    - {name: spec, flag: null, type: str, required: true, help: "lifecycle spec (YAML): watch, install, upgrade, uninstall"}
    - {name: approve, flag: --approve, type: flag, required: true, help: "the owner's go-ahead"}
  effects: [installs-software, writes-files, deletes-files, admin]
  safety: irreversible
  platforms: [windows, linux]
  test: [python, -m, pytest, -q, "${FIELDKIT}/tests/test_lifecycle.py"]

- id: next-step
  title: The one next thing to do in a build pipeline (DO, BLOCKED, CANNOT HERE or DONE)
  harness: build
  entry: [python, -m, fieldkit, next]
  path: ${FIELDKIT}/fieldkit/core/next.py
  inputs:
    - {name: pipeline, flag: null, type: str, required: true, help: "pipeline name, e.g. debian-kernel"}
  effects: [reads-files]
  safety: read-only
  platforms: [windows, linux]
  test: [python, -m, pytest, -q, "${FIELDKIT}/tests/test_next.py"]

- id: release-check
  title: Prove a release - the published files are the tested ones and every claim in the notes is proven
  harness: build
  entry: [python, -m, fieldkit, release, check]
  path: ${FIELDKIT}/fieldkit/release.py
  inputs:
    - {name: spec, flag: null, type: str, required: true, help: "release spec YAML, e.g. releases/pfind-v2.2.0.yaml"}
  effects: [reads-files, network]
  safety: read-only
  platforms: [windows, linux]
  test: [python, -m, pytest, -q, "${FIELDKIT}/tests/test_release.py"]

- id: harvest-find
  title: Which of the owner's scripts does this job? Search every script by what it does
  harness: desk
  entry: [python, -m, fieldkit, harvest, --find]
  path: ${FIELDKIT}/fieldkit/harvest.py
  inputs:
    - {name: words, flag: null, type: list, required: true, help: "what the script should do, in plain words"}
  effects: [reads-files]
  safety: read-only
  platforms: [windows, linux]
  test: [python, -m, pytest, -q, "${FIELDKIT}/tests/test_harvest.py"]

- id: inventory
  title: Count code, tests, config and skills per project folder
  harness: core
  entry: [python, "${FIELDKIT}/inventory.py", local]
  path: ${FIELDKIT}/inventory.py
  inputs:
    - {name: dirs, flag: null, type: list, required: true, help: "the folders to count"}
    - {name: skip_src, flag: --skip-src, type: flag, required: false, help: "skip a top-level src/ (vendored code)"}
  effects: [reads-files]
  safety: read-only
  output: own
  platforms: [windows, linux]
  test: [python, -m, pytest, -q, "${FIELDKIT}/tests/test_core.py"]

# --- Gathered from GitHub into toolbox/ (fieldkit gather; see imports.yaml) ------

- id: pfind
  title: Hybrid local search in one Python file (name, content, meaning, snippet)
  harness: desk
  entry: [python, "${FIELDKIT}/toolbox/pfind/pfind.py", --json, --no-color]
  path: ${FIELDKIT}/toolbox/pfind/pfind.py
  repo: gorillanobakaa-dot/pfind
  inputs:
    - {name: query, flag: null, type: str, required: true, help: "what to find: a name, text, or a code line"}
    - {name: paths, flag: null, type: list, required: false, help: "folders to search (default: current folder)"}
    - {name: names, flag: --names, type: flag, required: false, help: "file names only"}
    - {name: content, flag: --content, type: flag, required: false, help: "file contents only"}
    - {name: exact, flag: -x, type: flag, required: false, help: "the query is an exact (multi-line) code snippet"}
    - {name: ext, flag: --ext, type: list, required: false, help: "only these extensions, e.g. py md"}
    - {name: limit, flag: --limit, type: int, required: false, help: "how many files to show (default 40)"}
  effects: [reads-files]
  safety: read-only
  platforms: [windows, linux]
  test: [python, -m, pytest, -q, -p, no:cacheprovider, "${FIELDKIT}/toolbox/pfind/tests"]

- id: leakgate-runs
  title: Every leak-gate run - verdict, build, size and every file that cites it; only uncited runs are free to remove
  harness: build
  entry: [python, -m, fieldkit, build-harness, leakgate-runs]
  path: ${FIELDKIT}/fieldkit/leakgate/runs.py
  inputs:
    - {name: task, flag: null, type: str, required: true, help: "the build-harness task, e.g. firefox-157.0-truth"}
  effects: [reads-files]
  safety: read-only
  platforms: [windows, linux]
  test: [python, -m, pytest, -q, -p, no:cacheprovider, "${FIELDKIT}/tests/test_leakgate_runs.py"]

# --- Gorilla Size Calculation (fieldkit size): sizes, never an improvised du/robocopy line (2026-10-16) ---------
- id: gorilla-size
  title: How big folders are and where the space went, biggest first (every core, read-only, links never followed)
  harness: desk
  entry: [python, -m, fieldkit, size, --json]
  path: ${FIELDKIT}/fieldkit/desk/size.py
  repo: gorillanobakaa-dot/gorilla-size
  inputs:
    - {name: paths, flag: null, type: list, required: false, help: "folders to measure (default: current folder)"}
    - {name: depth, flag: --depth, type: int, required: false, help: "levels of the tree (default 1)"}
    - {name: number, flag: --number, type: int, required: false, help: "entries per level (default 20)"}
    - {name: files, flag: --files, type: int, required: false, help: "also the N largest files anywhere"}
    - {name: disk, flag: --disk, type: flag, required: false, help: "size on disk instead of apparent size"}
    - {name: links, flag: --links, type: flag, required: false, help: "Windows: count hard-linked files once"}
  effects: [reads-files]
  safety: read-only
  platforms: [windows, linux]
  test: [python, -m, pytest, -q, -p, no:cacheprovider, "${FIELDKIT}/tests/test_desk_size.py"]

- id: gorilla-size-find
  title: Every file or folder matching name, extension, size or age - folder sizes included (fd cannot do that)
  harness: desk
  entry: [python, -m, fieldkit, size, find, --json]
  path: ${FIELDKIT}/fieldkit/desk/size.py
  repo: gorillanobakaa-dot/gorilla-size
  inputs:
    - {name: paths, flag: null, type: list, required: false, help: "where to look (default: current folder)"}
    - {name: name, flag: --name, type: str, required: false, help: "name pattern: *, ?, [a-z]"}
    - {name: ext, flag: --ext, type: str, required: false, help: "extensions, comma-separated: iso,zip"}
    - {name: min_size, flag: --min-size, type: str, required: false, help: "at least: 500M, 2G, 1.5T"}
    - {name: older, flag: --older, type: str, required: false, help: "not changed for: 30d, 1y"}
    - {name: type, flag: --type, type: str, required: false, help: "f files, d folders, l links"}
    - {name: number, flag: --number, type: int, required: false, help: "at most N results, biggest first"}
  effects: [reads-files]
  safety: read-only
  platforms: [windows, linux]
  test: [python, -m, pytest, -q, -p, no:cacheprovider, "${FIELDKIT}/tests/test_desk_size.py"]

- id: debian-kernel-project
  title: Kernel patches, audited config change-set, patch tooling, self-test (data for the debian-kernel pipeline)
  harness: build
  path: ${FIELDKIT}/toolbox/debian-kernel
  repo: gorillanobakaa-dot/debian-kernel
  platforms: [linux]
  changes: true
  test: [python, -m, pytest, -q, "${FIELDKIT}/tests/test_debian_kernel.py"]

- id: sensors-gorilla
  title: Terminal dashboard of every readable hardware sensor (Linux)
