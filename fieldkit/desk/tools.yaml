    - {name: lean, flag: --lean, type: flag, required: false, help: "only requirements.json lean: a small or old computer"}
    - {name: probe, flag: --probe, type: flag, required: false, help: "the machine and the way in, before anything is installed"}
    - {name: json, flag: --json, type: flag, required: false, help: "machine-readable"}
