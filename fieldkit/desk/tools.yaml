  test: [python, -m, pytest, -q, "${FIELDKIT}/tests/test_install_sh.py"]
  notes: "2026-10-23: a dropped download resumes where it stopped (curl -C -), stops when a try makes no progress or after 6 tries, starts once from zero when the server cannot resume, and checks the zip before unzipping (one clean re-download if damaged). Born 2026-10-23 on the 2011 MacBook Air (macOS 10.13, 4 GB), cleaned of Homebrew, Xcode and git to save memory: git clone could not work there. Zip 3.7 MB; lean install about 2 MB plus pip's own build tools."

