  platforms: [windows, linux, darwin]
  test: [python, -m, pytest, -q, "${FIELDKIT}/tests/test_scratch.py"]
  skill: skills/fieldkit-scratch/SKILL.md
  notes: "Owner decision 2026-10-26, verbatim: \"Defender exclusion folder for scratch. Go.\" (chosen over Dev Drive and a plain folder). Why: about a million test files through the Recycle Bin with Defender scanning took half an hour (\"imagine a petabyte\"), and two transfer test copies (956,000 files, 8.3 GB) could not go to the bin at all (paths over 259 characters inside it). DELIBERATE EXCEPTION TO THE RECYCLE RULE, inside the marked scratch root only: clean deletes permanently, never through the Recycle Bin, and only a direct child of the root that carries a valid marker (.fk-scratch.json: schema 1, job = folder name, root = this root) AND is the caller's (same owning session process, pid + creation time) or stale (owner gone AND older than stale_hours, default 24, AND not --keep) or named with --claim (owner gone, or kind link = transfer hand-over). Root and job must be real folders (no junction/symlink/reparse point); links inside a job are removed as links, never followed; \\\\?\\ long paths; read-only files made writable; parallel threads; marker re-read right before and deleted last; every delete one line in state/scratch/clean.jsonl. Unmarked folders: reported, never deleted. Wired in: the run guard (fieldkit/core/preflight.py STEPS: stale and unmarked reported, never a stop) and fieldkit hog check (a finding, no action); the cable receiver (peers link put-stream) lands each transfer in its own job link-<tid> (kind link, keep). The delete is the platform's standard method through fieldkit/core/longpath.py (card longpath): Windows DeleteFileW/RemoveDirectoryW on \\\\?\\ extended-length paths, what rmdir /s /q does (Microsoft Learn, Maximum Path Length Limitation); POSIX shutil.rmtree = openat/unlinkat, symlinks unlinked never followed, plus the rm --one-file-system check. The Defender exclusion is a security setting, never set by a session on its own: it is the machine prerequisite scratch-defender-exclusion of the mandate (fieldkit/mandate/owner-wide.prereqs.yaml, owner approves ONCE with fieldkit mandate renew --from; then fieldkit mandate start applies it, one UAC click the first time); the same script by hand: fieldkit scratch owner-script -> state/proposed/scratch-exclusion-2026-10-26/apply|verify|undo.ps1. The script: Add-MpPreference -ExclusionPath for the root only, no process or extension exclusions, verified, undo included. COST THE OWNER ACCEPTED: nothing inside the scratch root is scanned, so nothing is ever executed from there, and transfers verify their sha256. doctor reads the exclusion with Get-MpPreference (lists only for an administrator) else the owner script's proof state/scratch/exclusion.json. Measured 2026-10-26 on the ThinkPad (i7-1255U, NVMe), WITHOUT the Defender exclusion (not applied yet), fieldkit scratch bench --files 100000 --recycle, 100 folders x 1,000 files of 64 bytes: make 9.7-12.0 s; clean 4.4-4.5 s (two runs); single-thread shutil.rmtree on the same shape 8.6 s; fieldkit size recycle --whole-folder + apply its plan 12.3 s to MOVE them into the bin (emptying the bin is a second pass, not timed: the half-hour per million the owner saw). Re-measure with the exclusion applied: the same bench. Mutations: tests/scratch_mutations.yaml."

- id: longpath
  title: "Long paths by default for every tool that walks or deletes files - the extended-length form (Windows up to 32,767 characters), the platform's standard direct delete with links never followed, and the machine's long-path state (LongPathsEnabled, git core.longpaths)"
  harness: core
  entry: [python, -m, fieldkit.core.longpath]
  path: ${FIELDKIT}/fieldkit/core/longpath.py
  inputs:
    - {name: json, flag: --json, type: flag, required: false, help: "JSON rows"}
    - {name: probe, flag: --probe, type: str, required: false, help: "also build and delete a tree deeper than 260 characters in this folder"}
  effects: [reads-files]
  safety: read-only
  output: own
  exits: {1: "something to fix on this machine (the mandate's machine prerequisites fix it)"}
  platforms: [windows, linux, darwin]
  test: [python, -m, pytest, -q, "${FIELDKIT}/tests/test_longpath.py"]
  skill: skills/fieldkit-scratch/SKILL.md
  notes: "Owner 2026-10-26: \"dealing with long paths. This is ADMIN 101 ... the maximum windows, osx, and linux can allow by default\" and \"the cleaning protocol is be industry standard\". Limits: Windows 32,767 UTF-16 characters through \\\\?\\ (Microsoft Learn, Maximum Path Length Limitation, learn.microsoft.com/en-us/windows/win32/fileio/maximum-file-path-limitation), MAX_PATH 260 without it unless LongPathsEnabled=1 and a longPathAware manifest (python.exe has it), name 255, git core.longpaths; Linux PATH_MAX 4096 / NAME_MAX 255 (POSIX limits.h, linux/limits.h); macOS 1024 / 255 (sys/syslimits.h). remove_tree: Windows DeleteFileW/RemoveDirectoryW on \\\\?\\ paths (rmdir /s /q, robocopy /MIR from an empty folder), reparse points removed as themselves, read-only cleared, parallel per level, deepest first; POSIX shutil.rmtree (fd-based openat/unlinkat, avoids_symlink_attacks) after a --one-file-system check (a mount below refuses all). Never the Recycle Bin, which stays at MAX_PATH. Used by: fieldkit scratch, the cable receiver (peers link put-stream writes through extended paths). NOT yet used by: 50 other modules that walk or delete (Board follow-up); gorilla-size (Rust, its own repository) has its own walker. Machine fixes: the mandate's machine_prerequisites longpaths-enabled and git-longpaths (fieldkit mandate prereqs). Mutations: tests/scratch_mutations.yaml."

- id: mandate-prereqs
  title: "Machine prerequisites in the mandate, Android-permissions style - declared with what each changes and costs, each script pinned by sha256, approved ONCE on the approve/renew screen, applied by the harness at a session start (fieldkit mandate start), checked, undone by id"
  harness: core
  entry: [python, -m, fieldkit, mandate, prereqs]
  path: ${FIELDKIT}/fieldkit/mandate/machine.py
  inputs:
    - {name: action, flag: null, type: str, required: false, choices: [check, apply, undo], help: "LEAVE EMPTY for check (read-only). apply: the missing ones (administrator ones in ONE elevated run); undo ID"}
    - {name: force, flag: --force, type: flag, required: false, help: "apply: put the UAC prompt up even if it was up less than 12 h ago"}
  effects: [reads-files, writes-files, admin, registry]
  safety: reversible
  output: own
  exits: {2: "bad arguments or no such prerequisite", 3: "something missing, refused (sha256 changed) or no mandate in force"}
  platforms: [windows, linux, darwin]
  test: [python, -m, pytest, -q, "${FIELDKIT}/tests/test_mandate_machine.py"]
  skill: skills/fieldkit-scratch/SKILL.md
  notes: "Owner 2026-10-26: \"this click should go in AT THE BEGINING OF THE SESSION. into the mandate list of the preapprovals. Android does that in their apps.\" A mandate's machine_prerequisites: entries {id, os, admin, what, cost, script + sha256 + apply/undo args | command + undo_command, verify = a named read-only check (longpaths_enabled, git_longpaths, scratch_exclusion)}. Shown on the approve and renew screens (renew --from CHANGED.yaml marks new doors NEW). Applied only under a mandate IN FORCE; a script whose sha256 differs never runs (checked again inside the elevated process); user-level entries run as you; administrator entries share ONE elevated run through local/kits/Elevate (one UAC prompt: Windows lets no program answer its own prompt; the setting then persists, so it is asked once), at most every 12 h; the result is the read-only check afterwards, not the script's word. FIELDKIT_PREREQS=0 skips it at start. Proposal: fieldkit/mandate/owner-wide.prereqs.yaml (scratch-defender-exclusion, longpaths-enabled, git-longpaths). Mutations: tests/scratch_mutations.yaml."
