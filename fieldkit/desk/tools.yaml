# --- Gorilla Size Calculation (fieldkit size): sizes, never an improvised du/robocopy line (2026-10-16) ---------
- id: gorilla-size
  title: How big folders are and where the space went, biggest first (every core, read-only, links never followed)
  harness: desk
  entry: [python, -m, fieldkit, size, --json]
  path: ${FIELDKIT}/fieldkit/desk/size.py
  repo: gorillanobakaa-dot/gorilla-size
