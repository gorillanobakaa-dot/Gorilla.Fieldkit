  output: own
  exits: {3: "something is missing (each line says what and how)"}
  platforms: [windows, linux]
  platforms_why: 'standard library only, so it runs before Fieldkit is installed; --probe was proven on macOS 10.13 (the 2011 MacBook Air, 2026-10-23), a system the platform list does not name yet'
  test: [python, -m, pytest, -q, "${FIELDKIT}/tests/test_doctor.py"]
  notes: "2026-10-23: the first Mac. /usr/bin/git exists on a Mac with no git (it only asks for Apple's developer tools): counted as missing. /usr/bin/python there is Python 2 (its '(2, 7)' broke the version read). python.org's Python 3.13 sits in /usr/local/bin, off an ssh PATH: named by its full path. Lean set measured: the core commands run with PyYAML and psutil alone."

