    - {name: paths, flag: null, type: list, required: false, help: "folders to measure (default: current folder)"}
    - {name: depth, flag: --depth, type: int, required: false, help: "levels of the tree (default 1)"}
    - {name: number, flag: --number, type: int, required: false, help: "entries per level (default 20)"}
    - {name: files, flag: --files, type: int, required: false, help: "also the N largest files anywhere"}
    - {name: disk, flag: --disk, type: flag, required: false, help: "size on disk instead of apparent size"}
    - {name: links, flag: --links, type: flag, required: false, help: "Windows: count hard-linked files once"}
  effects: [reads-files]
  safety: read-only
  platforms: [windows, linux]
  exits: {3: "something failed, or was unreadable with --strict"}
  test: [python, -m, pytest, -q, -p, no:cacheprovider, "${FIELDKIT}/tests/test_desk_size.py"]

- id: gorilla-size-find
  title: Every file or folder matching name, extension, size or age - folder sizes included (fd cannot do that)
  harness: desk
  entry: [python, -m, fieldkit, size, find, --json]
  path: ${FIELDKIT}/fieldkit/desk/size.py
  repo: gorillanobakaa-dot/gorilla-size
  inputs:
    - {name: paths, flag: null, type: list, required: false, help: "where to look (default: current folder)"}
    - {name: name, flag: --name, type: str, required: false, help: "name pattern: *, ?, [a-z]"}
    - {name: ext, flag: --ext, type: str, required: false, help: "extensions, comma-separated: iso,zip"}
    - {name: min_size, flag: --min-size, type: str, required: false, help: "at least: 500M, 2G, 1.5T"}
    - {name: older, flag: --older, type: str, required: false, help: "not changed for: 30d, 1y"}
    - {name: type, flag: --type, type: str, required: false, help: "f files, d folders, l links"}
    - {name: number, flag: --number, type: int, required: false, help: "at most N results, biggest first"}
  effects: [reads-files]
  safety: read-only
  platforms: [windows, linux]
  exits: {3: "something failed, or was unreadable with --strict"}
  test: [python, -m, pytest, -q, -p, no:cacheprovider, "${FIELDKIT}/tests/test_desk_size.py"]

# gorilla-size 0.3.0 modes: one card each (2026-10-18). Same binary as gorilla-size above, through `fieldkit size`.
# Exit codes for every one: 0 done (nothing found), 2 bad usage or a missing PATH, 3 found / failed, 4 held for a
# plan (move, recycle, find actions above --plan-files/--plan-bytes). With --json an error is {"error","exit"}.
# The behavior is tested in the gorilla-size repository (cargo test: tests/cli.rs, v02.rs, v03.rs); the test named
# here proves the Fieldkit wrapper passes arguments and exit codes through.

- id: gorilla-size-types
