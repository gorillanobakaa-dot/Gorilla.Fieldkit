- id: parity
  title: "Test parity - every machine runs the same pinned versions with the same capabilities before a test: a deterministic manifest per machine (versions + sha256 of gorilla-opencode, gorilla-size, python, go, git, gh, node; Fieldkit commit + dirty; installed skills, cards, Gorilla OpenCode provider NAMES, MCP servers, mandates in force, long paths; OS/arch), compared over the household link (SAME / PARTIAL / DRIFT, each difference named, an absent device reported, never a failure), aligned to releases/parity-pin.yaml from the release itself (asset + SHA256SUMS + GitHub digest, old binary kept, Linux/macOS get the root line), and the run guard's shared-ground check"
  harness: core
  entry: [python, -m, fieldkit, parity]
  path: ${FIELDKIT}/fieldkit/parity.py
  inputs:
    - {name: action, flag: null, type: str, required: true, choices: [manifest, compare, align, preflight, doctor], help: "manifest [--hash] | compare [--peer NAME | --with FILE] | align [--version vX] [--apply] [--rollback] | preflight [--kind test|bench|measure] | doctor"}
    - {name: json, flag: --json, type: flag, required: false, help: "manifest/compare/align: JSON"}
  effects: [reads-files, writes-files, network, processes]
  safety: reversible
  output: own
  exits: {0: "SAME / ALONE / aligned / done / preflight ok / doctor ok", 1: "PARTIAL (a peer on an older Fieldkit) / align TODO (the root line for that machine) / preflight warn / doctor problem", 2: "preflight stop (bench or measure on drift, shared ground, a foreign model, a machine not quiet)", 3: "DRIFT, a named device absent, or align/rollback failed"}
  platforms: [windows, linux, darwin]
  test: [python, -m, pytest, -q, "${FIELDKIT}/tests/test_parity.py"]
  skill: skills/fieldkit-methods/SKILL.md
  notes: "Owner 2026-10-26: 'update the binaries on both computers ... run it from the same version ... same capabilities ... deterministic checks ... before you start a test, the tests will not be impacted by different sessions that can skew the results'. Measured that day: Windows v0.1.152, VAIO v0.1.151, release v0.1.154; a go.exe of another session pinned a core during a test. Network: align --apply only (gh release view + download of ONE asset and SHA256SUMS from the pinned repo); compare uses the household link (signed, read-only verb `manifest`, outside JOB_VERBS like hello). Never updates in the background, never runs sudo. The run guard (core/preflight.py STEPS) calls preflight_check on every guarded run: WARN for tests and builds, STOP for kinds bench and measure; it sets FIELDKIT_PARITY_MANIFEST and testcost writes the hash into every result row. Mutations: tests/parity_mutations.yaml."
