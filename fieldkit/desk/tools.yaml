  effects: [reads-files]
  safety: read-only
  output: own
  exits: {3: findings}
  platforms: [linux]
  platforms_why: 'GTK user stylesheets (~/.config/gtk-*/gtk.css) and the libadwaita/GTK libraries it reads exist only on a Linux desktop'
  test: [python, -m, pytest, -q, -p, no:cacheprovider, "${FIELDKIT}/tests/test_gtktheme.py"]
  notes: "Reads the unfocused-window (:backdrop) rules embedded in libadwaita, GTK4 and GTK3 on THIS machine and checks ~/.config/gtk-*/gtk.css against them; lists GTK programs started before the stylesheet was written; runs /usr/bin/black-gorilla-theme into a throwaway HOME to compare. Born 2026-10-20. Since 2026-10-22 also: a stylesheet scrambled by two writers (theme block twice, or BEGIN/END not paired) and duplicate login launchers starting the same program (leftover autostart files of removed, dpkg-state rc, packages)."

