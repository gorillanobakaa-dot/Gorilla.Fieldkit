- id: gpudecode
  title: "Prove a browser decodes video on the GPU's video engine (Windows; an old Mac over SSH from Linux: mac-ab, mac-verdict): doctor (GPUs, drivers, the no-driver trap, which methods work), engines (engine number -> type; WPA node = engine + 1), live (built-in counters, no admin), trace (wpr, one UAC prompt) + export (wpaexporter) + verdict (VideoDecode packets per process, steady rate), adk plan/install (Windows Performance Toolkit only, Microsoft-signed, CEIP off)"
  harness: desk
  entry: [python, -I, "${FIELDKIT}/kits/gpudecode/gpudecode.py"]
  path: ${FIELDKIT}/kits/gpudecode/gpudecode.py
  inputs:
    - {name: command, flag: null, type: str, required: true, help: "doctor [--json] | engines [--save F] | live [--seconds N] [--process P] | trace [--seconds N] [--out DIR] --yes | export ETL [--out DIR] | verdict CSV --engines F [--process P] | adk plan | adk install --yes | explain | mac-ab MAC [--seconds N] [--app PATH] [--out DIR] | mac-verdict DIR"}
  effects: [reads-files, writes-files, processes, admin, network]   # admin: trace and adk install (one UAC prompt each); network: adk install only, and mac-ab's SSH to a Mac on the local network
  safety: reversible
  platforms: [windows, linux]
  platforms_why: "Windows: wpr/ETW, the GPU Engine counters and the Windows Performance Toolkit exist only there. Linux: only mac-ab/mac-verdict, which drive an old Mac over SSH (ssh, scp, ffmpeg here; vmmap, open, /usr/bin/python 2.7 on the Mac); Linux's own GPU has intel_gpu_top, not built here"
  test: [python, -m, pytest, -q, "${FIELDKIT}/tests/test_gpudecode.py", -p, "no:cacheprovider"]
  notes: "Evidence from Microsoft's own tools: wpr.exe (ships with Windows) records the kernel graphics scheduler's work packets; wpaexporter.exe (Windows Performance Toolkit, Windows ADK) exports them, one CSV row per packet, through kits/gpudecode/gpu-packets.wpaProfile. Hardware decoding = the browser's packets on a VideoDecode engine at about the video's frame rate (measured 2026-10-22, Gorilla on Iris Xe: 16,803 packets, steady 60/s on a 60 fps clip). Traces are ~40 MB per requested second (30 s = 1.2 GB) and record ALL GPU work on the machine: keep them local. NEVER tracerpt a trace to XML (30 s -> 43+ GB). trace refuses while another wpr session runs and never cancels it. Old Intel (HD 4000 and older): drivers are pre-WDDM 2.0, so live has no counters - use trace; they hardware-decode H.264 only. Procedure: skill fieldkit-gpudecode. macOS (2026-10-25, gpudecode_mac.py, run from Linux): an A/B with one build and a fresh test profile, hardware decoding on then off; after each 30 s of a 1080p60 H.264 clip (its own page reports getVideoPlaybackQuality), vmmap shows which browser process maps Apple's decoder driver (AppleIntelSNBVA, AppleIntelHD3000GraphicsVADriver, AppleGVA; VideoToolbox alone is the API, everywhere). Measured on the MacBook Air 4,1 (10.13.6, HD 3000), Gorilla 158 for the Air, three times: on 16, 4 and 21 of 1,800 frames dropped with the driver in the rdd process; off 1,476 of 1,482, 1,490 of 1,497, 1,505 of 1,511 dropped, driver in no process. vmmap suspends the process it reads: run during playback it dropped 618 of 1,800 frames, so it runs after. Per frame with DTrace when sudo -n /usr/sbin/dtrace works (2026-10-25): 20 s of the kernel's Gen6DVDContext::process_idct_command_buffer (the GPU's H.264 IDCT) against VideoToolbox frames in rdd: on 1,213 for 1,213 (60.6/s), off 0 for 999 (VideoToolbox decodes in software then). The SSH-started browser window does not show on the Mac's screen."

- id: wintrace
  title: "Inspect your own Windows computer for intrusion, read-only, with Windows' own APIs (the Linux reflexes Windows lacks): ss (sockets + process + signer + hosted services; flags network-reachable listeners whose binary is not validly signed), fuser (who holds a file open, Restart Manager), modules (every DLL/EXE/.node mapped into a process and its signer), svc (services in a process), whodraws (windows in Z order; which windows of other processes lie over a process's window or sit at a point; no screenshots), opensnoop (files opened per process for N <= 120 s: Kernel-File ETW via logman, tracerpt to CSV, one UAC click), doctor"
  harness: desk
  entry: [python, -I, "${FIELDKIT}/kits/wintrace/wintrace.py"]
  path: ${FIELDKIT}/kits/wintrace/wintrace.py
  inputs:
    - {name: command, flag: null, type: str, required: true, help: "ss [--listen] [--pid P] | fuser PATH... | modules PID [--all] | svc PID | whodraws [--over PID|NAME | --at X Y] | opensnoop --seconds N [--pid P] [--match RE] [--keep] --yes | doctor; every command takes --json"}
  effects: [reads-files, processes, admin]   # admin: opensnoop only (one UAC prompt through local/kits/Elevate); it writes and then deletes only its own temporary trace folder
  safety: reversible   # inspection only; the one thing it creates (opensnoop's temporary trace folder) it removes
  platforms: [windows]
  platforms_why: "Authenticode, the Restart Manager, EnumWindows/DWM, Win32_Service and ETW (logman/tracerpt) exist only on Windows; Linux already has ss -tulnp, fuser, /proc/PID/maps, xdotool/xprop and opensnoop-bpf"
  test: [python, -m, pytest, -q, "${FIELDKIT}/tests/test_wintrace.py", -p, "no:cacheprovider"]
  notes: "Defensive, inspection only: nothing is sent anywhere and nothing is stopped, killed, disabled or changed (fuser calls RmGetList, never RmShutdown). Each command ends with VERDICT and NEXT; exit 3 = a finding (unsigned code, an exposed unsigned listener, a window of another process over the target, a trace that recorded nothing, a holder list Windows would not give). whodraws uses the compositor's visible frame (DWMWA_EXTENDED_FRAME_BOUNDS) and counts overlaps of 32x32 px or more; smaller ones are listed as slivers. modules treats any mapped file starting with MZ as code, whatever its extension. opensnoop: the trace stops at 512 MB, is converted to CSV (never XML: a large trace once grew to 43 GB), and its folder is a plain mkdir under %TEMP% (mkdtemp's 0o700 made the elevated files unreadable, measured 2026-10-22). Measured 2026-10-22 during the 'quit and reopen Claude' banner: no window of another process over Claude's window; 157 code modules (plus 13 resource PE files), all validly signed. Recipe: 'inspect a suspicious window or process on Windows'."

- id: linkcheck
  title: "A direct cable between two computers: setup (a private address, no gateway, no DNS; idempotent, read back), serve (the other end: TCP sink/source + UDP echo bound to one address, one allowed peer, idle stop), check PEER (speed, duplex, Energy Efficient Ethernet, RTT p50/p99/jitter/loss, TCP throughput both ways with its own sender, path MTU; one LINK line), status, doctor; Windows + Linux, standard library"
  harness: desk
  entry: [python, -I, "${FIELDKIT}/kits/linkcheck/linkcheck.py"]
  path: ${FIELDKIT}/kits/linkcheck/linkcheck.py
  inputs:
    - {name: command, flag: null, type: str, required: true, help: "setup --ip A/P --iface NAME [--undo] | serve --bind A [--allow PEER] [--idle S] [--once] | check PEER [--count N] [--seconds S] | status [PEER] [--iface NAME] | doctor"}
    - {name: peer, flag: null, type: str, required: false, help: "check/status: the other end's cable address"}
    - {name: ip, flag: --ip, type: str, required: false, help: "setup: this end's private address with prefix, e.g. 10.77.0.1/30"}
    - {name: iface, flag: --iface, type: str, required: false, help: "the cable's card (Windows 'Ethernet'; Linux enp0s25)"}
    - {name: bind, flag: --bind, type: str, required: false, help: "serve: this end's cable address (never 0.0.0.0)"}
    - {name: allow, flag: --allow, type: str, required: false, help: "serve: the only peer answered"}
    - {name: json, flag: --json, type: bool, required: false, help: "check/status: machine output"}
  effects: [reads-files, writes-files, network, admin]   # network: the cable only; admin: setup only (one UAC prompt via the elevate kit / pkexec)
  safety: reversible
  platforms: [windows, linux]
  test: [python, -m, pytest, -q, "${FIELDKIT}/tests/test_linkcheck.py", -p, "no:cacheprovider"]
  notes: "Built for two machines sharing one goal over a direct cable (state/proposed/long-horizon-2026-10-22/DESIGN-MULTI-MACHINE.md, step A). No iperf3: its own sender/receiver (6 Gbit/s on loopback on an i7-1255U, so Python is not the limit at 1 Gbit/s). RTT is application level (both stacks) from UDP echoes, one outstanding. A Wi-Fi card is not failed for half duplex and its PHY rate is not judged as capacity. setup never adds a gateway or DNS and refuses a public address; undo only removes what it set. serve is a foreground process, never a service: it binds one address, answers one peer, echoes only its own 12-byte packets, stops when idle. Results kept as JSON in state/linkcheck (LINKCHECK_RESULTS). Admin on Windows through local/kits/Elevate (LINKCHECK_ELEVATE); without it, setup writes the script and says to run it elevated."

