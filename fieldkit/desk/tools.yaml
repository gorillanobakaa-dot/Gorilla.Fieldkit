  path: ${FIELDKIT}/fieldkit/desk/size.py
  repo: gorillanobakaa-dot/gorilla-size
  inputs:
    - {name: paths, flag: null, type: list, required: false, help: "folders to measure (default: current folder)"}
    - {name: exclude, flag: --exclude, type: str, required: false, help: "skip (gitignore syntax; repeatable)"}
    - {name: gitignore, flag: --gitignore, type: flag, required: false, help: "skip what .gitignore files ignore"}
  effects: [reads-files]
  safety: read-only
  platforms: [windows, linux]
  test: [python, -m, pytest, -q, -p, no:cacheprovider, "${FIELDKIT}/tests/test_desk_size.py"]

- id: gorilla-size-age
  title: Files by age, newest or oldest first - what changed during the build
