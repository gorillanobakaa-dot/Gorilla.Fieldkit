  harness: academic
  entry: [python, -m, fieldkit, academic, types]
  path: ${FIELDKIT}/fieldkit/academic/cli.py
  inputs:
    - {name: type, flag: null, type: str, required: false, help: "a type, e.g. report, essay, care-plan"}
