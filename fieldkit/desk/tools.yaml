- id: peers-link-heal
  title: "Why a device of the household does not answer, rung by rung with evidence (this computer's cable address, its own listener, ARP/ip neigh, ping count/loss/rtt, TCP to the link port telling REFUSED / TIMEOUT / UNREACHABLE apart, the signed hello, link.log and the peer's logs through its rescue door), one VERDICT naming the broken layer and NEXT; --revive tries each DECLARED path (rescue door, key-only ssh with a forced command, Wake-on-LAN on the cable) and else puts ONE inbox item naming the machine and the exact command"
  harness: peers
  entry: [python, -m, fieldkit, peers, link, heal]
  path: ${FIELDKIT}/fieldkit/peers/link_heal.py
  inputs:
    - {name: rest, flag: null, type: str, required: false, help: "declare NAME rescue,ssh,wol | ssh-line PUBKEYFILE FROM_IP (the peer's authorized_keys line)"}
    - {name: device, flag: --device, type: str, required: false, help: "which device (default: the household default)"}
    - {name: revive, flag: --revive, type: bool, required: false, help: "after the ladder, the declared revive paths, then the ladder again"}
    - {name: mac, flag: --mac, type: str, required: false, help: "declare: the device's MAC for Wake-on-LAN"}
    - {name: ssh-user, flag: --ssh-user, type: str, required: false, help: "declare: the user of the key-only ssh door"}
    - {name: ssh-key, flag: --ssh-key, type: str, required: false, help: "declare: the private key file for it"}
    - {name: json, flag: --json, type: bool, required: false, help: "machine-readable rows, facts, layer, next"}
  effects: [network, processes, writes-files]   # ping, arp/ip neigh, TCP connects, one signed hello and rescue call; --revive: one restart request, a WoL packet, an inbox item, a link.log line; declare writes household.json
  safety: reversible             # the ladder is read-only; a revive restarts a listener or wakes a machine, nothing else
  output: third-party            # hello and rescue answers come from the other computer
  platforms: [windows, linux]
  platforms_why: 'run live on Windows 2026-10-26: during the incident the ladder said REFUSED on 47077 with ping 3/3 and ARP 02-00-5e-10-00-01 (listener down, host up), and found this end deaf too; after both listeners came back every rung was OK. --revive and the rescue door were run only offline (the VAIO does not run the door yet)'
  test: [python, -m, pytest, -q, "${FIELDKIT}/tests/test_peers_link_heal.py"]
  notes: "THREAT MODEL. No new door is opened by heal itself. Its revive paths, each used ONLY when the device declares it (heal declare): rescue = the peer's rescue door (peers-link-rescue); ssh = key-only (BatchMode, PasswordAuthentication=no, StrictHostKeyChecking=yes, bound to the cable source address) to an authorized_keys line made by heal ssh-line: restrict, from=<the cable address>, command=systemctl --user restart fieldkit-link.service - whoever holds that private key can restart the listener from the cable address and do nothing else; wol = a magic packet to the cable's /30 broadcast from the cable address, never the LAN. Every revive and every failure is a link.log line; nothing works -> one inbox item (kind link) with the machine, its address and MAC, what was tried and the command for a person. Exit 0 answers, 3 does not, 2 bad usage. orchestrate devices --check prints the heal line under every device that does not answer. Mutation plan tests/peers_link_heal_mutations.yaml."

- id: peers-link-rescue
  title: "The rescue door: a second, tiny listener on the cable address only (link port + 1, 47078) that answers devices the household marks cable, signed with the household key, with two verbs only - rescue-status (listening? keep-alive? the last lines of watchdog.log, serve.log, link.log and the user journal of the two units) and rescue-restart (the listener, through the service manager) - every request in rescue.log"
  harness: peers
  entry: [python, -m, fieldkit, peers, link, rescue]
  path: ${FIELDKIT}/fieldkit/peers/link_rescue.py
  inputs:
    - {name: action, flag: null, type: str, required: true, choices: [serve, status, restart], help: "serve: run the door (the systemd unit does); status / restart: ask the peer's door"}
    - {name: device, flag: --device, type: str, required: false, help: "which device"}
  effects: [network, processes, reads-files]
  safety: reversible             # restarts a listener; reads log tails
  output: third-party
  platforms: [windows, linux]
  platforms_why: 'loopback end to end in the tests on Windows; it is meant to run on Linux peers under systemd (fieldkit-link-rescue.service); not yet run on the VAIO'
  test: [python, -m, pytest, -q, "${FIELDKIT}/tests/test_peers_link_heal.py"]
  notes: "THREAT MODEL: a second door, so justified here. WHO can act through it: whoever holds link.key (the same people who can already use the link, start sessions where allowed and send files); WHAT they can do: read the last 40 lines of three logs and the units' journal (metadata the link already logs: host names, addresses, note numbers, file names and sizes, job ids; never note bodies), and restart the listener. No shell, no file, no argument is executed. WHERE: bound to the cable address(es) only; refuses any source that is not a cable device of the household; the Linux firewall rule (mandate prerequisite link-rescue-firewall) opens 47078 from the one cable peer to the one cable address only. LOGGED: rescue.log, every request, refused or answered. CLOSE IT: systemctl --user disable --now fieldkit-link-rescue.service."

- id: peers-link-keepalive
  title: "Keep the cable listener alive without a person: Linux systemd user units (fieldkit-link.service + fieldkit-link-rescue.service, Restart=always, RestartSec=5, no start limit) + loginctl enable-linger + the watchdog timer (KillMode=process, restarts through systemctl); Windows a scheduled task at logon and every 5 minutes (IgnoreNew, RestartCount 999, not elevated); status says what is missing, peers link doctor shows both ends"
  harness: peers
  entry: [python, -m, fieldkit, peers, link, keepalive]
  path: ${FIELDKIT}/fieldkit/peers/link_keepalive.py
  inputs:
    - {name: action, flag: null, type: str, required: false, choices: [status, install, units], help: "status (default) | install (Linux) | units DIR (write the Linux units only, for review)"}
  effects: [processes, writes-files]   # systemctl --user, loginctl, schtasks /Query; install writes ~/.config/systemd/user units
  safety: reversible             # undo: systemctl --user disable --now ...; the Windows task: fieldkit mandate prereqs undo link-keepalive-windows
  output: own
