# HARNESS-PLAN I5 follow-up (owner order 2026-10-29): no device or session starts an expensive model without a
# deterministic yes. Data first: change a tier here, not in the code. Names match as lower-case substrings.
# An unknown model name is premium (fail closed). Premium is refused everywhere unless an owner-signed mandate
# in force carries `models_allowed: [names]` (its `expires:` is the expiry; fieldkit mandate approve signs it).
default: sonnet                  # a headless launch that names no model gets this one
cheap: [sonnet, haiku, local, qwen, gemma, llama]
review: [opus]                   # the reviewer role only (roles.yaml reviewer.model)
premium: [fable, mythos, carbon, argon, gpt, gemini, o1, o3, grok]
ledger: model-spend.jsonl        # in the lifecycle state folder (state/lifecycle/)
# Plan P9, escalation ladder (owner idea I-06). Every attempt records the model that made it; a red the branch owns
# (strikes.whose_red) is an own failure; `own_limit` own failures on one rung climb to the next rung (the same model
# retries once in between). Stepping onto a rung that is not cheap still passes check_model (mandate / reviewer role).
# The ladder replaces the flat two-strikes park (ON since 2026-11-11): park only when the top rung the spend guard
# allows has failed (Fable without a mandate is skipped, the top is then Opus).
escalation:
  enabled: true                   # owner order 2026-11-11: climb before parking
  ladder: [haiku, sonnet, opus, fable]
  own_limit: 2
  attempts: escalation.jsonl      # in the lifecycle state folder
  risky: [guard, hook, fan, security, release, mandate]   # job-type words that get a top-model plan review first
  review_model: opus
# P9 (owner, 2026-11-11: a month's budget can be gone): a model that cannot answer is skipped by every choice (task
# routing, ladder climb, reviewer, tie-breaker) and the harness works with what is left. A call that ends in a
# budget / limit / quota / rate error, no verdict, or "max turns" marks the model UNAVAILABLE in the lifecycle state
# folder (availability.json) until the limit's own reset time, else a cooldown. The owner can also pin it here:
#   unavailable: {fable: "until 2026-12-01"}     (a date, or "always" until the line is removed)
availability:
  unavailable: {}
  file: availability.json         # in the lifecycle state folder
  cooldown_minutes: 120           # a budget / limit / quota / rate error with no reset time in the message
  no_verdict_cooldown_minutes: 30 # an answer with no verdict, or "max turns": likely out of budget, look again soon
  patterns: ['usage limit', 'limit reached', 'limit will reset', 'out of (extra )?usage', 'quota', 'rate.?limit',
             'budget', 'credit balance', 'overloaded', 'too many requests', 'insufficient', '\b429\b', 'max turns']
