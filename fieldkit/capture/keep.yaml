# P40 (owner 2026-11-16): what a clean slate never touches. Same list on Windows and Linux; paths are matched as
# case-insensitive substrings of the full path with / as separator. Credential files are never opened, only kept.
keep:
  - /.git/                 # every checkout and worktree metadata
  - /.hg/
  - /.svn/
  - /fieldkit/             # the Fieldkit checkout
  - /local/                # the owner's own tools, sources and tests
  - /capture/
  - /capture-archive/
  - /transcripts/
  - /sessions/
  - /archived_sessions/
  - /session-index/
  - /chats/
  - /checkpoints/
  - /transcript.jsonl/
  - /toolchains/
  - /.cargo/
  - /.rustup/
  - /.nvm/
  - /.venv/
  - /.ssh/
  - /.gnupg/
  - /.aws/
  - /.config/gh/
  - /.netrc/
  - /.npmrc/
  - /.pypirc/
  - /.git-credentials/
  - .pem/
  - .pfx/
  - .key/
  - .db/
  - .sqlite/
  - .db-wal/
  - .db-shm/
  - credentials
  - secret
  - .env
  - id_rsa
  - id_ed25519
  - auth
  - token

protected_roots:
  - ~/.codex/tmp           # Codex launcher runtime, including arg0 and arg0-windows
  - ~/.codex/.tmp          # Codex plugin staging and marketplace state
  - ~/.codex/plugins       # Codex installed plugin state
  - ~/.codex/worktrees     # Codex managed project checkouts
  - ~/.codex/sessions     # original Codex transcripts
  - ~/Documents/Scripts

# P40 scope (owner 2026-11-16, final): the clean slate covers ONLY these folders, where agents put the scripts they write
# on the fly. Never Documents/Scripts, user files or repos. Each entry is one folder (a * matches in the last part; ~, %VAR%
# and $VAR are expanded; a folder missing on this computer is skipped). Its immediate children are the items counted,
# digested and recycled; the folder itself stays. Shared OS temp roots select only the named test directories.
scratch_roots:
  - ~/.cache/fieldkit-scratch          # Linux scratch root (fieldkit scratch)
  - C:/fk-scratch                      # Windows scratch root
  - /tmp/claude-*                      # Claude Code temp and scratchpad dirs, Linux
  - ~/AppData/Local/Temp/claude        # Claude Code temp, Windows
  - ~/AppData/Local/Temp/claude-*
  - ~/.gemini/tmp
  - ~/.gemini/antigravity/scratch
  - ~/.local/share/gorilla-opencode/tmp          # OpenCode work dirs, Linux
  - ~/AppData/Local/gorilla-opencode/tmp          # OpenCode work dirs, Windows

# The default Crew data home only. Relocated roots may contain operator-owned directories.
kiro_crew_root: ~/.kiro/crew/scratch

# Gorilla OpenCode's internal/llm/tools/main_test.go calls os.MkdirTemp("", "opencode-tools-test").
# Only direct child directories with Go's decimal suffix qualify.
temp_item_roots:
  linux: {path: /tmp, pattern: 'opencode-tools-test[0-9]+'}
  win32: {path: ~/AppData/Local/Temp, pattern: 'opencode-tools-test[0-9]+'}

# Age here is file modification time. An old file is never proof of session closure.
session_sources:
  - {agent: claude, home: ~/.claude, env: CLAUDE_CONFIG_DIR, sub: projects, match: '*/*.jsonl', policy: 'standalone sessions; require a completed final response and quiescence', adapter: claude}
  - {agent: claude, home: ~/.claude, env: CLAUDE_CONFIG_DIR, sub: projects, match: '*/*/subagents/*.jsonl', policy: 'linked subagent history; group closure unverified'}
  - {agent: claude, home: ~/.claude, env: CLAUDE_CONFIG_DIR, sub: '', match: history.jsonl, policy: 'mixed session history'}
  - {agent: codex, home: ~/.codex, env: CODEX_HOME, sub: sessions, match: '**/rollout-*.jsonl*', policy: 'regular sessions require native shutdown evidence and quiescence', adapter: codex}
  - {agent: codex, home: ~/.codex, env: CODEX_HOME, sub: archived_sessions, match: 'rollout-*.jsonl*', policy: 'native archive; require a completed final turn and quiescence', adapter: codex}
  - {agent: codex, home: ~/.codex, env: CODEX_HOME, sub: '', match: '*history.jsonl', policy: 'mixed session history'}
  - {agent: codex, home: ~/.codex, env: CODEX_HOME, sub: '', match: 'session_index.jsonl', policy: 'shared live index'}
  - {agent: codex, home: ~/.codex, env: CODEX_HOME, sub: '', match: 'state_*.sqlite*', policy: 'shared live database and sidecars'}
  - {agent: gemini, home: ~/.gemini, home_parent_env: GEMINI_CLI_HOME, sub: tmp, match: '*/chats/session-*.json', policy: 'standalone JSON sessions; require a completed final response and quiescence', adapter: gemini}
  - {agent: gemini, home: ~/.gemini, home_parent_env: GEMINI_CLI_HOME, sub: tmp, match: '*/chats/session-*.jsonl', policy: 'append-only revisions require a separate closure adapter'}
  - {agent: gemini, home: ~/.gemini, home_parent_env: GEMINI_CLI_HOME, sub: tmp, match: '*/checkpoints/*.json', policy: 'workspace checkpoints, closure unverified'}
  - {agent: antigravity, home: ~/.gemini/antigravity, sub: conversations, match: '*', policy: 'opaque conversation store'}
  - {agent: antigravity, home: ~/.gemini/antigravity, sub: brain, match: '*/.system_generated/logs/transcript.jsonl', policy: 'native transcript, closure unverified'}
  - {agent: agy, home: ~/.gemini/antigravity-cli, sub: conversations, match: '*', policy: 'opaque CLI conversation store'}
  - {agent: agy, home: ~/.gemini/antigravity-cli, sub: brain, match: '*/.system_generated/logs/transcript.jsonl', policy: 'native CLI transcript, closure unverified'}
  - {agent: kiro-cli, home: ~/.kiro, env: KIRO_HOME, sub: '', match: '*.db*', policy: 'shared live database and sidecars'}
  - {agent: kiro-cli, home: ~/.kiro, env: KIRO_HOME, sub: '', match: '*.sqlite*', policy: 'shared live database and sidecars'}
  - {agent: kiro-cli, home: ~/.kiro, env: KIRO_HOME, sub: sessions, match: '*/sess_*/messages.jsonl', policy: 'V3 original messages; require completed turns, quiescence and no session lock', adapter: kiro-cli}
  - {agent: kiro-cli, home: ~/.kiro, env: KIRO_HOME, sub: sessions, match: 'cli/*', policy: 'legacy session store, closure unverified'}
  - {agent: kiro-cli, home: ~/.kiro, env: KIRO_HOME, sub: sessions, match: '*/sess_*/session.json', policy: 'V3 session descriptors stay with the native store'}
  - {agent: kiro-cli, home: ~/.kiro, env: KIRO_HOME, sub: session-index, match: '**/*', policy: 'native session index, closure unverified'}
  - {agent: kiro-crew, home: ~/.kiro, env: KIRO_HOME, sub: crew/sessions, match: '**/*', policy: 'native session store, closure unverified'}
  - {agent: gorilla-opencode, home: ~/.local/share/gorilla-opencode, env: FIELDKIT_OPENCODE_DATA_DIR, xdg: gorilla-opencode, sub: '', match: 'gorilla-opencode.db*', policy: 'shared live database; set FIELDKIT_OPENCODE_DATA_DIR if data.directory overrides the default'}
  - {agent: opencode, home: ~/.local/share/opencode, xdg: opencode, file_env: OPENCODE_DB, sub: '', match: 'opencode*.db*', policy: 'shared database with credential storage and sidecars'}
  - {agent: opencode, home: ~/.local/share/opencode, xdg: opencode, sub: storage, match: '**/*.json', policy: 'legacy storage, closure unverified'}
