# Proof that each check can fail (fieldkit mutate): break one rule, tests/capture must fail.
#   python -m fieldkit mutate --plan fieldkit/capture/mutations.yaml -- python -m pytest -q -x tests/capture
- {file: fieldkit/capture/store.py, swap: ['    return _SECRET_ARG.sub(lambda m: m.group(1) + REDACTED, s)', '    return s'], why: "arguments like --password X are redacted"}
- {file: fieldkit/capture/store.py, swap: ['iid = st["by_hash"].get(chash)', 'iid = None'], why: "same content is counted, not stored twice"}
- {file: fieldkit/capture/store.py, swap: ['if not data or data.endswith(b"\n"):', 'if True:'], why: "a torn tail is healed and kept"}
- {file: fieldkit/capture/store.py, swap: ['if e.get("hash") != entry_hash(e.get("prev", ""), e):', 'if False:'], why: "an altered entry breaks verify"}
- {file: fieldkit/capture/store.py, swap: ['if a[0] == b[0]:', 'if a[0] == "\0":'], why: "a failure links to a related success"}
- {file: fieldkit/capture/store.py, swap: ['if res is None:', 'if res is not None:'], why: "an orphan event is recovered"}
- {file: fieldkit/capture/store.py, swap: ['if state in DONE_STATES and not s.get("evidence"):', 'if False:'], why: "a done state needs evidence"}
- {file: fieldkit/capture/store.py, swap: ['if state not in STATES:', 'if False:'], why: "only the five states exist"}
- {file: fieldkit/capture/store.py, swap: ['self.set_state(iid, "raw", error=f"{type(exc).__name__}: {exc}")', 'pass'], why: "a failed step requeues the item"}
- {file: fieldkit/capture/store.py, swap: ['if isinstance(v, dict) and "blob" in v and not (self.blobs / v["blob"]).is_file():', 'if False:'], why: "a missing blob is lost"}
- {file: fieldkit/capture/store.py, swap: ['_SECRET_KEY.search(str(k))', 'False'], why: "secret-named keys are redacted"}
- {file: fieldkit/capture/hook.py, swap: ['if tk is None:', 'if False:'], why: "only work tools are captured"}
- {file: fieldkit/capture/hook.py, swap: ['m = re.match(r"\s*Exit code (-?\d+)", text)', 'm = None'], why: "exit code read from a failure message"}
- {file: fieldkit/capture/scan.py, swap: ['    cut = data.rfind(b"\n") + 1', '    cut = len(data)'], why: "a half-written transcript line waits for the next scan"}
- {file: fieldkit/capture/scan.py, swap: ['        if key in self.seen:', '        if False:'], why: "the seen log stops double counting"}
- {file: fieldkit/capture/scan.py, swap: ['if len(segs) >= 2:', 'if len(segs) >= 9:'], why: "a command sequence is recognised"}
- {file: fieldkit/capture/roots.py, swap: ['    add("system-temp", tmp)', '    pass'], why: "the system temp folder is a root"}
- {file: fieldkit/capture/roots.py, swap: ['    return bool(_SECRET_NAME.search(name or ""))', '    return False'], why: "credential-like files are never opened"}
