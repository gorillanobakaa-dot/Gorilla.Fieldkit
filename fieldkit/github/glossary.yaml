# Words a first-time GitHub user meets. Shown, two plain sentences each, the first time a word appears in a screen.
terms:
  repository: "A repository is the folder of your project plus its whole history, kept on GitHub. People say repo for short."
  branch: "A branch is a separate line of work inside the repository, so you can try something without touching the main version. Merging brings it back."
  main: "Main is the branch that holds the official, finished version of the project. Most settings here protect it."
  commit: "A commit is one saved step in the history, with a message saying what changed. You can always go back to an earlier commit."
  push: "Pushing sends your commits from this computer up to GitHub. Nothing on GitHub changes until you push."
  pull request: "A pull request asks to merge one branch into another, and shows the change for review first. It is where checks run and people comment."
  merge: "Merging joins the changes of one branch into another, usually a pull request into main. After a merge the work is part of main."
  CI: "CI (continuous integration) is a robot that runs your tests on GitHub every time you push. It tells you in minutes whether a change broke something."
  check: "A check is one named job of the CI robot, such as a test run, that ends green (passed) or red (failed). A required check must be green before a merge."
  ruleset: "A ruleset is a list of rules GitHub enforces on chosen branches, for example no deleting main or no merging without green checks. It lives under Settings, then Rules, then Rulesets."
  auto-merge: "Auto-merge merges a pull request by itself as soon as every required check is green and every required approval is given. With no required checks it would merge at once."
  fork: "A fork is your own copy of someone else's repository on GitHub. People use it to propose changes to a project they do not own."
  token: "A token is a secret password-like string that lets a program act as you on GitHub. Never paste one into a chat, a file or a command; this tool never asks for one."
  secret scanning: "Secret scanning looks through your code for passwords and keys that were saved by mistake. Push protection stops a push that contains one."
  push protection: "Push protection refuses a push that contains a password or key, before it reaches GitHub. Once a secret is public you must treat it as stolen."
  force push: "A force push overwrites history on GitHub with your version. Done to main, it can destroy other people's work, so it is usually blocked."
  Dependabot: "Dependabot is GitHub's helper that watches the libraries you use. Alerts only tell you about a known flaw; version updates open pull requests by themselves."
  admin: "Admin is the highest permission on a repository. Only an admin can change the settings this tool changes."
  snapshot: "A snapshot is a file this tool writes before it changes anything, holding the old settings. The undo command reads it to put everything back."
  CODEOWNERS: "A CODEOWNERS file names who must review changes to which files. GitHub then asks those people automatically."
  linear history: "Linear history means main has no merge bubbles: every change is one straight line of commits. It is easier to read and to undo."
