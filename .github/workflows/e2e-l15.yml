# Plan P37 (owner 2026-11-12: "AMATEUR HOUR"): a feature is done on an OS only after it RAN end to end there. The L15's
# half of the v0.10.0 e2e batch (the VAIO's jobs are in e2e.yml): one job per (tool, OS) that runs the REAL entry point
# on a GitHub runner, safe paths only (status, check, dry-run, a refused or empty input); a card names its job in `e2e:`
# (fieldkit integration check, row 5-e2e). The ship-batch jobs read this repository's open PRs through gh (read only).
name: e2e-l15
on:
  workflow_call:
    inputs:
      selected:
        required: true
        type: string
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
  checks: read
  actions: read
concurrency:                 # C3: a new push to a pull request cancels its old run; main, tags and schedules queue
  group: e2e-l15-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  snapshot:                    # the run's ONE read of GitHub for the ship-batch jobs (fieldkit/method/train.py FIELDKIT_GH_SNAPSHOT)
    name: snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - name: GitHub API budget (start)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/ci_rate.py start
      - name: record the open-PR reads once
        continue-on-error: true      # a failed snapshot only means the jobs read GitHub live
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FIELDKIT_GH_SNAPSHOT: ${{ runner.temp }}/gh-snapshot
        run: |
          python .github/e2e/ship_batch_collect.py
          python .github/e2e/ship_batch_select.py
      - uses: actions/upload-artifact@v4
        with:
          name: gh-snapshot
          path: ${{ runner.temp }}/gh-snapshot
          if-no-files-found: ignore
          retention-days: 1
      - name: GitHub API budget (end)
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/ci_rate.py end
  e2e-installer-test-linux:
    if: github.event_name == 'workflow_dispatch' || contains(fromJSON(inputs.selected), '*') || contains(fromJSON(inputs.selected), 'e2e-installer-test-linux')
    name: e2e-installer-test-linux
    runs-on: ubuntu-latest
