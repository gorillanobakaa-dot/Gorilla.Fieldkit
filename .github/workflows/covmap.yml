name: covmap
# C4.1: a nightly run of the whole suite under coverage with one context per test, written as the map
# test -> files -> lines (fieldkit ci covmap). Non-gating: nothing reads it as a gate until the C4.4 replay shows 0 misses.
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  map:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - name: Run the suite with one coverage context per test (pytest-cov, xdist)
        shell: bash
        run: |
          printf '[run]
source = fieldkit,.github
branch = False
' > .covmap.rc
          python -m pytest -q -p no:cacheprovider --timeout=300 -n 3 --cov --cov-config=.covmap.rc --cov-context=test || echo "suite-red: map still written from what ran"
      - name: Build the map
        shell: bash
        run: python -m fieldkit ci covmap build .coverage covmap.json --root .
      - uses: actions/upload-artifact@v4
        with:
          name: ci-covmap-${{ runner.os }}
          path: covmap.json
          retention-days: 14
