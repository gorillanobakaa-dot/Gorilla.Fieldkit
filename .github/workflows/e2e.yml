# Plan P37 (owner 2026-11-12: "AMATEUR HOUR"): a feature is done on an OS only after it RAN end to end there. One job per
# (tool, OS) that runs the REAL entry point on a GitHub runner; a card names its job in `e2e:` (fieldkit integration
# check, row 5-e2e). Runs on pull requests that touch the code it proves, and by hand.
name: e2e
on:
  workflow_call:
    inputs:
      selected:
        required: true
        type: string
  workflow_dispatch:
jobs:
  e2e-zero-hooks-linux:
    if: github.event_name == 'workflow_dispatch' || contains(fromJSON(inputs.selected), '*') || contains(fromJSON(inputs.selected), 'e2e-zero-hooks-linux')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - run: python .github/e2e/zero_hooks.py
  e2e-zero-hooks-windows:
    if: github.event_name == 'workflow_dispatch' || contains(fromJSON(inputs.selected), '*') || contains(fromJSON(inputs.selected), 'e2e-zero-hooks-windows')
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - run: python .github/e2e/zero_hooks.py
  e2e-capture-clean-linux:
    if: github.event_name == 'workflow_dispatch' || contains(fromJSON(inputs.selected), '*') || contains(fromJSON(inputs.selected), 'e2e-capture-clean-linux')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - run: python -m fieldkit compileonce build
      - run: python -m fieldkit compileonce check
      - run: python .github/e2e/capture_footprint.py
  e2e-capture-clean-windows:
    if: github.event_name == 'workflow_dispatch' || contains(fromJSON(inputs.selected), '*') || contains(fromJSON(inputs.selected), 'e2e-capture-clean-windows')
    runs-on: windows-latest
