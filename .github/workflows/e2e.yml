# Plan P37 (owner 2026-11-12: "AMATEUR HOUR"): a feature is done on an OS only after it RAN end to end there. One job per
# (tool, OS) that runs the REAL entry point on a GitHub runner; a card names its job in `e2e:` (fieldkit integration
# check, row 5-e2e). Runs on pull requests that touch the code it proves, and by hand.
name: e2e
on:
  pull_request:
    paths:
      - "fieldkit/leakgate/**"
      - "fieldkit/integration/**"
      - "fieldkit/lifecycle/pool*"
      - "fieldkit/lifecycle/choice*"
      - "fieldkit/core/prepare*"
      - "fieldkit/once.py"
      - ".github/e2e/**"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:
jobs:
  e2e-leakgate-linux:
    # the gate's Linux enforcement layer: selftest, then a network namespace whose nftables policy DROP lets the allowed
    # port through and blocks every other one. ubuntu-latest has passwordless sudo.
    name: e2e-leakgate-linux
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]" mitmproxy
      - name: tools the gate needs (ip, nft, dnsmasq, tcpdump, strace, ss)
        run: sudo apt-get install -y --no-install-recommends nftables dnsmasq-base tcpdump strace iproute2 || true
      - name: the gate's own selftest, as root
        run: sudo -E env "PATH=$PATH" python -m fieldkit build-harness leakgate-selftest
      - name: allowed connection passes, forbidden one is blocked, in the gate's real namespace
        run: sudo -E env "PATH=$PATH" python .github/e2e/leakgate_linux.py
  e2e-pool-linux:
    # fieldkit pool plan: the real entry point, a session list in, ordered app-tool calls out.
    name: e2e-pool-linux
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - run: python .github/e2e/pool_plan.py
  e2e-pool-windows:
    name: e2e-pool-windows
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - run: python .github/e2e/pool_plan.py
  e2e-once-linux:
    # fieldkit once: the real entry point; a success skipped, a changed input re-run, a repeated watcher line says stop.
    name: e2e-once-linux
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - run: python .github/e2e/once.py
  e2e-once-windows:
    # fieldkit once: the real entry point; a success skipped, a changed input re-run, a repeated watcher line says stop.
    name: e2e-once-windows
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - run: python .github/e2e/once.py
  e2e-antigravity-linux:
    name: e2e-antigravity-linux
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - run: python .github/e2e/antigravity_bridge.py
  e2e-antigravity-windows:
    name: e2e-antigravity-windows
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - run: python .github/e2e/antigravity_bridge.py
  e2e-models-choice-linux:
    name: e2e-models-choice-linux
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - run: python .github/e2e/models_choice.py
  e2e-models-choice-windows:
    name: e2e-models-choice-windows
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - run: python .github/e2e/models_choice.py
  e2e-agy-tools-linux:
    # fieldkit antigravity (the Rust agy-tools): cargo test, the release build from source, the real entry points.
    name: e2e-agy-tools-linux
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - run: cargo test --release --offline --locked
        working-directory: rust/agy-tools
      - run: cargo build --release --offline --locked
        working-directory: rust/agy-tools
      - run: python .github/e2e/agy_tools.py
      - run: python -m pytest -q -p no:cacheprovider tests/test_antigravity.py
  e2e-agy-tools-windows:
    # fieldkit antigravity (the Rust agy-tools): cargo test, the release build from source, the real entry points.
    name: e2e-agy-tools-windows
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - run: cargo test --release --offline --locked
        working-directory: rust/agy-tools
      - run: cargo build --release --offline --locked
        working-directory: rust/agy-tools
      - run: python .github/e2e/agy_tools.py
      - run: python -m pytest -q -p no:cacheprovider tests/test_antigravity.py
  e2e-prepare-linux:
    # fieldkit prepare: the real entry point, READY for a job whose tools are there, NOT-READY (exit 3) for a missing one.
    name: e2e-prepare-linux
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - run: python .github/e2e/prepare_gate.py
  e2e-prepare-windows:
    # fieldkit prepare: the real entry point, READY for a job whose tools are there, NOT-READY (exit 3) for a missing one.
    name: e2e-prepare-windows
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - run: python .github/e2e/prepare_gate.py
  e2e-firefox-cookbook-linux:
    # P38: a toy Firefox through the whole cookbook chain (seams 1-7, handover, each OS's apply step), then the real
    # entry point prints the release chain.
    name: e2e-firefox-cookbook-linux
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q -p no:cacheprovider tests/test_firefox_cookbook_e2e.py
      - run: python -m fieldkit firefox release 1.0
  e2e-firefox-cookbook-windows:
    # P38: a toy Firefox through the whole cookbook chain (seams 1-7, handover, each OS's apply step), then the real
    # entry point prints the release chain.
    name: e2e-firefox-cookbook-windows
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q -p no:cacheprovider tests/test_firefox_cookbook_e2e.py
      - run: python -m fieldkit firefox release 1.0
  e2e-cookbook-load-linux:
    # P41a: the registry is valid and the real entry point loads a brief by cwd and by id.
    name: e2e-cookbook-load-linux
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - run: python -m fieldkit cookbook check
      - run: python -m fieldkit cookbook load fieldkit --no-state
  e2e-cookbook-load-windows:
    # P41a: the registry is valid and the real entry point loads a brief by cwd and by id.
    name: e2e-cookbook-load-windows
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - run: python -m fieldkit cookbook check
      - run: python -m fieldkit cookbook load fieldkit --no-state
  e2e-cmd-check-linux:
    # P9: the real entry point judges a command against the live argparse tree.
    name: e2e-cmd-check-linux
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - run: python .github/e2e/cmd_check.py
  e2e-cmd-check-windows:
    name: e2e-cmd-check-windows
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - run: python .github/e2e/cmd_check.py
