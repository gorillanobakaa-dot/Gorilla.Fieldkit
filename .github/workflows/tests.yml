# Tests once (R7 in docs/HARNESS-PLAN.md; owner, 2026-10-28): a pull request and a push to main run only the tests
# covering the change, on Windows and on Linux, so "runs on both" is still proven by a machine that is not the
# author's. The whole suite runs once, when a project is finished: run this workflow by hand (Run workflow; and
# every release runs it, release.yml). Other branch pushes run nothing here: their pull request does.
name: tests
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - name: desktop-file-validate for fieldkit install verify (a desktop Linux has it; the runner does not)
        if: runner.os == 'Linux'
        # P9 (2026-11-11, PR 461): the runner's DNS failed 3 times here ("Temporary failure resolving
        # 'archive.ubuntu.com'", exit 100). apt retries each fetch; update + install is tried again with backoff
        # (30 s, 60 s, 120 s, 240 s: about 7.5 min). If the network never comes back the step still fails.
        shell: bash
        run: |
          for wait in 30 60 120 240 0; do
            sudo apt-get -o Acquire::Retries=5 update &&
              sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends desktop-file-utils && exit 0
            [ "$wait" = 0 ] && break
            echo "apt failed; trying again in ${wait}s"; sleep "$wait"
          done
          exit 1
      - name: every tracked file has covering tests (else CI would run the whole suite for it)
        run: python -m fieldkit testcost unmapped --all
      - name: integration check (docs/INTEGRATION.md) - a capability the change adds must be built in
        if: github.event_name == 'pull_request'
        run: python -m fieldkit integration check --repo . --changed "origin/${{ github.base_ref }}"
      - name: the tests covering the change
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            base="${{ github.event.before }}"
            merged="--merged"
          else
            base="full"
          fi
          python .github/ci_tests.py "$base" $merged
