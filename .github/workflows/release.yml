# Prepare the source release candidate after Windows and Linux tests. The checked page travels with the
# candidate. The mandate-controlled `fieldkit ship gh-release` command promotes it after verification.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  TAG: ${{ github.ref_name }}
jobs:
  proof:
    runs-on: ubuntu-latest
    outputs:
      windows: ${{ steps.prior.outputs.windows }}
      linux: ${{ steps.prior.outputs.linux }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: prior
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/release_test_proof.py
  test:
    needs: proof
    strategy:
      fail-fast: true
      matrix:
        include:
          - {os: windows-latest, proof: windows}
          - {os: ubuntu-latest, proof: linux}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        if: needs.proof.outputs[matrix.proof] != 'true'
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@v5
        if: needs.proof.outputs[matrix.proof] != 'true'
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
        if: needs.proof.outputs[matrix.proof] != 'true'
      - name: OS parity inventory and generated documentation
        if: needs.proof.outputs[matrix.proof] != 'true'
        run: python -m fieldkit parity os --check
      # 2026-11-10: v0.9.0 never published: tests.yml installs this, release.yml did not, so 3 installverify tests failed
      - name: desktop-file-validate for fieldkit install verify (a desktop Linux has it; the runner does not)
        if: runner.os == 'Linux' && needs.proof.outputs[matrix.proof] != 'true'
        # P9 (2026-11-11): Ubuntu's archive DNS was down for hours while pip worked. The package is pinned in
        # the repo (.github/vendor, sha256 checked; a wrong hash fails); apt only if dpkg cannot install it.
        timeout-minutes: 8
        shell: bash
        run: bash .github/desktop-file-utils.sh
      - run: python .github/ci_tests.py full
        if: needs.proof.outputs[matrix.proof] != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          FIELDKIT_REUSE_CI: '1'
  candidate:
    needs: test
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: the tag names the package's version
        run: |
          v=$(python -c "import fieldkit; print(fieldkit.__version__)")
          test "v$v" = "$TAG" || { echo "tag $TAG, package $v: not published"; exit 1; }
      - name: the release page carries both tracks in full
        run: |
          d="releases/notes/$TAG"
          python -m fieldkit release-page check "$d/page.md" --layman "$d/layman.md" --developer "$d/developer.md"
      - name: Assemble the checked source candidate
        run: |
          mkdir candidate
          cp "releases/notes/$TAG/page.md" candidate/page.md
          jq -n --arg version "${TAG#v}" --arg title "Fieldkit $TAG" --argjson run "$GITHUB_RUN_ID" \
            '{version: $version, title: $title, notes: "page.md", assets: [], runs: {}, source_run: $run}' > candidate/candidate.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate
          path: candidate/
          if-no-files-found: error
