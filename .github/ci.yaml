# CI plan config (C2 in CI-SPEED-PLAN.md): the runner count follows the work. Read by `fieldkit ci plan`.
# Same selection + same durations + this file = the same plan. Edit numbers here, never in the workflow.
target_seconds: 180          # one shard should take about this long (owner decision O-CI2, fallback 180)
setup_seconds:               # job start to first test, per OS (measured by C1; refine when C7 records it)
  windows: 40
  linux: 20
budget:                      # most runners one run may take per OS (must fit slots.projects.fieldkit below)
  windows: 16
  linux: 16
slots:                       # C3: GitHub counts jobs at once across the whole account, so projects share a fixed budget
  account_limit: 40          # O-CI1 fallback: Pro plan (verify once in Settings > Billing)
  reserve: 4                 # kept free for small jobs
  projects:                  # slots per OS; the sum with the reserve must stay within account_limit
    fieldkit: {windows: 16, linux: 16}
    rest: {windows: 2, linux: 2}   # Gorilla.Opencode, Firefox, Kernel: on demand (16+16+2+2+4 reserve = 40)
degraded_file_seconds: 10    # a file with no recorded duration weighs this much when no durations exist yet
max_spread: 1.25             # check: heaviest shard / lightest shard, once more than one shard runs
keep_together: []            # files that must not share a shard split with others (reserved for C2 test-level split)
hang:                        # C6: one test may run factor x p90 of the recorded file times, clamped; no durations = default
  factor: 10
  floor: 120                 # seconds
  cap: 900
  default: 300
selection_gate: import       # C4.4: import (today's rule) | coverage | union (both). Stays import until `fieldkit ciaudit replay`
                             # shows 0 misses; after misses the gate is union. Never flipped by a model.
runner:                      # fieldkit ci runner: the shard asks the machine, the xdist worker count follows RAM and CPUs
  mb_per_worker: 700         # one pytest worker's memory
  reserve_mb: 1500           # left for the OS and the runner agent
  min_ram_mb: 3000           # under this the shard would be killed, not slow
  max_workers: 8
