[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fieldkit"
version = "0.7.3"
description = "Deterministic tools, harnesses and orchestration for coding agents: office documents, staged build pipelines, build-log triage, privacy scanning. Windows 11 and Debian."
requires-python = ">=3.11"
license = {text = "AGPL-3.0-or-later"}
dependencies = [
  "pyyaml>=6",
  "lxml>=5",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "python-pptx>=1.0",
  "reportlab>=4",
  "pypdfium2>=4",
  "pdfplumber>=0.10",      # study materials, page by page (academic/read_sources.py)
  "fluent.syntax>=0.19",   # Mozilla's Fluent parser: .ftl files of a port must parse (buildh/fluent.py)
  # netbench (already imported by it; undeclared, so CI could not even collect its tests since 2026-10-04):
  "psutil>=5.9",           # per-process CPU and memory of the browser under test (netbench/browser.py)
  "h2>=4.1",               # the local HTTP/2 test server netbench measures against (netbench/servers.py)
  "aioquic>=1.0",          # the local HTTP/3 test server (netbench/servers.py)
  "cryptography>=42",      # local test certificates (netbench, leakgate/extras.py)
  "dpkt>=1.9",             # reading packet captures (buildh/capture.py, leakgate)
  "pefile>=2023.2",        # reading Windows executables (leakgate/audit.py)
  "Pillow>=10",            # image checks (buildh/decisions.py image_sharp, icons)
  "numpy>=1.26",           # fieldkit icons build: recolouring the master picture (icons/iconkit.py)
]

[project.optional-dependencies]
test = ["pytest>=8"]
readers = ["markitdown", "docling"]
ocr = ["pytesseract", "pdf2image"]   # scanned study materials (academic/read_sources.py; needs Tesseract)

[project.scripts]
fieldkit = "fieldkit.cli:main"
fk = "fieldkit.aliases:main"          # short plain-English names for long commands (fieldkit/desk/aliases.yaml)

[tool.setuptools.packages.find]
include = ["fieldkit*"]

[tool.setuptools.package-data]
fieldkit = ["build/signatures/*.yaml", "build/api-drift/*.yaml", "build/pipelines/*.yaml", "desk/*.yaml", "desk/platform_index.json", "gdocs/*.md", "core/requirements.json", "build/ci/*.yml", "audio/*.yaml", "career/*.yaml", "career/trades/*.yaml", "icons/*.json", "academic/*.yaml", "academic/locales/*.yaml", "evidence/data/*.json", "win11/*.yaml", "method/*.yaml", "desk/size_help/*.txt", "mandate/*.yaml", "mandate/hooks/*/*", "scratch/owner/*.ps1", "mandate/prereqs/*.ps1", "peers/*.yaml", "lifecycle/*.yaml", "github/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests", "local/tests"]
addopts = "-p no:cacheprovider"
