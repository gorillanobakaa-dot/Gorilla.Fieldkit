  swap: ['if "Basic Render" in name:', 'if "never" in name:']
  why: the software renderer is never a video engine
- file: kits/gpudecode/gpudecode.py
  swap: ['elif len(vg) == 1:', 'elif len(vg) >= 1:']
  why: two GPUs with video engines are UNKNOWN, never guessed
