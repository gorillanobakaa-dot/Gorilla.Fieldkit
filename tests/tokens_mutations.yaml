# python -m fieldkit mutate --plan tests/tokens_mutations.yaml -- python -m pytest -q tests/test_tokens_session_cost.py tests/test_tokens_token_audit.py tests/test_tokens_since_daily.py -p no:cacheprovider
# Every rule the session-cost and token-audit tests claim to hold, broken on purpose once. All must be CAUGHT.
# (moved with the meters from the local kit TokenAudit, 2026-10-26)
- file: fieldkit/tokens/session_cost.py
  swap: ["if not u or mid in seen:", "if not u:"]
  why: "Claude Code: one reply written as several lines is one call (dedupe by message id)"
- file: fieldkit/tokens/session_cost.py
  swap: ['return [path] + sorted((path.with_suffix("") / "subagents").glob("*.jsonl"))', "return [path]"]
  why: "Claude Code: subagent transcripts belong to the session's bill"
