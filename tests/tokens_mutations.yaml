  swap: ['if msg.get("model") == "<synthetic>":', "if False:"]
  why: "Claude Code: <synthetic> lines are not API calls"
- file: fieldkit/tokens/session_cost.py
  swap: ["w - w1h, w1h,", "w, 0,"]
  why: "Claude Code: 1-hour cache writes cost more than 5-minute ones"
- file: fieldkit/tokens/session_cost.py
  swap: ['end = chunk.rfind(b"\n") + 1', "end = len(chunk)"]
  why: "live: a half-written line is read when it is complete, not dropped"
