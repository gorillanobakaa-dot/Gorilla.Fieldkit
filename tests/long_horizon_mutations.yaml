- file: fieldkit/autopilot/budget.py
  swap: ['        if t.timestamp() <= now:', '        if False:']
  why: a reset time already past today is tomorrow
- file: fieldkit/autopilot/budget.py
  swap: ['        if ap == "pm" and h < 12:', '        if False:']
  why: 3pm is 15:00
