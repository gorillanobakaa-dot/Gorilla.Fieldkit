# step 1: budgets and what ended a run
- file: fieldkit/autopilot/budget.py
  swap: ['DEFAULT = {"turns": 10000,', 'DEFAULT = {"turns": 40,']
  why: the turn budget defaults to 10000 (owner 2026-10-22), not 40
- file: fieldkit/autopilot/budget.py
  swap: ['elif share >= 0.8 and not checkpointed_since(d, m.get("mark80")):', 'elif False:']
  why: at 80 % a checkpoint is forced before any further work
- file: fieldkit/autopilot/budget.py
  swap: ['if share >= 1.0 and which != "turns":', 'if False:']
  why: past 100 % of the wall or dollar budget only a checkpoint is allowed
- file: fieldkit/autopilot/budget.py
  swap: ['if "handoff.md" in text and', 'if False and']
  why: writing HANDOFF.md is always allowed, or a forced checkpoint deadlocks
- file: fieldkit/autopilot/budget.py
  swap: ['due = [lv for lv in LEVELS if share * 100 >= lv and lv not in m.get("said", [])]', 'due = []']
  why: the job is told at 50 / 80 / 95 %
- file: fieldkit/autopilot/budget.py
  swap: ['    if r.get("timed_out"):', '    if False:']
  why: a killed run is a wall-budget end, not a crash
- file: fieldkit/autopilot/budget.py
  swap: ['res.get("subtype") == "error_max_turns"', 'res.get("subtype") == "never"']
  why: the turn cap is a budget end (resumable), not a failure
- file: fieldkit/autopilot/budget.py
  swap: ['    if USAGE.search(text):', '    if False:']
  why: a usage-limit answer is a planned pause
- file: fieldkit/autopilot/budget.py
  swap: ['    if RATE.search(text) and', '    if False and']
