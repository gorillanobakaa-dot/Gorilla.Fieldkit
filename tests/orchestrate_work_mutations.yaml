# Rules the job kinds run and agent (stage O3) must hold. Every one CAUGHT:
#   fieldkit mutate --plan tests/orchestrate_work_mutations.yaml -- python -m pytest -q -x -p no:cacheprovider tests/test_orchestrate_work.py
- file: fieldkit/orchestrate_work.py
  swap: ['        if argv[0] in REFUSED:', '        if False:']
  why: a job never runs the commands that approve, push, publish or start agents
- file: fieldkit/orchestrate_work.py
  swap: ['        if not CMD.fullmatch(argv[0]):', '        if False:']
  why: a run job is a Fieldkit command name, never a shell line
- file: fieldkit/orchestrate_work.py
  swap: ['            not isinstance(g, str) or link_transfer_bad(g) for g in pats):', '            not isinstance(g, str) for g in pats):']
  why: artefact patterns stay inside the tree
- file: fieldkit/orchestrate_work.py
  swap: ['    if not 1 <= wall <= 1440:', '    if False:']
  why: a job has a wall cap of 1 to 1440 minutes
- file: fieldkit/orchestrate_work.py
  swap: ['    if rec is None:', '    if False:']
  why: a worker runs only a tree that arrived with the digest the job names
- file: fieldkit/orchestrate_work.py
  swap: ['    if jobs.busy(lock, cap):', '    if False:']
  why: one job at a time per worker
- file: fieldkit/orchestrate_work.py
  swap: ['            shutil.copytree(src, tree, symlinks=True)', '            tree = src']
  why: the job runs on a copy; received/ is never changed
- file: fieldkit/orchestrate_work.py
  swap: ['        status = "pass" if rc == 0 and not missing and not bad else "fail"', '        status = "pass" if rc == 0 else "fail"']
  why: a missing or undelivered artefact fails the job
- file: fieldkit/orchestrate_work.py
  swap: ['            out.append({"name": p.relative_to(tree).as_posix(), "size": p.stat().st_size, "sha256": _sha(p),', '            out.append({"name": p.relative_to(tree).as_posix(), "size": p.stat().st_size, "sha256": "",']
  why: every artefact carries its sha256 in the result
- file: fieldkit/orchestrate_work.py
  swap: ['            pin_model(tree, model)', '            pass']
  why: the agent run uses the model the job names (default a cheap Gemini), pinned in the tree copy
- file: fieldkit/orchestrate_work.py
  swap: ['        if job["kind"] == "agent" and job.get("brain"):', '        if False:']
  why: a model loaded on a local brain is unloaded when the job ends
- file: fieldkit/orchestrate_work.py
  swap: ['        elif _sha(where) != a.get("sha256"):', '        elif False:']
  why: the boss takes an artefact only if its bytes still have the sha256 the worker signed
- file: fieldkit/orchestrate_work.py
  swap: ["    why = check_work(req)\n    if why:\n        return None, why, None", "    why = None"]
  why: the boss refuses a bad job before any tree crosses the cable
- file: fieldkit/orchestrate_work.py
  swap: ['    if led.get(jid, {}).get("status") in ("sent", "pass"):', '    if False:']
  why: a job already sent or passed is not sent twice
- file: fieldkit/mandate/jobs.py
  swap: ['    fields = RESULT_FIELDS + (("artefacts",) if "artefacts" in r else ())', '    fields = RESULT_FIELDS']
  why: the worker's signature covers the artefacts list
- file: fieldkit/mandate/jobs.py
  swap: ["    if kind in WORK_KINDS:\n        from .. import orchestrate_work", "    if False:\n        from .. import orchestrate_work"]
  why: run and agent jobs go to orchestrate_work after the mandate and boss checks
- file: fieldkit/orchestrate_work.py
  swap: ['    if (platform or sys.platform) == "win32":', '    if False:']
  why: on Windows every run job goes through fieldkit guard (the fan check), whatever the boss sent
- file: fieldkit/orchestrate_work.py
  swap: ['            argv = [exe, "-p", job["brief"], "-c", str(tree), "-q"]', '            argv = [exe, "-p", job["brief"], "-c", str(tree)]']
  why: the agent run hides the spinner; a worker with no console was ended by 0xC000013A without it (live, Windows)
# 2026-10-27, the job in a container (fieldkit/core/contain.py): a job on a worker can never hang silently
- file: fieldkit/orchestrate_work.py
  swap: ['                           stdout_path=str(log), merge=True, idle_s=idle_s)', '                           stdout_path=str(log), merge=True, idle_s=None)']
  why: a job with no output and no CPU for the stall limit is stopped as a STALL, not left to the wall cap
- file: fieldkit/orchestrate_work.py
  swap: ['                           stdout_path=str(log), merge=True, idle_s=idle_s)', '                           stdout_path=str(log), merge=False, idle_s=idle_s)']
  why: the job's stderr goes to job.log with its stdout
- file: fieldkit/orchestrate_work.py
  swap: ['                           stdout_path=str(log), merge=True, idle_s=idle_s)', '                           stdout_path=None, merge=True, idle_s=idle_s)']
  why: the job's output goes to job.log through a file, never a pipe, and the boss gets its tail
- file: fieldkit/orchestrate_work.py
  swap: ['        return contain.run([str(a) for a in argv], label=label, deadline_s=deadline_s, cwd=str(cwd), env=env,', '        return contain.run([str(a) for a in argv], label=label, deadline_s=None, cwd=str(cwd), env=env,']
  why: the wall cap is the container's deadline; on expiry the whole tree is stopped, grandchildren included
- file: fieldkit/orchestrate_work.py
  swap: ['    own = liveness.beacon("job", label, label).start() if liveness.current() is None else None', '    own = None']
  why: the detached worker opens its own liveness beacon, so fieldkit liveness check sees the job and its members
- file: fieldkit/orchestrate_work.py
  swap: ["        if own:\n            own.close()", "        pass"]
  why: the job's beacon is closed when it ends (no stale run file, no current beacon left behind)
- file: fieldkit/orchestrate_work.py
  swap: ['    elif o.status == "stalled":', '    elif False:']
  why: a stall reaches the boss as a concern naming the kept tail
- file: fieldkit/orchestrate_work.py
  swap: ['    if o.leftovers:', '    if False:']
  why: processes the job left running (and the container stopped) are reported to the boss
- file: fieldkit/orchestrate_work.py
  swap: ['    if not o.contained:', '    if False:']
  why: a refused container is reported, never hidden
- file: fieldkit/orchestrate_work.py
  swap: ['    rc = o.rc if o.status in ("ok", "fail") else None', '    rc = o.rc']
  why: a job stopped by the harness (timeout, stall) has no exit code of its own; its evidence says so
- file: fieldkit/orchestrate_work.py
  swap: ['        if o.status == "error":', '        if False:']
  why: a command that could not start is not-run with the reason, never a pass or a bare fail
- file: fieldkit/orchestrate_work.py
  swap: ['        if more:', '        if False:']
  why: a wall cap, stall or leftover line is written into job.log itself, so the log tells the story
- file: fieldkit/orchestrate_work.py
  swap: ['    return float(os.environ.get("FIELDKIT_IDLE_MINUTES") or STALL_MINUTES) * 60', '    return float(STALL_MINUTES) * 60']
  why: FIELDKIT_IDLE_MINUTES (the same knob as autopilot claude) sets the stall limit
