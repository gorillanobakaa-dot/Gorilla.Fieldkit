# CI test selection (R7): every rule broken once; all CAUGHT.
#   python -m fieldkit mutate --plan tests/ci_tests_mutations.yaml -- python -m pytest -q -x -p no:cacheprovider tests/test_ci_tests.py
- file: .github/ci_tests.py
  swap: ["    if unmapped:\n", "    if False:\n"]
  why: "a change no test covers runs the whole suite"
- file: .github/ci_tests.py
  swap: ["if not MUTATION_PLAN.match(", "if not MUTATION_PLAN.search(\"^$\" + "]
  why: "mutation plans never pull in the whole suite"
- file: .github/ci_tests.py
  swap: ["    if plan.get(\"no_code\") or plan.get(\"docs_only\"):", "    if False:"]
  why: "a docs-only change runs nothing"
- file: .github/ci_tests.py
  swap: ["        return None, f\"testcost plan gave no answer", "        return [], f\"testcost plan gave no answer"]
  why: "no answer from testcost is the whole suite, never nothing"
- file: .github/ci_tests.py
  swap: ["    if tests == []:\n        return 0", "    if False:\n        return 0"]
  why: "an empty selection runs no pytest"
- file: .github/ci_tests.py
  swap: ["    return bool(a) and a == b", "    return bool(a)"]
  why: "only an equal tree skips the push run"
- file: .github/ci_tests.py
  swap: ["plan.get(\"no_code\") or plan.get(\"docs_only\")", "plan.get(\"docs_only\")"]
  why: "a no-code diff (version line only) runs nothing"
