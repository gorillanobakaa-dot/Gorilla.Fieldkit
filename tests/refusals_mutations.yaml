# fieldkit refusals (plan R14): every mutation must be CAUGHT:
#   fieldkit mutate --plan tests/refusals_mutations.yaml -- python -m pytest -q -x -p no:cacheprovider tests/test_refusals.py
- file: fieldkit/refusals.py
  swap:
  - f.write(json.dumps(row)
  - f.write(str("")
  why: the refusal is never written
- file: fieldkit/refusals.py
  swap:
  - '    lines.insert(last + 1, '
  - '    lines.append('
  why: the row is not written inside the table
- file: fieldkit/refusals.py
  swap:
  - "    if f\"{MARK}{key} (\" in body:\n        return 0\n"
  - ''
  why: a third refusal opens a second row
- file: fieldkit/refusals.py
  swap:
  - 'REPEAT = 2 '
  - 'REPEAT = 3 '
  why: the second refusal does not open the row
- file: fieldkit/refusals.py
  swap:
  - '[0-9a-f]{7,40}'
  - '[0-9a-f]{70,400}'
  why: a different head is a different reason
- file: fieldkit/refusals.py
  swap:
  - '"| OPEN |" in x'
  - 'True'
  why: a closed row still counts as open
- file: fieldkit/method/train.py
  swap:
  - '        refusals.record("train", f"{what}: {kw.get(''why'', '''')}")'
  - '        pass'
  why: train refusals are not recorded
- file: fieldkit/method/__init__.py
  swap:
  - '        refusals.record("ship", f"{data[''state'']}: {data.get(''error'') or ''''}")'
  - '        pass'
  why: ship refusals are not recorded
- file: fieldkit/refusals.py
  swap:
  - "                if r[\"id\"] in have:\n                    continue\n"
  - ''
  why: the same row from the other computer is added twice
- file: fieldkit/refusals.py
  swap:
  - '    if len(rows) < REPEAT and not ro:'
  - '    if len(rows) < REPEAT and False:'
  why: a single refusal opens a defect
- file: fieldkit/refusals.py
  swap:
  - '    if cur.get("readonly"):'
  - '    if False:'
  why: a read-only false positive closes without a passing test
- file: fieldkit/refusals.py
  swap:
  - '        if r.get("machine") not in (None, "", me):'
  - '        if False:'
  why: rows that came from the other computer are sent back to it
- file: fieldkit/refusals.py
  swap:
  - '        if any((tasks.get(j) or {}).get("hash") == brief_hash'
  - '        if not any((tasks.get(j) or {}).get("hash") == brief_hash'
  why: the task runner blocks the wrong brief
- file: fieldkit/refusals.py
  swap:
  - '        if is_stop(text):'
  - '        if False:'
  why: a budget stop of a read opens a blocking defect again (the 2026-11-11 restart refusal)
- file: fieldkit/refusals.py
  swap:
  - ' and not is_stop(dfx.get("last")):'
  - ':'
  why: a stop defect opened before the fix still blocks the restart
- file: fieldkit/refusals.py
  swap:
  - ' and not r.get("stop") and not is_stop(r.get("text"))]'
  - ']'
  why: stop rows count toward a defect
