# fieldkit ship's credential inside an autopilot run (2026-10-28, inbox #145): every mutation must be CAUGHT:
#   fieldkit mutate --plan tests/ship_credential_mutations.yaml -- python -m pytest -q -x -p no:cacheprovider tests/test_ship_credential.py
- file: fieldkit/method/ship.py
  swap:
  - "    if env.get(\"FIELDKIT_AUTOPILOT\") == \"1\":\n        for k in"
  - "    if True:\n        for k in"
  why: only inside a run does ship undo the hiding
- file: fieldkit/method/ship.py
  swap:
  - "            if not env.get(k):                        # the run's blanks; a real value was never put there\n                env.pop(k, None)"
  - '            env.pop(k, None)'
  why: only the run's blanks are removed
- file: fieldkit/method/ship.py
  swap:
  - '        if env.get("GIT_CONFIG_KEY_0") == "credential.helper" and not env.get("GIT_CONFIG_VALUE_0"):'
  - '        if True:'
  why: only the run's credential.helper blank is removed
- file: fieldkit/method/ship.py
  swap:
  - '        env["GH_CONFIG_DIR"] = _real_gh_config(env)

    '
  - ''
  why: gh gets its own config folder back
- file: fieldkit/method/ship.py
  swap:
  - '        env.pop("FIELDKIT_REAL_GH_CONFIG_DIR", None)

    '
  - ''
  why: the recorded folder is not passed on
- file: fieldkit/method/ship.py
  swap:
  - '            capture_output=True, text=True, env=ship_env())'
  - '            capture_output=True, text=True)'
  why: gh release runs with ship's environment
- file: fieldkit/method/train.py
  swap:
  - '                     cwd=self.repo, timeout=timeout, env=ship_env())'
  - '                     cwd=self.repo, timeout=timeout)'
  why: ci-wait's gh calls run with ship's environment
- file: fieldkit/autopilot/run.py
  swap:
  - '    env["FIELDKIT_REAL_GH_CONFIG_DIR"] = (base if base is not None else os.environ).get("GH_CONFIG_DIR", "")

    '
  - ''
  why: the run records where gh kept its account
- file: fieldkit/autopilot/hardlines.py
  swap:
  - '    if cmd is not None and REARM.search(cmd):'
  - '    if False:'
  why: re-arming a credential is refused
- file: fieldkit/autopilot/hardlines.py
  swap:
  - auth\s+(token|login|setup-git|refresh)
  - auth\s+(nothing)
  why: gh auth token is refused
- file: fieldkit/autopilot/hardlines.py
  swap:
  - FIELDKIT_REAL_GH_CONFIG_DIR)\s*=|credential\.helper|"
  - FIELDKIT_REAL_GH_CONFIG_DIR)\s*=|"
  why: a credential helper set on the command line is refused
- file: fieldkit/autopilot/hardlines.py
  swap:
  - '|\bunset\s+[^\n;&|]*\b(GH_CONFIG_DIR|GIT_CONFIG_)'
  - ''
  why: unsetting the run's blanks is refused
