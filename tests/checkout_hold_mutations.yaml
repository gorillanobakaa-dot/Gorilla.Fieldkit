- file: fieldkit/core/sync.py
  swap:
  - '    if held:'
  - '    if False and held:'
  why: sync --apply never moves a held checkout
- file: fieldkit/method/train.py
  swap:
  - '    if held:'
  - '    if False and held:'
  why: ship unfreeze never moves a held checkout
- file: fieldkit/emerge/runner.py
