# Version: 1.0.0 · updated 26-10-28-19-50
# Rules of the no-AI workers (HARNESS-PLAN C3, 2026-10-28). Every one CAUGHT:
#   fieldkit mutate --plan tests/c3_workers_mutations.yaml -- python -m pytest -q -x -p no:cacheprovider tests/test_c3_workers.py
- file: fieldkit/orchestrate_work.py
  swap: ['        if req.get("plain"):', '        if False:']
  why: a plain run job is checked against PROGRAMS, not as a Fieldkit command
- file: fieldkit/orchestrate_work.py
  swap: ['    if "/" in name or "\\" in name or name not in PROGRAMS:', '    if "/" in name or "\\" in name:']
  why: a plain job starts only a build or test program (no shell, no git, no curl)
- file: fieldkit/orchestrate_work.py
  swap: ['    if "/" in name or "\\" in name or name not in PROGRAMS:', '    if name not in PROGRAMS and "/" not in name:']
  why: a plain job names a bare program, never a path
- file: fieldkit/orchestrate_work.py
  swap: ['    if argv[1:2] and argv[1] in PROGRAMS[name]:', '    if False:']
  why: the subcommands that publish, log in or run any code are refused
- file: fieldkit/orchestrate_work.py
  swap: ['or argv[2] not in PY_MODULES):', 'and False):']
  why: python in a plain job runs only `-m` with a test or build module
- file: fieldkit/orchestrate_work.py
  swap: ['        cmd = [exe, *args[1:]]', '        cmd = [*me, *args]']
  why: a plain job runs the program itself, not `fieldkit PROGRAM`
