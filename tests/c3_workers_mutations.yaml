  swap: ["        if not exe:\n            raise RuntimeError(f\"{args[0]} is not installed", "        if False:\n            raise RuntimeError(f\"{args[0]} is not installed"]
  why: a program the worker does not have is not-run with the reason
- file: fieldkit/orchestrate_work.py
  swap: ['    return found if found is not None else other_counts(text)', '    return found']
  why: go test, cargo test and ctest jobs are judged by their own test count
