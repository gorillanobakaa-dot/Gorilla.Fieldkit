  swap: ['            c["failed"] += int(cargo[2])', '            pass']
  why: a cargo test failure fails the job
- file: fieldkit/orchestrate_work.py
  swap: ['            c["failed"] += int(ctest[1])', '            pass']
  why: a ctest failure fails the job
- file: fieldkit/orchestrate_work.py
  swap: ['GO_OK = re.compile(r"^ok\s+\S+(?!.*\[no tests to run\])")', 'GO_OK = re.compile(r"^ok\s+\S+")']
  why: a go package with no tests to run is no passing test
- file: fieldkit/orchestrate_work.py
  swap: ['            req["plain"] = True', '            pass']
  why: the boss tells the worker the line is a plain program
