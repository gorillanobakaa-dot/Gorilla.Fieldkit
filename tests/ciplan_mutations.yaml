# fieldkit ci durations: every fail-closed rule must be CAUGHT.
#   fieldkit mutate --plan tests/ciplan_mutations.yaml -- python -m pytest -q -x -p no:cacheprovider tests/test_ciplan.py
- file: fieldkit/method/ciplan.py
  swap:
  - '    if age is None or age > MAX_AGE_DAYS:'
  - '    if False:'
  why: stale durations must fail the selection closed
- file: fieldkit/method/ciplan.py
  swap:
  - '        if coverage[o] < MIN_COVERAGE:'
  - '        if False:'
  why: low coverage must fail the selection closed
- file: fieldkit/method/ciplan.py
  swap:
  - '    rated = [f for f in selected if f not in set(new_files)]'
  - '    rated = list(selected)'
  why: files the PR adds must not count against coverage
- file: fieldkit/method/ciplan.py
  swap:
  - '    d["tests"][os_name] = dict(new) if complete else {**d["tests"][os_name], **new}'
  - '    d["tests"][os_name] = {**d["tests"][os_name], **new}'
  why: a whole-suite run must drop deleted tests
- file: fieldkit/method/ciplan.py
  swap:
  - '        weights[o] = {f: round(files.get(f, guess), 3) for f in selected}'
  - '        weights[o] = {f: round(files.get(f, 0.0), 3) for f in selected}'
  why: an unknown test must weigh the p90
