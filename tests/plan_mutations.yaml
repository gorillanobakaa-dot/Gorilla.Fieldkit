- file: fieldkit/plan.py
  swap:
  - f"{added[-1]}..{tip}"
  - tip
  why: merges older than the plan are not read
- file: fieldkit/plan.py
  swap:
  - '        m = TAIL_PAREN.search(title)

    '
  - '        m = re.search(r"(.*)", title)

    '
  why: only the trailing parenthesis names items
- file: fieldkit/plan.py
  swap:
  - line.rstrip().endswith("| PLANNED |")
  - 'True'
  why: only PLANNED cells are written
- file: fieldkit/plan.py
