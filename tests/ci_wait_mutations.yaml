# O4 ci-wait (2026-10-28): every mutation must be CAUGHT:
#   fieldkit mutate --plan tests/ci_wait_mutations.yaml -- python -m pytest -q -x -p no:cacheprovider tests/test_ci_wait.py tests/test_autopilot_toolrouter.py
- file: fieldkit/method/train.py
  swap:
  - '    if not ok or after != "MERGED":'
  - '    if not ok:'
  why: the merge is proven by the PR state, not gh's exit code
- file: fieldkit/method/train.py
  swap:
  - "    if state != \"green\":\n        return dict(r, ok=False, state=\"timeout\""
  - "    if state == \"none\":\n        return dict(r, ok=False, state=\"timeout\""
  why: a timeout is never green
- file: fieldkit/method/train.py
  swap:
  - '        return dict(r, ok=False, log=gh.failed_log(head),'
  - '        return dict(r, ok=False, log=[],'
  why: red carries the failed log
- file: fieldkit/method/train.py
  swap:
  - '    if not merge:'
  - '    if merge:'
  why: no merge unless asked
- file: fieldkit/autopilot/toolrouter.py
  swap:
  - '[^|;\n]*--watch\b|'
  - '|'
  why: gh pr checks --watch is a CI wait by hand
# P9 infra re-run (2026-11-11, PR 461):
#   fieldkit mutate --plan tests/ci_wait_mutations.yaml -- python -m pytest -q -x -p no:cacheprovider tests/test_ci_wait.py
- file: fieldkit/method/train.py
  swap:
  - '        if k > strikes.INFRA_RERUNS:'
  - '        if False:'
  why: the automatic re-runs are bounded per head
- file: fieldkit/method/train.py
  swap:
  - '        if not inf or not hasattr(gh, "rerun_failed"):'
  - '        if not hasattr(gh, "rerun_failed"):'
  why: only a red the infra signatures recognise is re-run; a test failure stays a strike
- file: fieldkit/method/train.py
  swap:
  - '        sleep(strikes.infra_backoff(k))'
  - '        pass'
  why: a re-run waits its backoff first
- file: fieldkit/method/train.py
  swap:
  - "        if not ok:\n            return dict(r, ok=False, state=\"infra\""
  - "        if False:\n            return dict(r, ok=False, state=\"infra\""
  why: a refused re-run is reported, not waited on
