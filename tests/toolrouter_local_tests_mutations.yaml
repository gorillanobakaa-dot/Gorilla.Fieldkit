- file: fieldkit/autopilot/toolrouter.py
  swap: ['    cmd = MUTATE_RUN.sub("", cmd)', '    cmd = cmd']
  why: a mutation run is the rules' own proof and passes
- file: fieldkit/autopilot/toolrouter.py
  swap: ['    cmd = "".join("" if SEARCH.match(x) else x for x in re.split', '    cmd = "".join(x for x in re.split']
