# no code, no tests (R7): every rule broken once; all CAUGHT.
#   python -m fieldkit mutate --plan tests/testcost_mutations.yaml -- python -m pytest -q -x -p no:cacheprovider tests/test_testcost.py
- file: fieldkit/testcost.py
  swap: ["    return path in VERSION_FILES and bool(lines) and", "    return bool(lines) and"]
  why: "only the version files may be version-only"
- file: fieldkit/testcost.py
  swap: ["VERSION_LINE.match(l[1:]) for l in lines", "True for l in lines"]
  why: "a version file with any other changed line is code (the diff is inspected, not the filename)"
- file: fieldkit/testcost.py
  swap: ["    return path in VERSION_FILES and bool(lines) and", "    return path in VERSION_FILES and"]
  why: "a version file with no readable diff is code"
- file: fieldkit/testcost.py
  swap: ["        if q.startswith(NON_CODE_TREES) or is_version_only(", "        if is_version_only("]
  why: "state/ selects no tests"
- file: hooks/pre-commit
  swap: ['echo "pre-commit: ${TC_WHY:-no test covers the staged files} - nothing runs here', 'echo "pre-commit: no test covers the staged files - nothing runs here']
  why: the hook prints testcost's own reason when nothing runs, never a false "no test covers"
# every file mapped (2026-11-02)
- file: fieldkit/testcost.py
  swap: ['        if rows:                                       # a mapped file', '        if False:                                       # a mapped file']
  why: tests/testmap.yaml globs select their tests
- file: fieldkit/testcost.py
  swap: ['        if not hits and q.startswith("fieldkit/"):     # no test names it', '        if False:     # no test names it']
  why: a file inside a package no test names selects the package's tests, not the whole suite
- file: fieldkit/testcost.py
  swap: ['        if MUTATION_PLAN.search(q):', '        if False:']
  why: a mutation plan selects the test it mutates
- file: fieldkit/testcost.py
  swap: ['tests_dir.rglob("test_*.py")', 'tests_dir.glob("test_*.py")']
  why: tests in subfolders (tests/capture/) are found
- file: fieldkit/testcost.py
  swap: ['        return 3 if u else 0', '        return 0']
  why: testcost unmapped exits 3 when any file is unmapped
# shared registries select only what changed (Worker 5, 2026-11-03: cli.py + tools.yaml selected 142 test files)
- file: fieldkit/testcost.py
  swap: ["        if q in REGISTRY_INTEGRITY:  ", "        if False:  "]
  why: a registry edit selects the tests of what changed in it, not every importer
- file: fieldkit/testcost.py
  swap: ["    if set(olds) - set(news):", "    if False:"]
  why: a removed tools entry cannot be proven safe, so the wide mapping stays
- file: fieldkit/testcost.py
  swap: ["    changed = [i for i, e in news.items() if olds.get(i) != e]", "    changed = []"]
  why: the tests of the entry that changed are selected
