# fieldkit budget (fieldkit/tokens/budget.py), the open-PR guard and the ci-wait wake (fieldkit/method/ci_wake.py) and
# the hook that carries both (fieldkit/tokens/rotate.py): each rule broken once; every one must be CAUGHT.
#   python -m fieldkit mutate --plan tests/budget_mutations.yaml -- python -m pytest -q -x -p no:cacheprovider tests/test_budget.py tests/test_ci_wake.py
- file: fieldkit/tokens/budget.py
  swap: ["    if frac >= STOP:", "    if frac > STOP:"]
  why: "90% is STOP, not above it"
- file: fieldkit/tokens/budget.py
  swap: ["    if frac >= HALF:", "    if frac > HALF:"]
  why: "50% is HALF, not above it"
- file: fieldkit/tokens/budget.py
  swap: ["    return max(row.get(\"context_last\", 0)", "    return min(row.get(\"context_last\", 0)"]
  why: "the budget is the worse of the two meters, not the better"
- file: fieldkit/tokens/budget.py
  swap: ["    if lv is None or m.get(\"told\") == \"STOP\" or", "    if lv is None or"]
  why: "the 90% handover is written once, not at every prompt"
- file: fieldkit/tokens/budget.py
  swap: ["        if sid == row_sid or sid[:8] in zero:", "        if sid == row_sid:"]
  why: "Zero is never on the archive list"
- file: fieldkit/tokens/budget.py
  swap: ["    if zero is None:", "    if False:"]
  why: "an unreadable net archives nothing (fail closed)"
- file: fieldkit/tokens/rotate.py
  swap: ["text = rotation_done_line(row, owner) if budget.handed_over(sid) else next_step(row, tp, owner)", "text = next_step(row, tp, owner)"]
  why: "after the 90% handover, ROTATE does not write a second one"
- file: fieldkit/method/ci_wake.py
  swap: ["        if st in (\"MERGED\", \"CLOSED\"):", "        if st == \"MERGED\":"]
  why: "a closed PR needs no wait"
- file: fieldkit/method/ci_wake.py
  swap: ["        if running(num, session, alive):\n            continue", "        if False:\n            continue"]
  why: "a PR with a live ci-wait does not fail the end of turn"
- file: fieldkit/method/ci_wake.py
  swap: ["    (waits_dir() / f\"pr-{int(pr)}.json\").unlink(missing_ok=True)", "    pass"]
  why: "the marker goes when the wait ends, or the guard passes forever"
- file: fieldkit/method/ci_wake.py
  swap: ["        f.unlink()\n", "        pass\n"]
  why: "a wake is read once, not at every hook"
- file: fieldkit/method/ci_wake.py
  swap: ["    with open(wake / f\"{_safe(session)}.txt\", \"a\", encoding=\"utf-8\") as f:", "    with open(wake / f\"{_safe('all')}.txt\", \"a\", encoding=\"utf-8\") as f:"]
  why: "the wake goes to the session that started the wait, not to every session"
- file: fieldkit/tokens/budget.py
  swap: ["        zero = (send or _send_zero)(ask)", "        raise RuntimeError(ask)"]
  why: "a refused visible successor goes to Zero first, never straight to headless"
- file: fieldkit/tokens/budget.py
  swap: ["    _log_successor({**rec, \"step\": \"refused\", \"line\": owner})", "    pass"]
  why: "the refusal is written where the owner sees it"
- file: fieldkit/tokens/budget.py
  swap: ["\"--model\", \"sonnet\", \"--pin\"]", "]"]
  why: "the last-resort headless start is pinned to Sonnet, never routed down to Haiku"
