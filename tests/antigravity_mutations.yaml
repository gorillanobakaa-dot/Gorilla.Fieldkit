# Antigravity bridge: each mutation must make tests/test_antigravity_bridge.py fail
- file: fieldkit/antigravity/bridge.py
  swap: ["--print=\" + prompt", "--print\", prompt"]
- file: fieldkit/antigravity/bridge.py
  swap: ["(a.version == 4 and a in CABLE_NET)", "(a.version == 4 and a.is_private)"]
- file: fieldkit/antigravity/bridge.py
  swap: ["body = str(text).replace(\"</untrusted-data\", \"<\\\\/untrusted-data\")", "body = str(text)"]
- file: fieldkit/antigravity/bridge.py
  swap: ["            if p.suffix != \".db\" or not _ID.match(p.stem):", "            if False:"]

# fieldkit antigravity: the wrapper rules must be CAUGHT (2026-11-15):
#   fieldkit mutate --plan tests/antigravity_mutations.yaml -- python -m pytest -q -x -p no:cacheprovider tests/test_antigravity.py
- file: fieldkit/antigravity/__init__.py
  swap:
  - '        return 1  # missing binary'
  - '        return 0  # missing binary'
  why: a missing binary must fail, never pass silently
- file: fieldkit/antigravity/__init__.py
  swap:
  - '        return run_tool(["doors", *rest])'
  - '        return run_tool(["mcp", *rest])'
  why: doors must reach the doors check
- file: fieldkit/antigravity/__init__.py
  swap:
  - '"--apply", "--verify", "--undo"'
  - '"--verify", "--undo"'
  why: --apply must select apply mode
