# Release gate for Fieldkit v0.1.0. Run before publishing: fieldkit release check releases/fieldkit-v0.1.0.yaml
name: fieldkit
repo: gorillanobakaa-dot/Gorilla.Fieldkit
local: "${FIELDKIT}"
tag: v0.1.0
tests:
  - [python, -m, pytest, -q, -p, no:cacheprovider]
artifacts:
  - {path: README.md}
  - {path: pyproject.toml}
  - {path: fieldkit/release.py}
  - {path: fieldkit/agent.py}
privacy: true
claims:
  - claim: "runs on Windows and Linux (GitHub Actions, windows-latest and ubuntu-latest)"
    find: "Windows and (Linux|Ubuntu)|windows-latest"
    # the tests workflow for the tagged commit must have passed on both runners
    proof:
      command: [python, -c, "import subprocess as s,json,sys; sha=s.run(['git','-C',sys.argv[1],'rev-list','-n1','v0.1.0'],capture_output=True,text=True).stdout.strip(); r=json.loads(s.run(['gh','run','list','-R','gorillanobakaa-dot/Gorilla.Fieldkit','-w','tests.yml','-c',sha,'--json','conclusion,status'],capture_output=True,text=True).stdout or '[]'); print('tests workflow for', sha[:7], ':', [x['conclusion'] for x in r]); sys.exit(0 if r and r[0]['conclusion']=='success' else 1)", "${FIELDKIT}"]
      output_contains: "\\['success'"
  - claim: "187 passed on a clean copy"
    find: "187 passed"
    proof: {command: [python, -m, pytest, -q, -p, no:cacheprovider], output_contains: "187 passed"}
  - claim: "the MCP server offers six tools"
    find: "six tools"
    proof: {command: [python, -c, "from fieldkit import mcp; print(len(mcp.TOOLS), 'tools:', [t['name'] for t in mcp.TOOLS])"], output_contains: "^6 tools"}
  - claim: "the release gate has no --force"
    find: "--force|override switch"
    # the gate must REFUSE --force: this proof passes only when argparse rejects it
    proof:
      command: [python, -c, "import subprocess as s,sys; r=s.run([sys.executable,'-m','fieldkit','release','check','releases/fieldkit-v0.1.0.yaml','--force'],capture_output=True,text=True); refused=r.returncode==2 and 'unrecognized arguments: --force' in r.stderr; print('--force refused' if refused else 'NOT REFUSED'); sys.exit(0 if refused else 1)"]
      output_contains: "--force refused"
  - claim: "the exam that produced the one-of-five / five-of-five figures is re-runnable and its graders are tested"
    find: "one of five|five of five|5 of 5"
    proof: {command: [python, -m, pytest, -q, -p, no:cacheprovider, tests/test_exam.py], output_contains: "passed"}
  - claim: "no telemetry: network code only where a command needs it (kernel download, exam's local model server)"
    find: "sends nothing|reports nothing|[Nn]o telemetry"
    proof:
      command: [python, -c, "import pathlib,re; hits=sorted(p.as_posix() for p in pathlib.Path('fieldkit').rglob('*.py') if re.search('^[ \t]*(import|from)[ \t]+(urllib|socket|requests|http[.]client|httpx)([^a-z_]|$)', p.read_text(encoding='utf-8'), re.M)); print('network imports in:', ' '.join(hits))"]
      output_contains: "network imports in: fieldkit/build/kernel.py fieldkit/exam/runner.py$"
