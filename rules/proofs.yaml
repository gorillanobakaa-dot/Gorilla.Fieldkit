    test: tests/test_testcost.py::test_the_plan_maps_a_module_to_the_tests_that_import_it
    mutate:
    - fieldkit/testcost.py
    - hits = {str(t) for t, ms in imports.items() if any(m == mod or m.startswith(mod + ".") for m in ms)}
    - hits = set()
  - demand: a passed tree is never re-tested (only a pass on the same tree key lets a check skip)
    test: tests/test_testcost.py::test_only_a_pass_on_the_same_tree_lets_a_check_skip
    mutate:
    - fieldkit/testcost.py
    - 'if r.get("check") == check and r.get("key") == key and r.get("status") == "pass":'
    - 'if r.get("check") == check and r.get("key") == key:'
  - demand: on the Windows laptop heavy commands (pytest suites, cargo, go, builds, mutate) outside `fieldkit guard` are
      refused
    test: tests/test_toolrouter_heavy.py::test_heavy_commands_are_refused_on_windows
    mutate:
    - fieldkit/autopilot/toolrouter.py
    - "    if not paths:\n        return True"
    - "    if False:\n        return True"
  gaps:
  - demand: 'Go: the touched packages, never ./...; Rust: the touched crate'
    why: 'buildable: testcost.plan maps only Python modules; go/cargo whole-tree runs are refused on Windows only by the
      heavy route, not narrowed to packages'
  - demand: the full suite runs once, when a project is finished
    why: 'buildable: a ''project finished'' marker that records full-suite runs and refuses a second one; pre-commit records
      full-suite skips by tree key only'
  - demand: one at a time (guard slot)
    why: the guard slot lives in fieldkit guard (admission); not mutated here
