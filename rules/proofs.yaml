# The proof of every rule in rules/rules.yaml (owner order 2026-10-31: every rule enforced by a tool).
# proofs: a demand, the test that holds it, and a mutation [file, old, new] that disables its enforcer; the
#   test must FAIL with it (`fieldkit rules prove` runs each through fieldkit mutate; `fieldkit rules lint`
#   checks the test exists and the swap text is in the file exactly once).
# gaps: a demand with no deterministic enforcer, and why (or "buildable: ...").
GOAL:
  proofs:
  - demand: a job's time is measured against the bare script and WARNs past overhead.max_ratio (time close to the pre-AI
      script)
    test: tests/test_overhead.py::test_line_names_ratio_and_where_the_time_went
    mutate:
    - fieldkit/overhead.py
    - '"WARN" if ratio > cfg["max_ratio"] else "OK"'
    - '"OK"'
  gaps:
  - demand: one command builds a whole product unattended
    why: covered by BUILDS (fieldkit emerge); no separate check of 'one command'
  - demand: a model is called only when a step fails, and its fix becomes a script
    why: 'buildable: emerge run report that fails when a green run recorded any model call; fix-becomes-script is not deterministic'
  - demand: 0 owner actions per job / 0 AI tokens when nothing fails
    why: 'buildable: fieldkit friction jobs and the token ledger measure it but nothing fails a run that exceeds 0; no test
      mutates them'
WORK UNATTENDED:
  proofs:
  - demand: one plain `fieldkit inbox add` is a note the router lets through (the owner-decision channel is never blocked)
    test: tests/test_autopilot_hardlines.py::test_an_inbox_note_that_names_publishing_is_a_note
    mutate:
    - fieldkit/autopilot/hardlines.py
    - 'if INBOX_NOTE.match(cmd) and _one_statement(cmd):'
    - 'if False:'
  - demand: a live session not in bypass-permissions mode is friction (can stop on a prompt)
    test: tests/test_zero_friction.py::test_desktop_rows_cards_waiting_and_mode
    mutate:
    - fieldkit/lifecycle/friction.py
    - s["mode"] and s["mode"] != "bypassPermissions"
    - 'False'
  - demand: '`fieldkit friction` exits 0 only when nothing blocks on the owner'
    test: tests/test_zero_friction.py::test_cli_friction_exit_codes
    mutate:
    - fieldkit/lifecycle/__init__.py
    - '    return 1 if n else 0'
    - '    return 0'
  gaps:
  - demand: never end a turn on a question
    why: 'buildable: a Stop hook that scans the last assistant message for a trailing question'
  - demand: no plan drafts waiting for approval / no per-step approvals / no session cards / no chains of commands for the
      owner to paste
    why: 'session cards and permission prompts are found by friction (test_scan_finds_only_cards_nobody_started_dismissed_or_let_expire
      exists, not mutated here); drafts and paste-chains are buildable: a check on inbox add commands for multi-command
      blocks'
  - demand: 'PRE-APPROVED: an approved plan or Zero order needs no further yes'
    why: a statement of permission, not an action; nothing to enforce
  - demand: stop only for a hard line or an owner-only decision
    why: judging 'only the owner may make' is not deterministic; the owner_decision field in rules.yaml is the register
HARD LINES:
  proofs:
  - demand: pushing/publishing (git push, gh release/pr merge, gh api writes, twine) is refused outside the mandate
    test: tests/test_autopilot_hardlines.py::test_publishing_is_never_the_models
    mutate:
    - fieldkit/autopilot/hardlines.py
    - 'return "deny", f"HARD LINE 1: {published} is the owner''s job (fieldkit publish, after the owner''s yes)"'
    - return "allow", "x"
  - demand: GORILLA_OWNER_APPROVED is never set by a model
    test: tests/test_autopilot_hardlines.py::test_owner_approvals_stay_the_owners
    mutate:
    - fieldkit/autopilot/hardlines.py
    - (r"gorilla_owner_approved", "the owner's own signature on a harness change"),
    - (r"gorilla_owner_approved_NEVER", "the owner's own signature on a harness change"),
  - demand: owner-only approvals (mandate keygen/trust, leakgate approve, build-harness accept) are refused
    test: tests/test_autopilot_hardlines.py::test_owner_approvals_stay_the_owners
    mutate:
    - fieldkit/autopilot/hardlines.py
    - 'return "deny", f"HARD LINE 4: {owner} is the owner''s alone; put it in the owner inbox (fieldkit inbox add)"'
    - return "allow", "x"
  - demand: 'main moves only by a PR merged on green CI: auto-merge is not turned on where the base branch requires no CI
      check'
    test: tests/test_ship_auto.py::test_no_auto_merge_where_the_base_branch_requires_no_check
    mutate:
    - fieldkit/method/ship.py
    - 'if "required_status_checks" not in rules:'
    - 'if False:'
  - demand: permanent deletes (rm -rf, git clean/reset --hard, --no-verify) outside scratch are refused
    test: tests/test_autopilot_hardlines.py::test_discarding_work_outside_scratch_is_refused
    mutate:
    - fieldkit/autopilot/hardlines.py
    - 'if any(DELETE.search(s) and not _scratch_only(s) for s in _statements(_delete_text(cmd))):'
    - 'if False:'
  - demand: a hand-written recursive delete is routed to `fieldkit size recycle`
    test: tests/test_autopilot_toolrouter.py::test_each_habit_is_routed_to_its_tool
    mutate:
    - fieldkit/autopilot/toolrouter.py
    - (-Recurse\b|\s-rf?\b|\s-fr\b|/s\b)
    - (-RecurseNEVER\b)
  - demand: weakening a check/guard/hook/rules file or changing a decision register is refused
    test: tests/test_autopilot_hardlines.py::test_protections_are_never_changed_by_a_model
    mutate:
    - fieldkit/autopilot/hardlines.py
    - 'if what and _writes(seg) and not (what == HOOK_WHAT and _opened(seg, transcript)):'
    - 'if False:'
  - demand: secret and credential files are never opened or written
    test: tests/test_autopilot_hardlines.py::test_credentials_are_not_even_read
    mutate:
    - fieldkit/autopilot/hardlines.py
    - 'return "deny", "HARD LINE 5: a credential file is never read or written by a model"'
    - return "allow", "x"
  - demand: telemetry/analytics/crash-report SDKs and endpoints are found by `fieldkit telemetry scan`
    test: tests/test_core_telemetry.py::test_the_source_scan_finds_sdks_endpoints_and_collectors_and_honors_a_reasoned_mark
    mutate:
    - fieldkit/core/telemetry.py
    - "                    m = pat.search(line)\n                    if m:\n                        row = {\"file\": p.relative_to(root).as_posix(),\
      \ \"line\": i, \"kind\": kind,\n                               \"match\": m.group(0), \"text\""
    - "                    m = None\n                    if m:\n                        row = {\"file\": p.relative_to(root).as_posix(),\
      \ \"line\": i, \"kind\": kind,\n                               \"match\": m.group(0), \"text\""
  - demand: never delete on GitHub (gh api -X DELETE)
    test: tests/test_autopilot_hardlines.py
    mutate:
    - fieldkit/autopilot/hardlines.py
    - (POST|PUT|PATCH|DELETE)
    - (POST|PUT|PATCH)
  gaps:
  - demand: prove a check wrong on a real tree before proposing a change
    why: 'not deterministic; buildable: a proposal record that must cite a failing run'
  - demand: never echo or commit secrets
    why: reading/writing named credential files is held; echoing a secret value and committing one are covered by fieldkit
      privacy scan, not mutated here
BUILDS:
  proofs:
  - demand: a stage is skipped only when its recorded outputs are still the recorded bytes (never re-run a stage the runner
      skipped; a changed output is not trusted)
    test: tests/test_emerge.py::test_a_changed_output_is_not_trusted
    mutate:
    - fieldkit/emerge/runner.py
    - 'or sha256_file(p) != o["sha256"]:'
    - ':'
  gaps:
  - demand: plan, then run in the background, then status
    why: 'ordering is not checked; buildable: emerge run refuses when no plan record exists for the recipe key'
  - demand: never hand-run stages
    why: 'buildable: a tool-router route for a recipe stage''s command line run outside fieldkit emerge'
  - demand: a project with no recipe gets one
    why: 'buildable: a check that every project in the registry has an emerge recipe'
TESTS ONCE:
  proofs:
